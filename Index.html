<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://drive.google.com">
    <link rel="preconnect" href="https://lh3.googleusercontent.com">
    <title>Study Shorts</title>
    <style>
      :root {
        color-scheme: dark;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      * { box-sizing: border-box; }
      .launch-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        padding: calc(var(--safe-top) + 28px) calc(var(--safe-right) + 22px) calc(var(--safe-bottom) + 28px) calc(var(--safe-left) + 22px);
        overflow: auto;
        background:
          radial-gradient(circle at 50% 10%, rgb(103 232 249 / 21%), transparent 34%),
          radial-gradient(circle at 12% 88%, rgb(167 139 250 / 18%), transparent 36%),
          linear-gradient(180deg, #111318 0%, #050506 58%, #000 100%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .launch-screen[hidden] { display: none; }
      .launch-card {
        width: min(100%, 380px);
        padding: 30px 22px 22px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 26px;
        background: rgb(12 13 16 / 80%);
        box-shadow: 0 28px 80px rgb(0 0 0 / 54%);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }
      .launch-brand {
        display: grid;
        justify-items: center;
        gap: 10px;
        margin-bottom: 30px;
        text-align: center;
      }
      .launch-icon {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 22px;
        background: linear-gradient(145deg, rgb(103 232 249 / 26%), rgb(139 92 246 / 24%));
        box-shadow: 0 16px 42px rgb(0 0 0 / 36%), inset 0 1px 0 rgb(255 255 255 / 18%);
        font-size: 34px;
      }
      .launch-kicker {
        margin: 0;
        color: #67e8f9;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: .18em;
      }
      .launch-title {
        margin: 0;
        font-size: clamp(34px, 10vw, 48px);
        font-weight: 950;
        line-height: 1;
        letter-spacing: -.045em;
      }
      .launch-subtitle {
        margin: 0;
        color: rgb(255 255 255 / 58%);
        font-size: 13px;
        font-weight: 700;
      }
      .launch-field { display: grid; gap: 9px; }
      .launch-label {
        color: rgb(255 255 255 / 72%);
        font-size: 12px;
        font-weight: 900;
      }
      .launch-select {
        width: 100%;
        min-height: 54px;
        padding: 0 16px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 14px;
        background: #1a1c21;
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 850;
        outline: none;
      }
      .launch-select:focus { border-color: rgb(103 232 249 / 72%); }
      .launch-start {
        width: 100%;
        min-height: 54px;
        margin-top: 14px;
        border: 0;
        border-radius: 14px;
        background: #fff;
        color: #08090b;
        font: inherit;
        font-size: 15px;
        font-weight: 950;
        box-shadow: 0 14px 32px rgb(0 0 0 / 34%);
      }
      .launch-start:disabled { opacity: .38; }
      .launch-status {
        min-height: 18px;
        margin: 11px 0 0;
        color: rgb(255 255 255 / 54%);
        text-align: center;
        font-size: 12px;
        font-weight: 750;
      }
    </style>
    <script>
      (() => {
        const LAST_BOOK_KEY = 'study-shorts-last-book-v1';

        function savedBookName(names) {
          try {
            const saved = localStorage.getItem(LAST_BOOK_KEY) || '';
            return names.includes(saved) ? saved : names[0] || '';
          } catch (error) {
            return names[0] || '';
          }
        }

        function initializeLaunchScreen() {
          const screen = document.getElementById('launchScreen');
          const select = document.getElementById('launchBookSelect');
          const start = document.getElementById('launchStart');
          const status = document.getElementById('launchStatus');
          const back = document.getElementById('backButton');

          if (!screen || !select || !start || !status) return;

          const setBooks = (names) => {
            const books = Array.isArray(names) ? names.filter(Boolean) : [];
            select.replaceChildren();

            if (books.length === 0) {
              const option = document.createElement('option');
              option.value = '';
              option.textContent = 'No books available';
              select.appendChild(option);
              select.disabled = true;
              start.disabled = true;
              status.textContent = 'No spreadsheet sheets were found.';
              return;
            }

            books.forEach((name) => {
              const option = document.createElement('option');
              option.value = name;
              option.textContent = name;
              select.appendChild(option);
            });

            select.value = savedBookName(books);
            select.disabled = false;
            start.disabled = false;
            status.textContent = `${books.length} book${books.length === 1 ? '' : 's'} available`;
          };

          const showScreen = () => {
            if (typeof closeAllPanels === 'function') closeAllPanels();
            if (typeof state !== 'undefined') window.clearTimeout(state.autoTimer);
            screen.hidden = false;
            screen.setAttribute('aria-hidden', 'false');
          };

          const startBook = () => {
            const name = String(select.value || '').trim();
            if (!name) {
              status.textContent = 'Choose a book first.';
              return;
            }

            try {
              localStorage.setItem(LAST_BOOK_KEY, name);
            } catch (error) {}

            screen.hidden = true;
            screen.setAttribute('aria-hidden', 'true');
            if (typeof state !== 'undefined') state.currentSheet = name;
            if (typeof loadItems === 'function') loadItems(name);
          };

          start.addEventListener('click', startBook);
          select.addEventListener('change', () => {
            status.textContent = select.value ? 'Ready to start' : 'Choose a book first.';
          });
          select.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !start.disabled) {
              event.preventDefault();
              startBook();
            }
          });
          back?.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopImmediatePropagation();
            showScreen();
          }, true);

          if (!window.google || !google.script || !google.script.run) {
            setBooks(['Demo', 'TOEIC']);
            return;
          }

          google.script.run
            .withSuccessHandler(setBooks)
            .withFailureHandler(() => {
              setBooks([]);
              status.textContent = 'Could not load books. Reload the app.';
            })
            .getSheetNames();
        }

        window.addEventListener('DOMContentLoaded', initializeLaunchScreen, { once: true });
      })();
    </script>
  </head>
  <body>
    <section class="launch-screen" id="launchScreen" aria-label="Choose a book" aria-hidden="false">
      <div class="launch-card">
        <header class="launch-brand">
          <div class="launch-icon" aria-hidden="true">📚</div>
          <p class="launch-kicker">STUDY APP</p>
          <h1 class="launch-title">Study Shorts</h1>
          <p class="launch-subtitle">Choose a book to begin.</p>
        </header>
        <div class="launch-field">
          <label class="launch-label" for="launchBookSelect">Books</label>
          <select class="launch-select" id="launchBookSelect" disabled>
            <option>Loading books...</option>
          </select>
        </div>
        <button class="launch-start" id="launchStart" type="button" disabled>Start</button>
        <p class="launch-status" id="launchStatus" role="status" aria-live="polite">Loading books...</p>
      </div>
    </section>

    <?!= includeStudyApp(); ?>
  </body>
</html>
