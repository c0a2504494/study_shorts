      const toggleAnswer = document.getElementById('toggleAnswer');
      const toggleReverse = document.getElementById('toggleReverse');
      const toggleLeftHandMode = document.getElementById('toggleLeftHandMode');
      const toggleSpeakOnFlip = document.getElementById('toggleSpeakOnFlip');
      const toggleReviewOnly = document.getElementById('toggleReviewOnly');
      const setAllRankTwo = document.getElementById('setAllRankTwo');
      const setAllRankThree = document.getElementById('setAllRankThree');
      const deleteCurrentBackground = document.getElementById('deleteCurrentBackground');
      const deleteRankTwo = document.getElementById('deleteRankTwo');
      const decrementStudyCounts = document.getElementById('decrementStudyCounts');
      const toggleFixedBackground = document.getElementById('toggleFixedBackground');
      const backgroundProbabilityInput = document.getElementById('backgroundProbabilityInput');
      const saveBackgroundProbability = document.getElementById('saveBackgroundProbability');
      const clearBackgroundProbability = document.getElementById('clearBackgroundProbability');
      const rankFilterTools = [...document.querySelectorAll('.rank-filter-tool')];
      const toggleStudyCountAverage = document.getElementById('toggleStudyCountAverage');
      const studyCountMinTools = [...document.querySelectorAll('.study-count-min-tool')];

      const STORAGE_KEY = 'study-shorts-vocab-v3';
      const UI_PREFS_KEY = 'study-shorts-ui-prefs-v1';
      const INITIAL_LOADING_MS = 3000;
      const RANK_LABELS = { 1: '1 Mastered', 2: '2 Good', 3: '3 Learning', 4: '4 Hard' };
      const state = {
        sourceItems: [],
        items: [],
        backgroundUrls: [],
        backgroundOrder: [],
        backgroundAssignments: {},
        failedBackgroundUrls: new Set(),
        backgroundCursor: 0,
        backgroundProbability: null,
        masteredProbability: 0.05,
        lastBackgroundUrl: '',
        backgroundMeta: {},
        driveFolders: 0,
        driveImages: 0,
        driveRemoved: 0,
        driveErrors: [],
        averageRank: null,
        todayPlayCount: 0,
        totalPlayCount: 0,
        imagePreloadCache: new Map(),
        preloadQueueTimer: 0,
        sheetNames: [],
        currentSheet: '',
        index: 0,
        round: 1,
        startY: 0,
        currentY: 0,
        dragging: false,
        auto: false,
        alwaysShowAnswer: false,
        reverse: false,
        leftHandMode: false,
        speakOnFlip: false,
        fixedBackground: false,
        reviewOnly: false,
        rankFilters: ['all'],
        studyCountAtLeastAverage: false,
        studyCountMinimum: null,
        progress: {},
        autoTimer: 0,
        toastTimer: 0,
        initialLoadingStartedAt: performance.now(),
        initialLoadingTimer: 0,
        initialLoadingComplete: false,
        singleTapTimer: 0,
        effectTimer: 0,
        dragFrame: 0,
        dragOffset: 0,
        renderedDragOffset: 0,
        settleTimer: 0,
        snapFrame: 0,
        previousIndex: 0,
        targetIndex: 0,
        settleCallback: null,
        pendingRemovalIds: new Set(),
        revealedIds: new Set(),
        lastRankChange: '',
        lastRankChangeItemId: '',
        lastTapAt: 0,
        lastWheelAt: 0,
        startX: 0,
        currentX: 0,
        justDragged: false,
        justDraggedTimer: 0,
        touchedIds: new Set(),
        loginRecordedSheets: new Set(),
      };

      function normalizeRank(value) {
        const rank = Number(value);
        return Math.min(4, Math.max(1, Number.isFinite(rank) ? Math.round(rank * 10) / 10 : 3));
      }

      function formatRank(value) {
        return normalizeRank(value).toFixed(1);
      }

      function rankLabel(value) {
        const rank = normalizeRank(value);
        if (rank <= 1) return '1.0 Mastered';
        if (rank < 2) return `${formatRank(rank)} Good+`;
        if (rank < 3) return `${formatRank(rank)} Good`;
        if (rank < 4) return `${formatRank(rank)} Learning`;
        return '4.0 Hard';
      }

      function rankWeight(value) {
        const rank = normalizeRank(value);
        return rank <= 1 ? 0 : Math.max(0.5, Math.pow(2, rank - 1));
      }

      function englishScore(value) {
        const text = String(value || '');
        const letters = (text.match(/[A-Za-z]/g) || []).length;
        const kana = (text.match(/[\u3040-\u30ff\u3400-\u9fff]/g) || []).length;
        return letters * 2 - kana + (/\b(the|a|an|to|of|in|for|with|is|are)\b/i.test(text) ? 4 : 0);
      }

      function englishText(item) {
        return englishScore(item.word) >= englishScore(item.answer) ? item.word : item.answer;
      }

      function columnLabel(columnNumber) {
        let label = '';
        let number = columnNumber;
        while (number > 0) {
          number -= 1;
          label = String.fromCharCode(65 + (number % 26)) + label;
          number = Math.floor(number / 26);
        }
        return label;
      }

      function parseItem(raw, id) {
        if (raw && typeof raw === 'object') {
          const question = String(raw.question || '').trim();
          const answerText = String(raw.answer || '').trim();
          const answerParts = answerText.split(/[|／/]/).map((value) => value.trim()).filter(Boolean);
          const studyCount = Math.max(0, Math.floor(Number(raw.studyCount ?? raw.skip ?? 0) || 0));
          return {
            id: raw.id || `row-${raw.row || id}-${question}-${answerText}`,
            row: Number(raw.row || 0),
            raw: answerText ? `${question} - ${answerText}` : question,
            word: question,
            answer: answerParts[0] || '',
            examples: answerParts.slice(1),
            comments: Array.isArray(raw.comments) ? raw.comments.filter(Boolean) : [],
            studyCount,
            rank: normalizeRank(raw.rank),
            questionImageUrl: String(raw.questionImageUrl || '').trim(),
            answerImageUrl: String(raw.answerImageUrl || '').trim(),
            questionDriveUrl: String(raw.questionDriveUrl || '').trim(),
            answerDriveUrl: String(raw.answerDriveUrl || '').trim(),
            backgroundUrl: String(raw.backgroundUrl || '').trim(),
          };
        }

        const text = String(raw || '').trim();
        const match = text.match(/^(.+?)\s*(?:\t|,|\s-\s|:|=)\s*(.+)$/);
        if (!match) {
          return {
            id,
            row: 0,
            raw: text,
            word: text,
            answer: '',
            examples: [],
            comments: [],
            studyCount: 0,
            rank: 3,
            questionImageUrl: '',
            answerImageUrl: '',
            questionDriveUrl: '',
            answerDriveUrl: '',
            backgroundUrl: '',
          };
        }
        const answerParts = match[2].split(/[|／/]/).map((value) => value.trim()).filter(Boolean);
        return {
          id,
          row: 0,
          raw: text,
          word: match[1].trim(),
          answer: answerParts[0] || '',
          examples: answerParts.slice(1),
          comments: [],
          studyCount: 0,
          rank: 3,
          questionImageUrl: '',
          answerImageUrl: '',
          questionDriveUrl: '',
          answerDriveUrl: '',
          backgroundUrl: '',
        };
      }

      function loadProgress() {
        try {
          state.progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        } catch (error) {
          state.progress = {};
        }
      }

      function saveProgress() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
      }

      function loadUiPreferences() {
        try {
          const prefs = JSON.parse(localStorage.getItem(UI_PREFS_KEY) || '{}');
          state.leftHandMode = Boolean(prefs.leftHandMode);
        } catch (error) {
          state.leftHandMode = false;
        }
        syncLeftHandMode();
      }

      function saveUiPreferences() {
        localStorage.setItem(UI_PREFS_KEY, JSON.stringify({
          leftHandMode: state.leftHandMode,
        }));
      }

      function syncLeftHandMode() {
        app?.classList.toggle('left-hand-mode', state.leftHandMode);
        toggleLeftHandMode?.classList.toggle('active', state.leftHandMode);
      }

      function getProgress(item) {
        const key = baseItemId(item);
        if (!state.progress[key]) {
          state.progress[key] = { known: item.rank <= 1, review: item.rank >= 4, seen: 0, miss: 0 };
        }
        return state.progress[key];
      }

      function shuffle(values) {
        const copy = [...values];
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function uniqueHttpUrls(urls) {
        const seen = new Set();
        return (urls || [])
          .map((url) => String(url || '').trim())
          .filter((url) => {
            if (!/^https?:\/\//i.test(url) || seen.has(url)) return false;
            seen.add(url);
            return true;
          });
      }

      function shuffledBackgroundOrder(previousUrl = state.lastBackgroundUrl) {
        const order = shuffle(state.backgroundUrls);
        if (order.length > 1 && order[0] === previousUrl) {
          const swapIndex = order.findIndex((url, index) => index > 0 && url !== previousUrl);
          if (swapIndex > 0) {
            [order[0], order[swapIndex]] = [order[swapIndex], order[0]];
          }
        }
        return order;
      }

      function activePool() {
        if (!rankFilterIsAll() || studyCountFilterIsActive()) {
          const pool = state.sourceItems.filter((item) => matchesRankFilter(item) && matchesStudyCountFilter(item));
          return pool.length > 0 ? pool : [];
        }

        const available = state.sourceItems.filter((item) => item.row === 0 || item.rank > 1);
        if (!state.reviewOnly) {
          return available;
        }
        const pool = available.filter((item) => item.row === 0 || item.rank >= 4 || getProgress(item).review);
        return pool.length > 0 ? pool : available;
      }

      function matchesRankFilter(item) {
        const rank = normalizeRank(item?.rank);
        return state.rankFilters.some((filter) => {
          if (filter === '1') return rank <= 1;
          if (filter === '1x') return rank > 1 && rank < 2;
          if (filter === '2x') return rank >= 2 && rank < 3;
          if (filter === 'all') return rank > 1;
          return false;
        });
      }

      function rankFilterIsAll() {
        return state.rankFilters.includes('all') || state.rankFilters.length === 0;
      }

      function averageStudyCount() {
        const counts = state.sourceItems
          .map((item) => Math.max(0, Math.floor(Number(item?.studyCount || 0))))
          .filter((count) => Number.isFinite(count));
        if (counts.length === 0) return null;
        return counts.reduce((sum, count) => sum + count, 0) / counts.length;
      }

      function studyCountFilterIsActive() {
        return state.studyCountAtLeastAverage || state.studyCountMinimum !== null;
      }

      function matchesStudyCountFilter(item) {
        if (!studyCountFilterIsActive()) return true;
        const count = Math.max(0, Math.floor(Number(item?.studyCount || 0)));
        if (state.studyCountMinimum !== null) return count >= state.studyCountMinimum;
        const average = averageStudyCount();
        return average !== null && count >= average;
      }

      function surpriseMasteredPool() {
        if (state.reviewOnly || !rankFilterIsAll() || studyCountFilterIsActive()) return [];
        const mastered = state.sourceItems.filter((item) => item.rank <= 1);
        if (mastered.length === 0) return [];
        const rawProbability = Number(state.masteredProbability);
        const probability = Number.isFinite(rawProbability)
          ? Math.min(1, Math.max(0, rawProbability))
          : 0.05;
        return shuffle(mastered).filter(() => Math.random() < probability);
      }

      function weightedDeck(pool) {
        const candidates = [...pool];
        const deck = [];
        const limit = candidates.length;

        while (deck.length < limit && candidates.length > 0) {
          const total = candidates.reduce((sum, item) => sum + rankWeight(item.rank), 0);
          let pick = Math.random() * total;
          let selected = 0;

          for (let i = 0; i < candidates.length; i += 1) {
            pick -= rankWeight(candidates[i].rank);
            if (pick <= 0) {
              selected = i;
              break;
            }
          }

          deck.push(candidates.splice(selected, 1)[0]);
        }

        return injectSurpriseMastered(deck);
      }

      function injectSurpriseMastered(deck) {
        const surprises = surpriseMasteredPool();
        if (surprises.length === 0) return deck;

        const mixed = [...deck];
        surprises.forEach((item, index) => {
          const minPosition = Math.min(mixed.length, 5 + index * 7);
          const insertIndex = Math.min(mixed.length, minPosition + Math.floor(Math.random() * 6));
          mixed.splice(insertIndex, 0, repeatCopy(item, 'surprise'));
        });

        return mixed;
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('visible');
        window.clearTimeout(state.toastTimer);
        state.toastTimer = window.setTimeout(() => toast.classList.remove('visible'), 1200);
      }

      function showLoading(message = 'Loading') {
        if (state.initialLoadingComplete) return;
        const label = loadingScreen.querySelector('.loading-box div:last-child');
        if (label) label.textContent = message;
        loadingScreen.classList.add('visible');
      }

      function hideLoading() {
        if (state.initialLoadingComplete) return;
        window.clearTimeout(state.initialLoadingTimer);
        loadingScreen.classList.remove('visible');
        state.initialLoadingComplete = true;
      }

      state.initialLoadingTimer = window.setTimeout(hideLoading, INITIAL_LOADING_MS);
      loadUiPreferences();

      function showDoubleEffect(text) {
        doubleEffect.textContent = text;
        doubleEffect.classList.remove('master-effect');
        doubleEffect.classList.remove('visible');
        window.clearTimeout(state.effectTimer);
        requestAnimationFrame(() => doubleEffect.classList.add('visible'));
        state.effectTimer = window.setTimeout(() => doubleEffect.classList.remove('visible', 'master-effect'), 560);
      }

      function showMasterEffect() {
        doubleEffect.textContent = 'MASTER';
        doubleEffect.classList.remove('visible');
        doubleEffect.classList.add('master-effect');
        window.clearTimeout(state.effectTimer);
        requestAnimationFrame(() => doubleEffect.classList.add('visible'));
        state.effectTimer = window.setTimeout(() => doubleEffect.classList.remove('visible', 'master-effect'), 900);
      }

      function displayParts(item) {
        const source = sourceItemFor(item);
        const front = state.reverse && source.answer ? source.answer : source.word;
        const back = state.reverse && source.answer ? source.word : source.answer;
        return { front, back: back || 'No answer' };
      }

      function baseItemId(item) {
        return item?.baseId || item?.id || '';
      }

      function sourceItemFor(item) {
        const key = baseItemId(item);
        return state.sourceItems.find((candidate) => candidate.id === key) || item;
      }

      function driveUrlForItem(item, revealed = false) {
        if (!item) return '';
        if (revealed && item.answerDriveUrl) return item.answerDriveUrl;
        return item.questionDriveUrl || item.answerDriveUrl || '';
      }

      function preloadImageUrl(url) {
        const value = String(url || '').trim();
        if (!/^https?:\/\//i.test(value) || state.imagePreloadCache.has(value)) return;

        if (state.imagePreloadCache.size > 160) {
          const firstKey = state.imagePreloadCache.keys().next().value;
          if (firstKey) state.imagePreloadCache.delete(firstKey);
        }

        const image = new Image();
        image.referrerPolicy = 'no-referrer';
        image.decoding = 'async';
        image.loading = 'eager';
        state.imagePreloadCache.set(value, image);
        image.src = value;
      }

      function preloadAroundIndex(center = state.index) {
        if (state.items.length === 0) return;

        const urls = [];
        const start = Math.max(0, center - 4);
        const end = Math.min(state.items.length - 1, center + 8);
        for (let position = start; position <= end; position += 1) {
          const item = sourceItemFor(state.items[position]);
          if (!item) continue;
          urls.push(item.questionImageUrl, item.answerImageUrl);
          const backgroundUrl = state.fixedBackground
            ? item.backgroundUrl
            : state.backgroundAssignments[backgroundKeyForPosition(position)] || '';
          if (backgroundUrl) urls.push(backgroundUrl);
        }

        window.clearTimeout(state.preloadQueueTimer);
        state.preloadQueueTimer = window.setTimeout(() => {
          urls.filter(Boolean).forEach(preloadImageUrl);
        }, 20);
      }

      function repeatCopy(item, offset) {
        const source = sourceItemFor(item);
        return {
          ...source,
          id: `${baseItemId(source)}-repeat-${Date.now()}-${Math.random().toString(36).slice(2)}`,
          baseId: baseItemId(source),
          repeatOffset: offset,
          isRepeatCopy: true,
        };
      }

      function rebuildDeck(options = {}) {
        const keepRound = options.keepRound === true;

        state.revealedIds.clear();
        state.backgroundAssignments = {};
        state.backgroundCursor = 0;
        state.lastBackgroundUrl = '';
        state.backgroundOrder = shuffledBackgroundOrder('');

        feed.replaceChildren();
        state.items = weightedDeck(activePool());
        state.index = 0;
        if (!keepRound) state.round = 1;

        if (state.items.length === 0) {
          empty.classList.add('visible');
          empty.querySelector('p').textContent = emptyMessage();
          return;
        }

        empty.classList.remove('visible');
        snapTo(0, false);
        preloadAroundIndex(0);
        scheduleAuto();
        state.touchedIds.clear();
      }

      function render(rawItems) {
        loadProgress();
        const payload = Array.isArray(rawItems) ? { items: rawItems, backgroundUrls: [] } : rawItems || {};
        state.driveFolders = Number(payload.driveFolders || 0);
        state.driveImages = Number(payload.driveImages || 0);
        state.driveRemoved = Number(payload.driveRemoved || 0);
        state.driveErrors = Array.isArray(payload.driveErrors) ? payload.driveErrors : [];
        state.averageRank = Number.isFinite(Number(payload.averageRank))
          ? Number(payload.averageRank)
          : averageRankForPayload(payload.items || []);
        state.todayPlayCount = Number(payload.todayPlayCount || 0);
        state.totalPlayCount = Number(payload.totalPlayCount || 0);
        state.backgroundUrls = uniqueHttpUrls(payload.backgroundUrls);
        state.backgroundOrder = shuffledBackgroundOrder('');
        state.backgroundAssignments = {};
        state.failedBackgroundUrls.clear();
        state.backgroundCursor = 0;
        state.lastBackgroundUrl = '';
        state.fixedBackground = payload.fixedBackground === true || payload.fixedBackground === 1 || String(payload.fixedBackground || '').trim() === '1';
        const rawProbability = payload.backgroundProbability;
        state.backgroundProbability =
          rawProbability === null ||
          rawProbability === undefined ||
          rawProbability === ''
            ? null
            : Number.isFinite(Number(rawProbability))
              ? Math.min(1, Math.max(0, Number(rawProbability)))
              : null;
        const rawMasteredProbability = payload.masteredProbability;
        state.masteredProbability =
          rawMasteredProbability === null ||
          rawMasteredProbability === undefined ||
          rawMasteredProbability === ''
            ? 0.05
            : Number.isFinite(Number(rawMasteredProbability))
              ? Math.min(1, Math.max(0, Number(rawMasteredProbability)))
              : 0.05;
        syncBackgroundProbabilityControl();
        state.sourceItems = (payload.items || [])
          .map((item, index) => parseItem(item, `row-${index + 1}`))
          .filter((item) => item.word);
        preloadBackgrounds(uniqueHttpUrls([
          ...state.backgroundUrls,
          ...state.sourceItems.map((item) => item.backgroundUrl),
        ]));
        rebuildDeck();
        recordDailyLoginOnce();
        if (state.backgroundUrls.length > 0) {
          showToast(`Images ${state.backgroundUrls.length}`);
        }
        hideLoading();
      }

      function emptyMessage() {
        if (studyCountFilterIsActive()) {
          return 'No cards match this study count filter.';
        }

        if (!rankFilterIsAll()) {
          return 'No cards match this rank filter.';
        }

        if (state.driveFolders > 0 && state.driveImages === 0) {
          const error = state.driveErrors[0]?.message || '';
          return error
            ? `Drive folder found, but images could not be loaded: ${error}`
            : 'Drive folder found, but no image files were found.';
        }

        return state.sourceItems.length > 0
          ? 'All cards are mastered.'
          : 'Put questions in column A and answers in column B, or Drive folder URLs in H2.';
      }

      function recordDailyLoginOnce() {
        const sheet = state.currentSheet || '';
        if (!sheet || state.loginRecordedSheets.has(sheet)) return;
        if (!window.google || !google.script || !google.script.run) return;
        state.loginRecordedSheets.add(sheet);
        google.script.run
          .withSuccessHandler((result) => {
            if (result && result.stats) {
              if (Number.isFinite(Number(result.stats.todayPlayCount))) state.todayPlayCount = Number(result.stats.todayPlayCount);
              if (Number.isFinite(Number(result.stats.totalPlayCount))) state.totalPlayCount = Number(result.stats.totalPlayCount);
              if (Number.isFinite(Number(result.stats.averageRank))) state.averageRank = Number(result.stats.averageRank);
              updateStatsDisplay();
            }
            if (result && result.streak) showToast(`${result.streak} day streak`);
          })
          .withFailureHandler(() => {})
          .recordDailyLogin(sheet);
      }

      function preloadBackgrounds(urls) {
        urls.slice(0, 12).forEach((url) => {
          const image = new Image();
          image.decoding = 'async';
          image.onload = () => {
            state.backgroundMeta[url] = {
              width: image.naturalWidth || 0,
              height: image.naturalHeight || 0,
            };
            updateBackgroundFits();
          };
          image.src = url;
        });
      }

      function resetBackgroundChoices() {
        state.backgroundAssignments = {};
        state.backgroundCursor = 0;
        state.lastBackgroundUrl = '';
        state.backgroundOrder = shuffledBackgroundOrder('');
      }

      function syncBackgroundProbabilityControl() {
        if (!backgroundProbabilityInput) return;
        backgroundProbabilityInput.value = state.backgroundProbability === null
          ? ''
          : String(state.backgroundProbability);
        clearBackgroundProbability?.classList.toggle('active', state.backgroundProbability === null);
      }

      function parseBackgroundProbabilityInput(value) {
        const raw = String(value === null || value === undefined ? '' : value).trim();
        if (raw === '') return null;
        const probability = Number(raw);
        if (!Number.isFinite(probability)) return undefined;
        return Math.min(1, Math.max(0, probability));
      }

      function saveBackgroundProbabilityValue(nextProbability) {
        if (!window.google || !google.script || !google.script.run) return;
        google.script.run
          .withSuccessHandler((result) => {
            if (result && Object.prototype.hasOwnProperty.call(result, 'backgroundProbability')) {
              state.backgroundProbability = parseBackgroundProbabilityInput(result.backgroundProbability);
              resetBackgroundChoices();
              syncBackgroundProbabilityControl();
              renderWindowSlides();
            }
          })
          .withFailureHandler(() => showToast('Could not save background rate'))
          .setBackgroundProbability(nextProbability === null ? '' : nextProbability, state.currentSheet);
      }

      function setBackgroundProbabilityFromInput(value, persist = true) {
        const nextProbability = parseBackgroundProbabilityInput(value);
        if (typeof nextProbability === 'undefined') {
          showToast('Use 0 to 1');
          syncBackgroundProbabilityControl();
          return;
        }

        state.backgroundProbability = nextProbability;
        resetBackgroundChoices();
        syncBackgroundProbabilityControl();
        renderWindowSlides();
        if (persist) saveBackgroundProbabilityValue(nextProbability);
        showToast(nextProbability === null ? 'Background rate: Auto' : `Background rate: ${nextProbability}`);
      }

      function backgroundForPosition(position) {
        const key = backgroundKeyForPosition(position);
        if (state.backgroundProbability !== null && state.backgroundProbability <= 0) {
          state.backgroundAssignments[key] = '';
          return '';
        }

        if (Object.prototype.hasOwnProperty.call(state.backgroundAssignments, key)) {
          return state.backgroundAssignments[key];
        }

        const shouldShow = state.backgroundProbability === null
          ? Math.random() < 0.9
          : Math.random() < state.backgroundProbability;
        if (!shouldShow) {
          state.backgroundAssignments[key] = '';
          return '';
        }

        if (state.fixedBackground) {
          const item = state.items[position];
          const source = sourceItemFor(item);
          const url = source?.backgroundUrl || '';
          state.backgroundAssignments[key] = url;
          return url;
        }

        if (state.backgroundUrls.length === 0) return '';

        if (state.backgroundOrder.length === 0) {
          state.backgroundOrder = shuffledBackgroundOrder();
          state.backgroundCursor = 0;
        }
        if (state.backgroundCursor >= state.backgroundOrder.length) {
          state.backgroundOrder = shuffledBackgroundOrder();
          state.backgroundCursor = 0;
        }

        const url = nextUsableBackgroundUrl();
        if (!url) {
          state.backgroundAssignments[key] = '';
          return '';
        }
        state.backgroundCursor += 1;
        state.backgroundAssignments[key] = url;
        state.lastBackgroundUrl = url;
        return url;
      }

      function nextUsableBackgroundUrl() {
        let attempts = 0;
        while (attempts < state.backgroundUrls.length) {
          if (state.backgroundOrder.length === 0) {
            state.backgroundOrder = shuffledBackgroundOrder();
            state.backgroundCursor = 0;
          }
          if (state.backgroundCursor >= state.backgroundOrder.length) {
            state.backgroundOrder = shuffledBackgroundOrder();
            state.backgroundCursor = 0;
          }

          const url = state.backgroundOrder[state.backgroundCursor] || '';
          if (url && !state.failedBackgroundUrls.has(url)) return url;
          state.backgroundCursor += 1;
          attempts += 1;
        }

        return '';
      }

      function markBackgroundFailed(url) {
        const value = String(url || '').trim();
        if (!value) return;
        state.failedBackgroundUrls.add(value);
        Object.keys(state.backgroundAssignments).forEach((key) => {
          if (state.backgroundAssignments[key] === value) {
            delete state.backgroundAssignments[key];
          }
        });
      }

      function backgroundKeyForPosition(position) {
        const item = state.items[position];
        return item ? `item:${item.id}` : `position:${position}`;
      }

      function backgroundFitForUrl(url) {
        const meta = state.backgroundMeta[url];
        if (!meta || !meta.width || !meta.height) return 'contain';
        const imageRatio = meta.width / meta.height;
        const screenRatio = window.innerWidth / window.innerHeight;
        if (imageRatio > screenRatio * 2.15) return 'wide';
        if (imageRatio < screenRatio * 0.46) return 'tall';
        return 'contain';
      }

      function updateBackgroundFits() {
        feed.querySelectorAll('.short').forEach((slide) => {
          const url = slide.dataset.backgroundUrl || '';
          if (!url) return;
          slide.dataset.bgFit = backgroundFitForUrl(url);
        });
      }

      function renderBooks() {
        bookTitle.textContent = 'Books';
        bookList.replaceChildren();

        if (state.sheetNames.length === 0) {
          const emptyRow = document.createElement('div');
          emptyRow.className = 'book-item';
          emptyRow.textContent = 'No sheets';
          bookList.appendChild(emptyRow);
          return;
        }

        state.sheetNames.forEach((name) => {
          const button = document.createElement('button');
          const label = document.createElement('span');
          const check = document.createElement('span');

          button.className = 'book-item';
          button.type = 'button';
          button.classList.toggle('active', name === state.currentSheet);
          label.textContent = name;
          check.className = 'book-check';
          check.textContent = name === state.currentSheet ? 'OPEN' : '';

          button.append(label, check);
          button.addEventListener('click', () => selectBook(name));
          bookList.appendChild(button);
        });
      }

      function openBooks() {
        closeAllPanels();
        renderBooks();
        bookPanel.classList.add('visible');
      }

      function selectBook(name) {
        state.currentSheet = name;
        showToast(`Book: ${name}`);
        closeAllPanels();
        loadItems(name);
      }

      function updateSlides() {
        const activeCount = state.items.length;

        [...feed.querySelectorAll('.short')].forEach((slide) => {
          const item = state.items[Number(slide.dataset.position)];
          if (!item) return;
          const source = sourceItemFor(item);
          const progress = getProgress(item);
          const parts = displayParts(item);
          const answer = [parts.back, ...item.examples].filter(Boolean).join('\n');
          const questionImageUrl = source.questionImageUrl || '';
          const answerImageUrl = source.answerImageUrl || '';
          const isRevealed = state.alwaysShowAnswer || state.revealedIds.has(item.id);
          const driveUrl = driveUrlForItem(source, isRevealed);
          const studyText = slide.querySelector('.study-text');
          const answerText = slide.querySelector('.answer-text');
          const studyImage = slide.querySelector('.study-image');
          const answerImage = slide.querySelector('.answer-image');
          const driveOpenAction = slide.querySelector('.drive-open-action');

          slide.dataset.fullText = parts.front;
          slide.dataset.answer = answer;
          slide.classList.toggle('active-slide', Number(slide.dataset.position) === state.index);
          slide.classList.toggle('revealed', isRevealed);
          slide.classList.toggle('has-question-image', Boolean(questionImageUrl));
          slide.classList.toggle('has-answer-image', Boolean(answerImageUrl));
          slide.classList.toggle('has-drive-source', Boolean(driveUrl && (questionImageUrl || answerImageUrl)));
          if (driveOpenAction) {
            driveOpenAction.dataset.driveUrl = driveUrl;
          }
          studyText.textContent = parts.front;
          applyTextScale(studyText, parts.front);
          answerText.textContent = answer;
          applyTextScale(answerText, answer);
          if (questionImageUrl) {
            studyImage.referrerPolicy = 'no-referrer';
            studyImage.src = questionImageUrl;
            studyImage.onerror = () => slide.classList.remove('has-question-image');
            slide.classList.remove('has-photo');
            slide.style.removeProperty('--card-bg-image');
            slide.style.removeProperty('--card-bg-opacity');
            const backgroundImage = slide.querySelector('.photo-bg img');
            if (backgroundImage) backgroundImage.removeAttribute('src');
          } else {
            studyImage.removeAttribute('src');
          }
          if (answerImageUrl) {
            answerImage.referrerPolicy = 'no-referrer';
            answerImage.src = answerImageUrl;
            answerImage.onerror = () => slide.classList.remove('has-answer-image');
          } else {
            answerImage.removeAttribute('src');
          }
          slide.querySelector('.mode-pill').textContent = `${state.currentSheet || 'Book'} / ${state.reviewOnly ? `HARD ${state.round}` : `ROUND ${state.round}`}`;
          if (item.repeatOffset === 'surprise') {
            slide.querySelector('.mode-pill').textContent = `${state.currentSheet || 'Book'} / REVIEW`;
          }
          slide.querySelector('.handle').textContent = state.currentSheet || 'Book';
          slide.querySelector('.study-count-stat').textContent = `Study ${Math.max(0, Math.floor(Number(item.studyCount || 0)))}`;
          slide.querySelector('.progress-stat').textContent = `${Number(slide.dataset.position) + 1}/${activeCount}`;
          slide.querySelector('.review-stat').textContent = state.lastRankChangeItemId === item.id
            ? state.lastRankChange
            : `${formatRank(item.rank)} -> ${formatRank(item.rank)}`;
          slide.querySelector('.avg-stat').textContent = averageRankLabel();
          slide.querySelector('.today-stat').textContent = `Today ${state.todayPlayCount}`;
          slide.querySelector('.comment-count').textContent = item.comments.length > 0 ? String(item.comments.length) : '0';
          slide.querySelector('.known-action').classList.remove('active');
          slide.querySelector('.known-action').disabled = false;
          slide.querySelector('.tiny-action').disabled = false;
          slide.querySelector('.review-action').disabled = false;
          slide.querySelector('.speak-action').disabled = false;
          slide.querySelector('.review-action').classList.toggle('active', item.rank >= 4 || progress.review);
        });

        toggleAuto?.classList.toggle('active', state.auto);
        toggleAnswer?.classList.toggle('active', state.alwaysShowAnswer);
        toggleReverse.classList.toggle('active', state.reverse);
        syncLeftHandMode();
        toggleSpeakOnFlip.classList.toggle('active', state.speakOnFlip);
        toggleFixedBackground.classList.toggle('active', state.fixedBackground);
        toggleReviewOnly?.classList.toggle('active', state.reviewOnly);
        rankFilterTools.forEach((button) => {
          const filter = button.dataset.rankFilter || 'all';
          button.classList.toggle('active', state.rankFilters.includes(filter) || (filter === 'all' && rankFilterIsAll()));
        });
        toggleStudyCountAverage.classList.toggle('active', state.studyCountAtLeastAverage);
        studyCountMinTools.forEach((button) => {
          const minimum = Number(button.dataset.studyCountMin);
          button.classList.toggle('active', state.studyCountMinimum === minimum);
        });
      }

      function applyTextScale(element, text) {
        const length = String(text || '').replace(/\s+/g, '').length;
        element.classList.toggle('long-text', length > 55);
        element.classList.toggle('very-long-text', length > 120);
      }

      function averageRankLabel() {
        return state.averageRank === null ? 'Avg -' : `Avg ${Number(state.averageRank).toFixed(2)}`;
      }

      function averageRankForPayload(items) {
        const ranks = (items || [])
          .map((item) => Number(item && typeof item === 'object' ? item.rank : NaN))
          .filter((rank) => Number.isFinite(rank));
        if (ranks.length === 0) return null;
        return ranks.reduce((sum, rank) => sum + rank, 0) / ranks.length;
      }

      function updateStatsDisplay() {
        feed.querySelectorAll('.avg-stat').forEach((node) => {
          node.textContent = averageRankLabel();
        });
        feed.querySelectorAll('.today-stat').forEach((node) => {
          node.textContent = `Today ${state.todayPlayCount}`;
        });
      }

      function renderWindowSlides() {
        const positions = [state.index - 2, state.index - 1, state.index, state.index + 1, state.index + 2]
          .filter((position) => position >= 0 && position < state.items.length);
        const fragment = document.createDocumentFragment();

        positions.forEach((position) => {
          const node = template.content.firstElementChild.cloneNode(true);
          node.dataset.itemId = state.items[position].id;
          node.dataset.position = String(position);
          const source = sourceItemFor(state.items[position]);
          const hasCardImage = Boolean(source?.questionImageUrl || source?.answerImageUrl);
          const backgroundUrl = hasCardImage ? '' : backgroundForPosition(position);
          const photo = node.querySelector('.photo-bg img');
          if (backgroundUrl) {
            node.classList.add('has-photo');
            node.dataset.backgroundUrl = backgroundUrl;
            node.dataset.bgFit = backgroundFitForUrl(backgroundUrl);
            node.style.setProperty('--card-bg-image', `url("${backgroundUrl.replace(/"/g, '\\"')}")`);
            node.style.setProperty('--card-bg-opacity', '.9');
            photo.referrerPolicy = 'no-referrer';
            photo.src = backgroundUrl;
            photo.onerror = () => {
              if (state.fixedBackground) return;
              markBackgroundFailed(backgroundUrl);
              if (Number(node.dataset.position) === position) {
                renderWindowSlides();
              }
            };
          } else {
            node.classList.remove('has-photo');
            delete node.dataset.backgroundUrl;
            delete node.dataset.bgFit;
            node.style.removeProperty('--card-bg-image');
            node.style.removeProperty('--card-bg-opacity');
            photo.removeAttribute('src');
          }
          node.style.transform = `translate3d(0, ${(position - state.index) * window.innerHeight}px, 0)`;
          fragment.appendChild(node);
        });

        feed.replaceChildren(fragment);
        updateSlides();
        updateActiveSlideClass();
        preloadAroundIndex(state.index);
      }

      function snapTo(index, animate = true) {
        if (state.snapFrame) {
          cancelAnimationFrame(state.snapFrame);
          state.snapFrame = 0;
        }
        state.previousIndex = state.index;
        state.targetIndex = index;
        if (!animate) {
          state.index = index;
          setFeedInstantTransform('translate3d(0, 0, 0)');
          renderWindowSlides();
          releaseFeedTransition();
          return;
        }

        stopMotionWork();
        preloadAroundIndex(index);
        feed.classList.remove('dragging');
        const offset = -(state.targetIndex - state.previousIndex) * window.innerHeight;
        state.snapFrame = requestAnimationFrame(() => {
          feed.style.transform = `translate3d(0, ${offset}px, 0)`;
          state.snapFrame = 0;
        });
      }

      function commitSlideWindow() {
        setFeedInstantTransform('translate3d(0, 0, 0)');
        renderWindowSlides();
        releaseFeedTransition();
      }

      function setFeedInstantTransform(transform) {
        feed.classList.add('dragging');
        void feed.offsetHeight;
        feed.style.transform = transform;
        void feed.offsetHeight;
      }

      function releaseFeedTransition() {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => feed.classList.remove('dragging'));
        });
      }

      function updateActiveSlideClass() {
        const slides = feed.querySelectorAll('.short');
        slides.forEach((slide) => {
          slide.classList.toggle('active-slide', Number(slide.dataset.position) === state.index);
        });
      }

      
      function loopForward() {
        recordSkipIfUntouched(activeItem());
        commentsPanel.classList.remove('visible');


        const nextIndex = state.index + 1;
        if (nextIndex < state.items.length) {
          snapTo(nextIndex);
          afterSlideSettle(nextIndex, () => {
            markSeen();
            scheduleAuto();
          });
          return;
        }
        state.round += 1;
        rebuildDeck({ keepRound: true });
        showToast('Weighted shuffle');
      }

      function loopBackward() {
        commentsPanel.classList.remove('visible');
        const nextIndex = state.index - 1;
        if (nextIndex >= 0) {
          snapTo(nextIndex);
          afterSlideSettle(nextIndex, () => {
            markSeen();
            scheduleAuto();
          });
          return;
        }
        state.round = Math.max(1, state.round - 1);
        state.items = weightedDeck(activePool());
        updateSlides();
        snapTo(Math.max(0, state.items.length - 1), false);
      }

      function afterSlideSettle(targetIndex, callback) {
        window.clearTimeout(state.settleTimer);
        state.settleCallback = { targetIndex, callback };
        state.settleTimer = window.setTimeout(finishSlideSettle, 680);
      }

      function finishSlideSettle() {
        if (!state.settleCallback) return;
        window.clearTimeout(state.settleTimer);
        const { targetIndex, callback } = state.settleCallback;
        state.settleCallback = null;
        if (targetIndex !== state.index) {
          commentsPanel.classList.remove('visible');
        }
        state.index = targetIndex;
        removePendingMastered();
        commitSlideWindow();
        callback();
      }

      function stopMotionWork() {
        window.clearTimeout(state.autoTimer);
        window.clearTimeout(state.settleTimer);
        state.settleCallback = null;
      }

      function activeSlide() {
        return [...feed.querySelectorAll('.short')]
          .find((slide) => Number(slide.dataset.position) === state.index);
      }

      function activeItem() {
        return state.items[state.index];
      }

      function activeBackgroundUrl() {
        const slide = activeSlide();
        return slide?.dataset.backgroundUrl || state.backgroundAssignments[backgroundKeyForPosition(state.index)] || '';
      }

      function openDriveSource(url) {
        const item = activeItem();
        const source = sourceItemFor(item);
        const revealed = item ? state.alwaysShowAnswer || state.revealedIds.has(item.id) : false;
        const driveUrl = url || driveUrlForItem(source, revealed);
        if (!driveUrl) {
          showToast('No Drive link');
          return;
        }

        const link = document.createElement('a');
        link.href = driveUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      function deleteActiveBackground() {
        const url = activeBackgroundUrl();
        if (!url) {
          showToast('No background');
          return;
        }

        state.backgroundUrls = state.backgroundUrls.filter((candidate) => candidate !== url);
        state.backgroundOrder = state.backgroundOrder.filter((candidate) => candidate !== url);
        state.sourceItems.forEach((item) => {
          if (item.backgroundUrl === url) item.backgroundUrl = '';
        });
        state.items.forEach((item) => {
          if (item.backgroundUrl === url) item.backgroundUrl = '';
        });
        if (state.lastBackgroundUrl === url) state.lastBackgroundUrl = '';
        Object.keys(state.backgroundAssignments).forEach((key) => {
          if (state.backgroundAssignments[key] === url) {
            state.backgroundAssignments[key] = '';
          }
        });
        renderWindowSlides();
        showToast('Background deleted');

        if (!window.google || !google.script || !google.script.run) return;
        google.script.run
          .withSuccessHandler((result) => {
            const replacements = Array.isArray(result && result.replacements) ? result.replacements : [];
            replacements.forEach((replacement) => {
              const row = Number(replacement.row || 0);
              const backgroundUrl = String(replacement.backgroundUrl || '').trim();
              if (!row || !backgroundUrl) return;
              state.sourceItems.forEach((item) => {
                if (item.row === row) item.backgroundUrl = backgroundUrl;
              });
              state.items.forEach((item) => {
                if (item.row === row) item.backgroundUrl = backgroundUrl;
              });
              if (!state.backgroundUrls.includes(backgroundUrl)) {
                state.backgroundUrls.push(backgroundUrl);
              }
              preloadImageUrl(backgroundUrl);
            });
            if (replacements.length > 0) renderWindowSlides();
            const deleted = Number(result && result.deleted) || 0;
            showToast(replacements.length > 0 ? `Deleted BG ${deleted}, filled ${replacements.length}` : `Deleted BG ${deleted}`);
          })
          .withFailureHandler(() => showToast('Could not delete BG'))
          .deleteBackgroundUrl(url, state.currentSheet);
      }

      function persistFixedBackgroundMode() {
        if (!window.google || !google.script || !google.script.run) return;
        google.script.run
          .withSuccessHandler((result) => {
            if (result && typeof result.fixedBackground !== 'undefined') {
              state.fixedBackground = result.fixedBackground === true;
              toggleFixedBackground.classList.toggle('active', state.fixedBackground);
            }
          })
          .withFailureHandler(() => showToast('Could not save background mode'))
          .setFixedBackgroundMode(state.fixedBackground, state.currentSheet);
      }

      function markSeen() {
        const item = activeItem();
        if (!item) return;
        const progress = getProgress(item);
        progress.seen += 1;
        state.todayPlayCount += 1;
        state.totalPlayCount += 1;
        saveProgress();
        updateStatsDisplay();
        if (window.google && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((result) => {
              if (!result) return;
              if (Number.isFinite(Number(result.todayPlayCount))) {
                state.todayPlayCount = Math.max(state.todayPlayCount, Number(result.todayPlayCount));
              }
              if (Number.isFinite(Number(result.totalPlayCount))) {
                state.totalPlayCount = Math.max(state.totalPlayCount, Number(result.totalPlayCount));
              }
              if (Number.isFinite(Number(result.averageRank))) state.averageRank = Number(result.averageRank);
              updateStatsDisplay();
            })
            .withFailureHandler(() => {})
            .recordCardPlay(state.currentSheet);
        }
      }

      function moveDrag(offset) {
        feed.classList.add('dragging');
        state.dragOffset = offset;
        if (state.dragFrame) return;
        state.dragFrame = requestAnimationFrame(animateDrag);
      }

      function animateDrag() {
        if (!state.dragging) {
          state.dragFrame = 0;
          return;
        }

        state.renderedDragOffset += (state.dragOffset - state.renderedDragOffset) * 0.42;
        if (Math.abs(state.dragOffset - state.renderedDragOffset) < 0.35) {
          state.renderedDragOffset = state.dragOffset;
        }

        feed.style.transform = `translate3d(0, ${state.renderedDragOffset}px, 0)`;

        if (Math.abs(state.dragOffset - state.renderedDragOffset) > 0.35) {
          state.dragFrame = requestAnimationFrame(animateDrag);
        } else {
          feed.style.transform = `translate3d(0, ${state.renderedDragOffset}px, 0)`;
          state.dragFrame = 0;
        }
      }
      function blockNextTap() {
        state.justDragged = true;
        window.clearTimeout(state.justDraggedTimer);
        state.justDraggedTimer = window.setTimeout(() => {
          state.justDragged = false;
        }, 220);
      }
      function finishDrag(offsetY) {
        const dx = state.currentX - state.startX;
        const dy = state.currentY - state.startY;
        const distance = Math.hypot(dx, dy);
        const threshold = Math.min(80, window.innerHeight * 0.11);

        feed.classList.remove('dragging');

        if (state.dragFrame) {
          cancelAnimationFrame(state.dragFrame);
          state.dragFrame = 0;
        }

        state.renderedDragOffset = 0;

        const mostlyVertical = Math.abs(dy) > Math.abs(dx) * 0.35;

        // ここ重要：少しでも動いたら、次のpointerupのタップ処理を止める
        if (distance > 8) {
          blockNextTap();
        }

        if (distance > threshold && mostlyVertical) {
          dy < 0 ? loopForward() : loopBackward();
          return;
        }

        snapTo(state.index);
        afterSlideSettle(state.index, () => {});
      }

      function revealAnswer() {
        setAnswerVisible(true);
      }

      function toggleAnswerVisible() {
        const item = activeItem();
        setAnswerVisible(!(item && state.revealedIds.has(item.id)));
      }

      function setAnswerVisible(visible) {
        const slide = activeSlide();
        const item = activeItem();

        if (!slide) return;
        flashAction('reveal-action', 'feedback-answer');
        const wasRevealed = state.alwaysShowAnswer || (item && state.revealedIds.has(item.id));
        if (item && visible) state.revealedIds.add(item.id);
        if (item && !visible) state.revealedIds.delete(item.id);
        slide.classList.toggle('revealed', visible || state.alwaysShowAnswer);
        if (state.speakOnFlip && !wasRevealed && visible) {
          window.setTimeout(speakActive, 130);
        }
      }

      function persistRank(item) {
        const source = sourceItemFor(item);
        if (!source || !source.row || !window.google || !google.script || !google.script.run) return;
        google.script.run
          .withSuccessHandler((result) => {
            if (result && result.stats && Number.isFinite(Number(result.stats.averageRank))) {
              state.averageRank = Number(result.stats.averageRank);
              updateStatsDisplay();
            }
          })
          .updateStudyRank(source.row, source.rank, state.currentSheet);
      }

      function recordSkipIfUntouched(item) {
        const source = sourceItemFor(item);
        if (!source || !source.row) return;

        const alreadyTouched = state.touchedIds.has(source.id);
        if (alreadyTouched) return;

        state.touchedIds.add(source.id);

        if (!window.google || !google.script || !google.script.run) return;

        google.script.run.updateStudySkip(source.row, state.currentSheet);
      }

      function setRank(item, rank, message) {
        if (!item) return;
        const source = sourceItemFor(item);
        const previousRank = source.rank;
        source.rank = normalizeRank(rank);
        state.items.forEach((candidate) => {
          if (baseItemId(candidate) === source.id) candidate.rank = source.rank;
        });
        state.lastRankChange = `${formatRank(previousRank)} -> ${formatRank(source.rank)}`;
        state.lastRankChangeItemId = item.id;
        const progress = getProgress(source);
        progress.known = source.rank <= 1;
        progress.review = source.rank >= 4;
        if (source.rank >= 4) progress.miss += 1;
        saveProgress();
        persistRank(source);
        updateSlides();
        renderMastery();
        if (message) showToast(message);
        if (source.rank <= 1) {
          state.pendingRemovalIds.add(source.id);
          if (previousRank > 1) {
            showMasterEffect();
            showToast('Mastered');
          }
        } else {
          state.pendingRemovalIds.delete(source.id);
        }


        if (source.rank < previousRank) {
          state.touchedIds.add(source.id);
        }

      }

      function removePendingMastered() {
        if (state.pendingRemovalIds.size === 0) return;
        const currentItem = activeItem();
        state.items = state.items.filter((candidate) => !state.pendingRemovalIds.has(baseItemId(candidate)));
        state.pendingRemovalIds.clear();

        if (state.items.length === 0) {
          rebuildDeck({ keepRound: true });
          return;
        }

        const nextIndex = currentItem
          ? state.items.findIndex((candidate) => candidate.id === currentItem.id)
          : state.index;
        state.index = nextIndex >= 0 ? nextIndex : Math.min(state.index, state.items.length - 1);
      }

      function improveRank(fromGesture = false) {
        const item = activeItem();
        if (!item) return;
        const source = sourceItemFor(item);
        flashAction('known-action', 'feedback-got');
        const alreadyBest = source.rank <= 1;
        const nextRank = Math.max(1, source.rank - 1);
        setRank(item, nextRank, alreadyBest ? 'Already rank 1' : `Rank ${formatRank(nextRank)}`);
        if (fromGesture && (alreadyBest || nextRank > 1)) showDoubleEffect(alreadyBest ? 'MASTERED' : 'RANK UP');
      }

      function improveRankTiny(fromGesture = false) {
        const item = activeItem();
        if (!item) return;
        const source = sourceItemFor(item);
        flashAction('tiny-action', 'feedback-got');
        const alreadyBest = source.rank <= 1;
        const nextRank = Math.max(1, source.rank - 0.1);
        setRank(item, nextRank, alreadyBest ? 'Already rank 1' : `Rank ${formatRank(nextRank)}`);
        if (fromGesture && (alreadyBest || nextRank > 1)) showDoubleEffect(alreadyBest ? 'MASTERED' : '+0.1');
      }

      function lowerRank(fromGesture = false) {
        const item = activeItem();
        if (!item) return;
        const source = sourceItemFor(item);
        flashAction('review-action', 'feedback-hard');
        const alreadyHardest = source.rank >= 4;
        const nextRank = Math.min(4, source.rank + 1);
        setRank(item, nextRank, alreadyHardest ? 'Already rank 4' : `Rank ${formatRank(nextRank)}`);
        if (fromGesture) showDoubleEffect(alreadyHardest ? 'MAX HARD' : 'HARD +1');
      }

      function scheduleRepeats() {
        const item = activeItem();
        if (!item || state.items.length === 0) return;
        const offsets = [2, 4, 7, 11, 16];
        const insertions = offsets
          .map((offset) => ({
            offset,
            index: Math.min(state.items.length, state.index + offset),
            copy: repeatCopy(item, offset),
          }))
          .sort((a, b) => b.index - a.index);

        insertions.forEach(({ index, copy }) => {
          state.items.splice(index, 0, copy);
        });

        updateSlides();
        showToast('Again +2 +4 +7 +11 +16');
        flashAction('speak-action', 'feedback-answer');
      }

      function flashAction(actionClass, feedbackClass) {
        const slide = activeSlide();
        const button = slide?.querySelector(`.${actionClass}`);
        if (!button) return;
        button.classList.remove('feedback', 'feedback-got', 'feedback-hard', 'feedback-answer');
        void button.offsetWidth;
        button.classList.add('feedback', feedbackClass);
        window.setTimeout(() => {
          button.classList.remove('feedback', feedbackClass);
        }, 260);
      }

      function speakActive() {
        const item = activeItem();
        if (!item || !window.speechSynthesis) {
          showToast('Speech is unavailable');
          return;
        }
        const source = sourceItemFor(item);
        const text = englishText(source || item).trim();
        if (!text) {
          showToast('No speech text');
          return;
        }

        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        const utterance = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        const englishVoice = voices.find((voice) => /^en[-_]/i.test(voice.lang)) ||
          voices.find((voice) => /english/i.test(voice.name));
        if (englishVoice) utterance.voice = englishVoice;
        utterance.lang = 'en-US';
        utterance.rate = 0.82;
        utterance.onerror = () => showToast('Speech failed');
        window.speechSynthesis.speak(utterance);
        showToast('Speak');
      }

      function openComments() {
        const item = activeItem();
        if (!item) return;
        closeAllPanels();
        commentsPanel.classList.add('visible');
        commentsTitle.textContent = `Comments ${item.comments.length}`;
        commentList.replaceChildren();

        const comments = item.comments.length > 0 ? item.comments : ['Write comments in columns E:G.'];
        comments.forEach((comment, index) => {
          const row = document.createElement('div');
          const avatar = document.createElement('div');
          const body = document.createElement('div');
          const name = document.createElement('p');
          const text = document.createElement('p');
          row.className = 'comment-item';
          avatar.className = 'comment-avatar';
          body.className = 'comment-body';
          name.className = 'comment-name';
          text.className = 'comment-text';
          const columnName = columnLabel(index + 5);
          avatar.textContent = columnName;
          name.textContent = `@comment_${columnName.toLowerCase()}`;
          text.textContent = comment;
          body.append(name, text);
          row.append(avatar, body);
          commentList.appendChild(row);
        });
      }

      function renderMastery() {
        masteryTitle.textContent = `${state.currentSheet || 'Book'} Mastery`;
        masterySummary.replaceChildren();
        masteryList.replaceChildren();

        [1, 2, 3, 4].forEach((rank) => {
          const box = document.createElement('div');
          box.className = 'rank-box';
          const count = state.sourceItems.filter((item) => {
            if (rank === 1) return item.rank <= 1;
            if (rank === 4) return item.rank >= 4;
            return item.rank > rank - 1 && item.rank <= rank;
          }).length;
          box.textContent = `${RANK_LABELS[rank]} ${count}`;
          masterySummary.appendChild(box);
        });

        state.sourceItems.forEach((item) => {
          const row = document.createElement('div');
          const word = document.createElement('div');
          const select = document.createElement('select');
          row.className = 'mastery-row';
          word.className = 'mastery-word';
          select.className = 'rank-select';
          word.textContent = `${englishText(item)} / ${item.answer || item.word} (${formatRank(item.rank)})`;
          [1, 1.5, 2, 2.5, 3, 3.5, 4].forEach((rank) => {
            const option = document.createElement('option');
            option.value = String(rank);
            option.textContent = rankLabel(rank);
            option.selected = Math.abs(item.rank - rank) < 0.05;
            select.appendChild(option);
          });
          select.addEventListener('change', () => setRank(item, Number(select.value), 'Rank updated'));
          row.append(word, select);
          masteryList.appendChild(row);
        });
      }

      function openMastery() {
        closeAllPanels();
        renderMastery();
        masteryPanel.classList.add('visible');
      }

      function closeAllPanels() {
        drawer.classList.remove('visible');
        commentsPanel.classList.remove('visible');
        masteryPanel.classList.remove('visible');
        bookPanel.classList.remove('visible');
      }

      function setAllRanksFromSettings(rank) {
        if (!window.confirm(`Set all study ranks to ${rank}?`)) return;
        state.sourceItems.forEach((item) => item.rank = rank);
        state.pendingRemovalIds.clear();
        updateSlides();
        renderMastery();
        rebuildDeck({ keepRound: true });
        if (window.google && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((result) => {
              if (result && result.stats && Number.isFinite(Number(result.stats.averageRank))) {
                state.averageRank = Number(result.stats.averageRank);
                updateStatsDisplay();
              }
              showToast(`Review ${rank}: ${result.count || 0}`);
            })
            .withFailureHandler(() => showToast('Could not set ranks'))
            .setAllStudyRanks(rank, state.currentSheet);
        } else {
          showToast(`Review ${rank}`);
        }
      }

      function scheduleAuto() {
        window.clearTimeout(state.autoTimer);
        if (!state.auto || state.items.length === 0) return;
        state.autoTimer = window.setTimeout(loopForward, 2600);
      }

      viewport.addEventListener('mousedown', (event) => {
        if (event.button !== 0 || state.items.length === 0) return;
        if (event.target.closest('button, select')) return;
        if (state.settleCallback) finishSlideSettle();

        window.clearTimeout(state.singleTapTimer);
        state.lastTapAt = 0;

        stopMotionWork();
        state.dragging = true;
        state.startX = event.clientX;
        state.startY = event.clientY;
        state.currentX = state.startX;
        state.currentY = state.startY;
        state.dragOffset = 0;
        state.renderedDragOffset = 0;
        event.preventDefault();
      });

      window.addEventListener('mousemove', (event) => {
        if (!state.dragging) return;
        state.currentX = event.clientX;
        state.currentY = event.clientY;
        moveDrag(state.currentY - state.startY);
      });

      window.addEventListener('mouseup', (event) => {
        if (!state.dragging) return;
        state.dragging = false;

        const dx = state.currentX - state.startX;
        const dy = state.currentY - state.startY;
        const distance = Math.hypot(dx, dy);

        if (distance <= 8) {
          handleTap(event);
          return;
        }

        finishDrag(dy);
      });

      viewport.addEventListener('touchstart', (event) => {
        if (event.touches.length !== 1 || state.items.length === 0) return;
        if (state.settleCallback) finishSlideSettle();

        window.clearTimeout(state.singleTapTimer);
        state.lastTapAt = 0;

        stopMotionWork();
        state.dragging = true;
        state.startX = event.touches[0].clientX;
        state.startY = event.touches[0].clientY;

        state.currentX = state.startX;
        state.currentY = state.startY;
        state.dragOffset = 0;
        state.renderedDragOffset = 0;
      }, { passive: true });

      viewport.addEventListener('touchmove', (event) => {
        if (!state.dragging) return;
        state.currentX = event.touches[0].clientX;
        state.currentY = event.touches[0].clientY;

        const dy = state.currentY - state.startY;
        moveDrag(dy);
        event.preventDefault();
      }, { passive: false });

      viewport.addEventListener('touchend', (event) => {
        if (!state.dragging) return;

        state.dragging = false;

        const dx = state.currentX - state.startX;
        const dy = state.currentY - state.startY;
        const distance = Math.hypot(dx, dy);

        if (distance <= 8) {
          handleTap(event);
          return;
        }

        finishDrag(dy);
      });

      function handleTap(event) {
        if (state.justDragged) return;
        const target = event.target instanceof Element ? event.target : null;
        if (target?.closest('button, select')) return;

        const now = Date.now();

        if (now - state.lastTapAt < 280) {
          state.lastTapAt = 0;
          window.clearTimeout(state.singleTapTimer);
          improveRank(true);
          return;
        }

        state.lastTapAt = now;
        window.clearTimeout(state.singleTapTimer);
        state.singleTapTimer = window.setTimeout(() => {
          state.lastTapAt = 0;
          toggleAnswerVisible();
        }, 260);
      }

      viewport.addEventListener('wheel', (event) => {
        if (state.items.length === 0) return;
        event.preventDefault();
        if (Math.abs(event.deltaY) < 18) return;
        const now = Date.now();
        if (state.settleCallback || now - state.lastWheelAt < 560) return;
        state.lastWheelAt = now;
        event.deltaY > 0 ? loopForward() : loopBackward();
      }, { passive: false });

      feed.addEventListener('transitionend', (event) => {
        if (event.target === feed && event.propertyName === 'transform') {
          finishSlideSettle();
        }
      });

      feed.addEventListener('click', (event) => {
        const driveButton = event.target.closest('.drive-open-action');
        if (driveButton) {
          event.preventDefault();
          event.stopPropagation();
          openDriveSource(driveButton.dataset.driveUrl || '');
          return;
        }

        const button = event.target.closest('.action, .profile-action');
        if (!button) return;
        event.preventDefault();
        event.stopPropagation();
        if (button.classList.contains('profile-action')) openMastery();
        if (button.classList.contains('reveal-action')) revealAnswer();
        if (button.classList.contains('known-action')) improveRank(true);
        if (button.classList.contains('tiny-action')) improveRankTiny(true);
        if (button.classList.contains('review-action')) lowerRank(true);
        if (button.classList.contains('comment-action')) openComments();
        if (button.classList.contains('speak-action')) scheduleRepeats();
      });

      window.addEventListener('keydown', (event) => {
        const target = event.target instanceof Element ? event.target : null;
        if (target?.matches('input, textarea, select')) return;
        if (event.key === 'ArrowDown') loopForward();
        if (event.key === 'ArrowUp') loopBackward();
        if (event.key === ' ' || event.key.toLowerCase() === 't') toggleAnswerVisible();
        if (event.key.toLowerCase() === 'g') improveRank(true);
        if (event.key.toLowerCase() === 'a') scheduleRepeats();
        if (event.key.toLowerCase() === 'q') {
          event.preventDefault();
          openDriveSource();
        }
        if (event.key.toLowerCase() === 'j' || event.key === ';' || event.key === 'Enter') {
          event.preventDefault();
          improveRankTiny(true);
        }
        if (event.key.toLowerCase() === 'r') lowerRank(true);
      });

        state.reverse = !state.reverse;
        updateSlides();

      toggleLeftHandMode.addEventListener('click', () => {

      toggleSpeakOnFlip.addEventListener('click', () => {

        showToast(state.speakOnFlip ? 'Speak on flip: on' : 'Speak on flip: off');
      });
      toggleReviewOnly?.addEventListener('click', () => {
        state.reviewOnly = !state.reviewOnly;
        rebuildDeck();
        showToast(state.reviewOnly ? 'Hard only' : 'All words');
      });
      setAllRankTwo.addEventListener('click', () => {
        setAllRanksFromSettings(2);
      });
      setAllRankThree.addEventListener('click', () => setAllRanksFromSettings(3));
      rankFilterTools.forEach((button) => {
        button.addEventListener('click', () => {
          const filter = button.dataset.rankFilter || 'all';
          if (filter === 'all') {
            state.rankFilters = ['all'];
          } else {

            .filter((tool) => state.rankFilters.includes(tool.dataset.rankFilter || 'all'))
            .map((tool) => tool.textContent.trim())
            .join(' + ');
          showToast(`Filter ${labels || 'All'}`);
        });
      });
      toggleStudyCountAverage.addEventListener('click', () => {
        const nextValue = !state.studyCountAtLeastAverage;
        state.studyCountAtLeastAverage = nextValue;
        state.studyCountMinimum = null;
        state.reviewOnly = false;
        rebuildDeck();
        updateSlides();
        const average = averageStudyCount();
        const label = average === null ? '-' : Number(average).toFixed(1);
        showToast(state.studyCountAtLeastAverage ? `C avg+ ${label}` : 'C avg off');
      });
      studyCountMinTools.forEach((button) => {
        button.addEventListener('click', () => {
          const minimum = Number(button.dataset.studyCountMin);
          state.studyCountMinimum = state.studyCountMinimum === minimum ? null : minimum;
          state.studyCountAtLeastAverage = false;
          state.reviewOnly = false;
          rebuildDeck();
          updateSlides();
          showToast(state.studyCountMinimum === null ? 'C count off' : `C ${state.studyCountMinimum}+`);
        });
      });
      deleteCurrentBackground.addEventListener('click', deleteActiveBackground);
      decrementStudyCounts.addEventListener('click', () => {
        if (!window.confirm('Decrease all numbers in column C by 1?')) return;
        state.sourceItems.forEach((item) => {
          item.studyCount = Math.max(0, Math.floor(Number(item.studyCount || 0)) - 1);
        });
        state.items.forEach((item) => {
          item.studyCount = Math.max(0, Math.floor(Number(item.studyCount || 0)) - 1);
        });
        rebuildDeck({ keepRound: true });
        renderMastery();
        showToast('C -1');

        if (!window.google || !google.script || !google.script.run) return;

        google.script.run
          .withSuccessHandler((result) => {
            showToast(`C -1: ${Number(result && result.updated) || 0}`);
            loadItems(state.currentSheet);
          })
          .withFailureHandler(() => {
            showToast('Could not update C');
            loadItems(state.currentSheet);
          })
          .decrementAllStudyCounts(state.currentSheet);
      });
      deleteRankTwo.addEventListener('click', () => {
        if (!window.confirm('Delete all rows with rank 1 in column D?')) return;
        showToast('Deleting rank 1...');
        if (!window.google || !google.script || !google.script.run) {
          const before = state.sourceItems.length;
          state.sourceItems = state.sourceItems.filter((item) => normalizeRank(item.rank) > 1);
          rebuildDeck({ keepRound: true });
          renderMastery();
          showToast(`Deleted ${before - state.sourceItems.length}`);
          return;
        }

        google.script.run
          .withSuccessHandler((result) => {
            const deleted = Number(result && result.deleted) || 0;
            const compacted = Number(result && result.compacted) || 0;
            if (deleted > 0 && compacted > 0) {
              showToast(`Deleted ${deleted}, compacted ${compacted}`);
            } else if (deleted > 0) {
              showToast(`Deleted ${deleted}`);
            } else if (compacted > 0) {
              showToast(`Compacted ${compacted}`);
            } else {
              showToast('No rank 1 rows');
            }
            loadItems(state.currentSheet);
          })
          .withFailureHandler(() => showToast('Could not delete rank 1'))
          .deleteRankTwoRows(state.currentSheet);
      });
      saveBackgroundProbability.addEventListener('click', () => {
        setBackgroundProbabilityFromInput(backgroundProbabilityInput.value);
      });
      clearBackgroundProbability.addEventListener('click', () => {
        setBackgroundProbabilityFromInput('');
      });
      backgroundProbabilityInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          setBackgroundProbabilityFromInput(backgroundProbabilityInput.value);
        }
      });
      toggleFixedBackground.addEventListener('click', () => {
        state.fixedBackground = !state.fixedBackground;
        resetBackgroundChoices();
        renderWindowSlides();
        persistFixedBackgroundMode();
        showToast(state.fixedBackground ? 'Fixed row backgrounds' : 'Random backgrounds');
      });

      function loadItems(sheetName = state.currentSheet) {
        showLoading('Loading');
        if (!window.google || !google.script || !google.script.run) {
          state.sheetNames = ['Demo', 'TOEIC'];
          state.currentSheet = sheetName || 'Demo';
          render([
            { row: 1, question: 'apple', answer: 'りんご', comments: ['Sound: apple', 'I ate an apple.'], rank: 3 },
            { row: 2, question: '改善する', answer: 'improve', comments: ['A/B swapped sample'], rank: 4 },
            { row: 3, question: 'evidence', answer: '証拠', comments: ['often uncountable'], rank: 2 },
            { row: 4, question: 'assume', answer: '仮定する', comments: ['assume that ...'], rank: 3 },
            { row: 5, question: 'describe', answer: '説明する', comments: ['describe A as B'], rank: 1 },
          ]);
          showToast('Demo mode');
          return;
        }

        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(() => {
            hideLoading();
            empty.classList.add('visible');
            empty.querySelector('p').textContent = 'Could not load columns A:J.';
          })
          .getStudyItems(sheetName);
      }

      function loadBooks() {
        if (!window.google || !google.script || !google.script.run) {
          loadItems('Demo');
          return;
        }

        google.script.run
          .withSuccessHandler((names) => {
            state.sheetNames = names || [];
            state.currentSheet = state.currentSheet || state.sheetNames[0] || '';
            loadItems(state.currentSheet);
          })
          .withFailureHandler(() => loadItems())
          .getSheetNames();
      }

      loadBooks();
    </script>
  </body>
</html>
