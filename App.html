<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://drive.google.com">
    <link rel="preconnect" href="https://lh3.googleusercontent.com">
    <link rel="dns-prefetch" href="https://drive.google.com">
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
    <title>Study Shorts</title>
    <style>
      :root {
        color-scheme: dark;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        touch-action: none;
        overscroll-behavior: none;
      }
      button { border: 0; padding: 0; color: inherit; background: transparent; font: inherit; }

      .app {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 25% 18%, rgb(90 130 150 / 24%), transparent 30%),
          linear-gradient(180deg, #0c0c0d 0%, #000 60%, #050505 100%);
      }

      .top-bar {
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: calc(var(--safe-top) + 58px);
        padding: var(--safe-top) calc(var(--safe-right) + 12px) 0 calc(var(--safe-left) + 10px);
        pointer-events: none;
      }
      .top-actions { display: flex; align-items: center; gap: 16px; }
      .icon-button { display: grid; place-items: center; width: 36px; height: 36px; pointer-events: auto; }
      .icon {
        width: 27px;
        height: 27px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
      .feed {
        width: 100%;
        height: 100%;
        transform: translate3d(0, 0, 0);
        transition: transform 560ms cubic-bezier(.22, .72, .18, 1);
        will-change: transform;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .feed.dragging { transition: none; cursor: grabbing; }

      .short {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100dvh;
        min-height: 100%;
        padding: calc(var(--safe-top) + 80px) calc(var(--safe-right) + 74px) calc(var(--safe-bottom) + 118px) calc(var(--safe-left) + 18px);
        display: flex;
        align-items: center;
        justify-content: center;
        isolation: isolate;
        transform: translateZ(0);
        transition: transform 220ms ease, opacity 220ms ease;
        will-change: transform, opacity;
      }
      .app.left-hand-mode .short {
        padding-right: calc(var(--safe-right) + 18px);
        padding-left: calc(var(--safe-left) + 82px);
      }
      .short::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -3;
        background-image: var(--card-bg-image, none);
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        background-color: #050505;
        opacity: var(--card-bg-opacity, 0);
      }
      .photo-bg {
        position: absolute;
        inset: 0;
        z-index: -2;
        display: none;
        place-items: center;
        background: #050505;
        overflow: hidden;
      }
      .short.has-photo .photo-bg { display: grid; }
      .photo-bg img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        opacity: .9;
        filter: saturate(.92) contrast(1.06);
      }
      .short::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(90deg, rgb(0 0 0 / 38%), transparent 22%, transparent 78%, rgb(0 0 0 / 38%)),
          linear-gradient(180deg, rgb(0 0 0 / 44%), rgb(0 0 0 / 14%) 34%, rgb(0 0 0 / 68%) 100%),
          radial-gradient(circle at 50% 38%, rgb(0 0 0 / 4%), rgb(0 0 0 / 46%) 72%),
          linear-gradient(180deg, rgb(255 255 255 / 5%), transparent 18%),
          repeating-linear-gradient(0deg, rgb(255 255 255 / 2%) 0 1px, transparent 1px 6px);
      }

      .study-stage {
        width: min(100%, 760px);
        min-height: 64vh;
        display: grid;
        place-items: center;
        gap: 16px;
        perspective: 1200px;
      }
      .mode-pill {
        min-height: 28px;
        padding: 6px 11px;
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 999px;
        background: rgb(0 0 0 / 35%);
        color: rgb(255 255 255 / 78%);
        font-size: 12px;
        font-weight: 800;
        line-height: 1.1;
      }

      .flip-card {
        width: 100%;
        min-height: min(72vh, 760px);
        display: grid;
        perspective: 1200px;
      }
      .flip-inner {
        position: relative;
        min-height: min(72vh, 760px);
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
        transition: transform 400ms cubic-bezier(.16, 1, .3, 1);
        will-change: transform;
      }
      .short.revealed .flip-inner { transform: rotateY(180deg); }
      .card-face {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 8px 4px;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        transition: opacity 160ms ease;
      }
      .card-front { opacity: 1; }
      .card-back { opacity: 0; }
      .short.revealed .card-front { opacity: 0; }
      .short.revealed .card-back { opacity: 1; }
      .card-back { transform: rotateY(180deg); }
      .study-text, .answer-text {
        margin: 0;
        width: fit-content;
        max-width: 100%;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        letter-spacing: 0;
        text-shadow: 0 3px 0 rgb(0 0 0 / 72%), 0 0 18px rgb(255 255 255 / 18%);
      }
      .study-text {
        font-size: clamp(34px, 10vw, 62px);
        font-weight: 900;
        line-height: 1.18;
      }
      .study-text.long-text { font-size: clamp(22px, 6.2vw, 38px); line-height: 1.28; }
      .study-text.very-long-text { font-size: clamp(16px, 4.7vw, 28px); line-height: 1.34; }
      .answer-text {
        color: rgb(255 255 255 / 92%);
        font-size: clamp(25px, 7vw, 46px);
        font-weight: 900;
        line-height: 1.24;
      }
      .answer-text.long-text { font-size: clamp(20px, 5.5vw, 34px); line-height: 1.3; }
      .answer-text.very-long-text { font-size: clamp(15px, 4.4vw, 25px); line-height: 1.36; }
      .study-image {
        display: none;
        width: auto;
        height: auto;
        max-width: min(96vw, 680px);
        max-height: min(72vh, 760px);
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 18px 44px rgb(0 0 0 / 52%);
      }
      .short.has-question-image .study-text { display: none; }
      .short.has-question-image .study-image { display: block; }
      .answer-image {
        display: none;
        width: auto;
        height: auto;
        max-width: min(96vw, 680px);
        max-height: min(72vh, 760px);
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 18px 44px rgb(0 0 0 / 52%);
      }
      .short.has-answer-image .answer-text { display: none; }
      .short.has-answer-image .answer-image { display: block; }
      .short.has-question-image,
      .short.has-answer-image {
        padding: 0;
      }
      .app.left-hand-mode .short.has-question-image,
      .app.left-hand-mode .short.has-answer-image {
        padding: 0;
      }
      .short.has-question-image .study-stage,
      .short.has-answer-image .study-stage {
        position: absolute;
        inset: 0;
        width: 100%;
        min-height: 100dvh;
        gap: 0;
        z-index: 0;
      }
      .short.has-question-image .mode-pill,
      .short.has-answer-image .mode-pill {
        display: none;
      }
      .short.has-question-image .flip-card,
      .short.has-answer-image .flip-card,
      .short.has-question-image .flip-inner,
      .short.has-answer-image .flip-inner {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
      }
      .short.has-question-image .card-face,
      .short.has-answer-image .card-face {
        padding: 0;
      }
      .short.has-question-image .study-image,
      .short.has-answer-image .answer-image {
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
      .drive-open-action {
        position: absolute;
        z-index: 8;
        right: calc(var(--safe-right) + 14px);
        bottom: calc(var(--safe-bottom) + 16px);
        display: none;
        align-items: center;
        gap: 7px;
        min-height: 36px;
        padding: 8px 11px;
        border: 1px solid rgb(255 255 255 / 28%);
        border-radius: 999px;
        background: rgb(0 0 0 / 48%);
        color: rgb(255 255 255 / 94%);
        font-size: 12px;
        font-weight: 850;
        line-height: 1;
        box-shadow: 0 10px 24px rgb(0 0 0 / 42%);
        pointer-events: auto;
      }
      .short.has-drive-source .drive-open-action { display: inline-flex; }
      .drive-open-action .icon {
        width: 17px;
        height: 17px;
      }
      .double-effect {
        position: fixed;
        z-index: 21;
        left: 50%;
        top: 50%;
        display: none;
        min-width: 118px;
        transform: translate(-50%, -50%) scale(.82);
        padding: 12px 18px;
        border: 2px solid currentColor;
        border-radius: 999px;
        background: rgb(0 0 0 / 52%);
        color: #67e8f9;
        text-align: center;
        font-size: 15px;
        font-weight: 950;
        box-shadow: 0 0 34px currentColor;
        pointer-events: none;
      }
      .double-effect.visible {
        display: block;
        animation: pop 560ms ease both;
      }
      .double-effect.master-effect {
        color: #facc15;
        background: rgb(32 24 0 / 72%);
        box-shadow: 0 0 28px #facc15, 0 0 70px rgb(250 204 21 / 55%);
      }

      .side-actions {
        position: absolute;
        right: calc(var(--safe-right) + 10px);
        bottom: calc(var(--safe-bottom) + 104px);
        z-index: 8;
        display: flex;
        width: 54px;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .app.left-hand-mode .side-actions {
        right: auto;
        left: calc(var(--safe-left) + 10px);
      }
      .action {
        display: grid;
        justify-items: center;
        gap: 3px;
        width: 54px;
        min-height: 47px;
        text-shadow: 0 1px 3px rgb(0 0 0 / 80%);
        transition: color 140ms ease, transform 140ms ease, filter 140ms ease;
      }
      .action .icon { width: 30px; height: 30px; filter: drop-shadow(0 1px 2px rgb(0 0 0 / 80%)); transition: stroke 140ms ease, filter 140ms ease; }
      .action.active { color: #67e8f9; }
      .action:disabled { opacity: .38; }
      .action.feedback {
        transform: scale(1.18);
        filter: drop-shadow(0 0 14px currentColor);
      }
      .action.feedback-got { color: #4ade80; }
      .action.feedback-hard { color: #fb7185; }
      .action.feedback-answer { color: #facc15; }
      .action-label {
        max-width: 54px;
        overflow-wrap: anywhere;
        font-size: 11px;
        font-weight: 850;
        line-height: 1.1;
      }

      .bottom-meta {
        position: absolute;
        left: calc(var(--safe-left) + 12px);
        right: calc(var(--safe-right) + 82px);
        bottom: calc(var(--safe-bottom) + 16px);
        z-index: 8;
        display: grid;
        gap: 9px;
      }
      .app.left-hand-mode .bottom-meta {
        left: calc(var(--safe-left) + 82px);
        right: calc(var(--safe-right) + 12px);
      }
      .creator-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        width: 100%;
        text-align: left;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        border: 1px solid rgb(255 255 255 / 55%);
        border-radius: 50%;
        background: linear-gradient(135deg, #f5d997, #8fd5d0 48%, #d7b7ff);
        color: #111;
        font-size: 19px;
        font-weight: 900;
      }
      .handle {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 15px;
        font-weight: 850;
      }
      .subscribe {
        display: none;
      }
      .stats { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; overflow: visible; }
      .stat {
        min-width: 0;
        padding: 5px 7px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 999px;
        background: rgb(0 0 0 / 34%);
        color: rgb(255 255 255 / 82%);
        font-size: 11px;
        font-weight: 850;
        line-height: 1.1;
        white-space: nowrap;
      }
      .today-stat {
        min-width: 74px;
        text-align: center;
      }
      .caption {
        display: none;
      }

      .sheet-panel {
        position: fixed;
        z-index: 19;
        left: calc(var(--safe-left) + 10px);
        right: calc(var(--safe-right) + 10px);
        bottom: calc(var(--safe-bottom) + 10px);
        display: none;
        max-width: 410px;
        max-height: min(64vh, 520px);
        margin: 0 auto;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 8px;
        background: #111;
        box-shadow: 0 18px 42px rgb(0 0 0 / 52%);
        overflow: hidden;
      }
      .sheet-panel.visible { display: grid; grid-template-rows: auto 1fr; }
      .page-panel {
        inset: 0;
        left: 0;
        right: 0;
        bottom: 0;
        max-width: none;
        max-height: none;
        border: 0;
        border-radius: 0;
        background: #050505;
      }
      .page-panel .panel-header {
        min-height: calc(var(--safe-top) + 58px);
        padding: var(--safe-top) calc(var(--safe-right) + 14px) 0 calc(var(--safe-left) + 14px);
      }
      .page-panel .panel-body {
        padding: 16px calc(var(--safe-right) + 14px) calc(var(--safe-bottom) + 18px) calc(var(--safe-left) + 14px);
      }
      @media (min-width: 640px) {
        .page-panel {
          left: 50%;
          right: auto;
          width: min(100vw, 430px);
          transform: translateX(-50%);
        }
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 48px;
        padding: 0 14px;
        border-bottom: 1px solid rgb(255 255 255 / 12%);
        font-size: 14px;
        font-weight: 900;
      }
      .panel-close { display: grid; place-items: center; width: 34px; height: 34px; }
      .panel-body {
        min-height: 0;
        padding: 14px;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
      .comment-list { display: grid; gap: 14px; align-content: start; }
      .book-list { display: grid; gap: 8px; align-content: start; }
      .book-item {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 10px;
        min-height: 46px;
        padding: 0 12px;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 8px;
        background: rgb(255 255 255 / 6%);
        color: #fff;
        text-align: left;
        font-size: 14px;
        font-weight: 850;
      }
      .book-item.active {
        border-color: rgb(103 232 249 / 64%);
        background: rgb(103 232 249 / 14%);
      }
      .book-check { color: #67e8f9; font-size: 12px; font-weight: 900; }
      .comment-item { display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
      .comment-avatar {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, #b7f7c2, #8fd5ff);
        color: #111;
        font-size: 13px;
        font-weight: 900;
      }
      .comment-name { margin: 0 0 3px; color: rgb(255 255 255 / 60%); font-size: 12px; font-weight: 800; }
      .comment-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: rgb(255 255 255 / 90%); font-size: 14px; font-weight: 650; line-height: 1.42; }

      .mastery-summary {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
        margin-bottom: 12px;
      }
      .rank-box {
        padding: 8px 6px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 8px;
        background: rgb(255 255 255 / 7%);
        text-align: center;
        font-size: 11px;
        font-weight: 850;
      }
      .mastery-list { display: grid; gap: 8px; }
      .mastery-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 9px 10px;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 8px;
        background: rgb(255 255 255 / 6%);
      }
      .mastery-word { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 850; }
      .rank-select {
        width: 82px;
        min-height: 32px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 7px;
        background: #1d1d1f;
        color: #fff;
        font-size: 12px;
        font-weight: 800;
      }

      .drawer {
        position: fixed;
        z-index: 18;
        left: calc(var(--safe-left) + 12px);
        right: calc(var(--safe-right) + 12px);
        bottom: calc(var(--safe-bottom) + 14px);
        display: none;
        max-width: 406px;
        margin: 0 auto;
        padding: 14px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 8px;
        background: rgb(14 14 15 / 92%);
        box-shadow: 0 18px 42px rgb(0 0 0 / 48%);
        backdrop-filter: blur(18px);
      }
      .drawer.visible { display: block; }
      .drawer-section + .drawer-section { margin-top: 12px; }
      .drawer-label {
        margin: 0 0 7px;
        color: rgb(255 255 255 / 62%);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0;
      }
      .drawer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .drawer-grid.compact { grid-template-columns: repeat(4, 1fr); }
      .drawer-range-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
      .tool {
        display: grid;
        place-items: center;
        min-height: 44px;
        border: 1px solid rgb(255 255 255 / 15%);
        border-radius: 8px;
        background: rgb(255 255 255 / 8%);
        color: #fff;
        font-size: 12px;
        font-weight: 850;
      }
      .tool.active { background: #fff; color: #050505; }
      .drawer-number {
        min-width: 0;
        min-height: 44px;
        border: 1px solid rgb(255 255 255 / 15%);
        border-radius: 8px;
        background: rgb(255 255 255 / 8%);
        color: #fff;
        font-size: 13px;
        font-weight: 850;
        text-align: center;
      }
      .drawer-number::placeholder { color: rgb(255 255 255 / 46%); }
      .range-row {
        display: grid;
        grid-template-columns: 68px 1fr 34px;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        color: rgb(255 255 255 / 82%);
        font-size: 12px;
        font-weight: 800;
      }
      input[type="range"] { width: 100%; accent-color: #67e8f9; }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(var(--safe-bottom) + 84px);
        z-index: 20;
        max-width: min(86vw, 360px);
        transform: translateX(-50%);
        padding: 10px 14px;
        border-radius: 999px;
        background: rgb(28 28 28 / 86%);
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }
      .toast.visible { opacity: 1; }
      .empty {
        position: fixed;
        inset: 0;
        z-index: 4;
        display: none;
        place-items: center;
        padding: 28px;
        text-align: center;
        background: #000;
        pointer-events: none;
      }
      .empty.visible { display: grid; }
      .empty p { max-width: 360px; margin: 0; color: rgb(255 255 255 / 78%); font-size: 16px; line-height: 1.6; }
      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 31;
        display: none;
        place-items: center;
        background: #000;
        color: rgb(255 255 255 / 86%);
        pointer-events: auto;
      }
      .loading-screen.visible { display: grid; }
      .loading-box {
        display: grid;
        justify-items: center;
        gap: 14px;
        font-size: 13px;
        font-weight: 900;
      }
      .loading-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgb(255 255 255 / 18%);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 820ms linear infinite;
      }

      @keyframes pop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(.72); }
        30% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.18); }
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (min-width: 640px) {
        .app {
          max-width: 430px;
          margin: 0 auto;
          box-shadow: 0 0 0 1px rgb(255 255 255 / 8%), 0 30px 80px rgb(0 0 0 / 55%);
        }
        .top-bar {
          left: 50%;
          right: auto;
          width: min(100vw, 430px);
          transform: translateX(-50%);
        }
      }
      @media (max-width: 360px) {
        .short { padding-right: calc(var(--safe-right) + 64px); }
        .subscribe { min-width: 66px; padding: 0 10px; font-size: 12px; }

    <script>
      const feed = document.getElementById('feed');
      const app = document.querySelector('.app');
      const viewport = document.getElementById('viewport');

      const empty = document.getElementById('empty');

      const speakButton = document.getElementById('speakButton');
