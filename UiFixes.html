<style>
  .drawer-close-section {
    position: sticky;
    top: 0;
    z-index: 3;
    margin: -2px -2px 10px;
    padding: 2px;
    background: linear-gradient(180deg, #15181d 76%, rgb(21 24 29 / 0%));
  }
  .drawer-close-button {
    width: 100%;
    min-height: 48px;
    border: 1px solid rgb(255 255 255 / 18%);
    border-radius: 14px;
    background: rgb(255 255 255 / 10%);
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 900;
  }
  .drawer-close-button:focus-visible {
    outline: 3px solid #67e8f9;
    outline-offset: 3px;
  }

  .app-guide:not([hidden]) {
    animation: guide-dark-in 500ms cubic-bezier(.16, 1, .3, 1) both;
  }
  .app-guide:not([hidden]) .app-guide-card {
    transform-origin: 50% 55%;
    animation: guide-boom-in 620ms cubic-bezier(.12, 1.18, .24, 1) both;
  }
  .app-guide:not([hidden]) .app-guide-icon {
    animation: guide-icon-boom 720ms cubic-bezier(.12, 1.25, .24, 1) 70ms both;
  }
  @keyframes guide-dark-in {
    from { background: rgb(0 0 0 / 100%); backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); }
    to { background: rgb(0 0 0 / 72%); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  }
  @keyframes guide-boom-in {
    0% { opacity: 0; transform: scale(.42) translateY(34px); filter: blur(14px); }
    58% { opacity: 1; transform: scale(1.055) translateY(-3px); filter: blur(0); }
    78% { transform: scale(.985) translateY(1px); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  }
  @keyframes guide-icon-boom {
    0% { opacity: 0; transform: scale(.2) rotate(-14deg); }
    62% { opacity: 1; transform: scale(1.16) rotate(3deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .app-guide:not([hidden]),
    .app-guide:not([hidden]) .app-guide-card,
    .app-guide:not([hidden]) .app-guide-icon {
      animation: none !important;
    }
  }
</style>

<script>
(() => {
  'use strict';

  function removeBackgroundRate() {
    const drawer = document.getElementById('drawer');
    if (!drawer) return;

    drawer.querySelectorAll('.drawer-section').forEach((section) => {
      const label = section.querySelector('.drawer-label');
      if (label?.textContent.trim() === 'Background Rate') section.remove();
    });
  }

  function closeDrawer() {
    const drawer = document.getElementById('drawer');
    const menuButton = document.getElementById('menuButton');
    if (!drawer) return;

    const appearsOpen = drawer.classList.contains('open')
      || drawer.classList.contains('visible')
      || drawer.getAttribute('aria-hidden') === 'false';

    if (appearsOpen && menuButton) {
      menuButton.click();
      return;
    }

    drawer.classList.remove('open', 'visible', 'active');
    drawer.setAttribute('aria-hidden', 'true');
  }

  function addDrawerCloseButton() {
    const drawer = document.getElementById('drawer');
    if (!drawer || document.getElementById('drawerCloseButton')) return;

    const wrap = document.createElement('div');
    wrap.className = 'drawer-close-section';
    wrap.innerHTML = '<button class="drawer-close-button" id="drawerCloseButton" type="button" aria-label="設定を閉じる">← 設定を閉じる</button>';
    drawer.insertBefore(wrap, drawer.firstElementChild);

    wrap.querySelector('button')?.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      closeDrawer();
    });

    drawer.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      event.preventDefault();
      closeDrawer();
    });
  }

  function initializeUiFixes() {
    removeBackgroundRate();
    addDrawerCloseButton();
  }

  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', initializeUiFixes, { once: true });
  } else {
    initializeUiFixes();
  }
})();
</script>
