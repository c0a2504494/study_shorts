      };

      function normalizeRank(value) {
        const text = String(value ?? '').trim().toUpperCase();
        if (Object.prototype.hasOwnProperty.call(GRADE_RANKS, text)) return GRADE_RANKS[text];
        const rank = Number(value);
        return Math.min(3, Math.max(1, Number.isFinite(rank) ? Math.round(rank * 10) / 10 : 3));
      }

      const GRADE_ORDER = ['S', 'A', 'B', 'C', 'D', 'E'];
      function formatRank(value) {
        return rankMood(value).face;
      }
      function adjacentGrade(value, direction) {
        const current = GRADE_ORDER.indexOf(rankMood(value).face);
        const next = Math.max(0, Math.min(GRADE_ORDER.length - 1, current + direction));
        return GRADE_ORDER[next];
      }

      function rankLabel(value) {
        return rankMood(value).label;
      }

      function rankWeight(value) {
        const rank = normalizeRank(value);
        return rank <= 1 ? 0 : Math.max(0.5, Math.pow(2, rank - 1));
      }

      function englishScore(value) {
        const text = String(value || '');
        const letters = (text.match(/[A-Za-z]/g) || []).length;
        const kana = (text.match(/[\u3040-\u30ff\u3400-\u9fff]/g) || []).length;
        return letters * 2 - kana + (/\b(the|a|an|to|of|in|for|with|is|are)\b/i.test(text) ? 4 : 0);
      }

      function englishText(item) {
        return englishScore(item.word) >= englishScore(item.answer) ? item.word : item.answer;
      }

      function columnLabel(columnNumber) {
        let label = '';
        let number = columnNumber;
        while (number > 0) {
          number -= 1;
          label = String.fromCharCode(65 + (number % 26)) + label;
          number = Math.floor(number / 26);
        }
        return label;
      }

      function parseItem(raw, id) {
        if (raw && typeof raw === 'object') {
          const question = String(raw.question || '').trim();
          const answerText = String(raw.answer || '').trim();
          const questionImageUrl = String(raw.questionImageUrl || '').trim();
          const answerImageUrl = String(raw.answerImageUrl || '').trim();
          const answerParts = answerImageUrl
            ? [answerText || 'Image']
            : answerText.split(/[|／/]/).map((value) => value.trim()).filter(Boolean);
          const studyCount = Math.max(0, Math.floor(Number(raw.studyCount ?? raw.skip ?? 0) || 0));
          return {
            id: raw.id || `row-${raw.row || id}-${question}-${answerText}`,
            row: Number(raw.row || 0),
            sheetName: String(raw.sheetName || '').trim(),
            raw: answerText ? `${question} - ${answerText}` : question,
            word: question || (questionImageUrl ? 'Image' : ''),
            answer: answerParts[0] || '',
            examples: answerParts.slice(1),
            comments: Array.isArray(raw.comments) ? raw.comments.filter(Boolean) : [],
            studyCount,
            rank: normalizeRank(raw.rank),
            promotionCount: Math.max(0, Math.floor(Number(raw.promotionCount) || 0)),
            promotionTarget: Math.max(0, Math.floor(Number(raw.promotionTarget) || 0)),
            questionImageUrl,
            answerImageUrl,
            questionDriveUrl: String(raw.questionDriveUrl || '').trim(),
            answerDriveUrl: String(raw.answerDriveUrl || '').trim(),
            backgroundUrl: String(raw.backgroundUrl || '').trim(),
          };
        }

        const text = String(raw || '').trim();
        const match = text.match(/^(.+?)\s*(?:\t|,|\s-\s|:|=)\s*(.+)$/);
        if (!match) {
          return {
            id,
            row: 0,
            sheetName: '',
            raw: text,
            word: text,
            answer: '',
            examples: [],
            comments: [],
            studyCount: 0,
            rank: 3,
            questionImageUrl: '',
            answerImageUrl: '',
            questionDriveUrl: '',
            answerDriveUrl: '',
            backgroundUrl: '',
          };
        }
        const answerParts = match[2].split(/[|／/]/).map((value) => value.trim()).filter(Boolean);
        return {
          id,
          row: 0,
          sheetName: '',
          raw: text,
          word: match[1].trim(),
          answer: answerParts[0] || '',
          examples: answerParts.slice(1),
          comments: [],
          studyCount: 0,
          rank: 3,
          questionImageUrl: '',
          answerImageUrl: '',
          questionDriveUrl: '',
          answerDriveUrl: '',
          backgroundUrl: '',
        };
      }

      function loadProgress() {
        flushProgress();
        try {
          state.progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        } catch (error) {
          state.progress = {};
        }
      }

      function flushProgress() {
        if (!state.progressSaveTimer) return;
        window.clearTimeout(state.progressSaveTimer);
        state.progressSaveTimer = 0;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
        } catch (error) {
          // Storage may be disabled; keep current in-memory progress usable.
        }
      }

      function saveProgress() {
        // A rapid swipe sequence should not serialize the entire progress object
        // to synchronous localStorage on every card.
        if (state.progressSaveTimer) window.clearTimeout(state.progressSaveTimer);
        state.progressSaveTimer = window.setTimeout(flushProgress, 250);
      }
      window.addEventListener('pagehide', flushProgress);

      function loadUiPreferences() {
        try {
          const prefs = JSON.parse(localStorage.getItem(UI_PREFS_KEY) || '{}');
          state.leftHandMode = Boolean(prefs.leftHandMode);
        } catch (error) {
          state.leftHandMode = false;
        }
        syncLeftHandMode();
      }

      function saveUiPreferences() {
        localStorage.setItem(UI_PREFS_KEY, JSON.stringify({
          leftHandMode: state.leftHandMode,
        }));
      }

      function syncLeftHandMode() {
        app?.classList.toggle('left-hand-mode', state.leftHandMode);
        toggleLeftHandMode?.classList.toggle('active', state.leftHandMode);
      }

      function getProgress(item) {
        const key = baseItemId(item);
        if (!state.progress[key]) {
          state.progress[key] = { known: item.rank <= 1, review: item.rank >= 3, seen: 0, miss: 0 };
        }
        return state.progress[key];
      }
      const PROMOTION_STEPS = Object.freeze({
        E: [1, 3], D: [3, 5], C: [3, 7], B: [5, 9], A: [5, 9],
      });
      function promotionProgress(item) {
        const source = sourceItemFor(item);
        if (!source) return { count: 0, target: 0 };
        const grade = rankMood(source.rank).face;
        const range = PROMOTION_STEPS[grade];
        if (!range) return { count: 0, target: 0 };
        const progress = getProgress(source);
        // Sheets P/Q hold shared progress; local storage covers demo/offline use.
        const count = Math.max(0, Math.floor(Number(source.promotionCount ?? progress.promotionCount) || 0));
        let target = Math.floor(Number(source.promotionTarget ?? progress.promotionTarget) || 0);
        if (target < range[0] || target > range[1]) {
          target = range[0] + Math.floor(Math.random() * (range[1] - range[0] + 1));
        }
        source.promotionCount = count;
        source.promotionTarget = target;
        progress.promotionCount = count;
        progress.promotionTarget = target;
        return { count, target };
      }
      function resetPromotionProgress(item) {
        const source = sourceItemFor(item);
        if (!source) return;
        const progress = getProgress(source);
        source.promotionCount = 0;
        source.promotionTarget = 0;
        progress.promotionCount = 0;
        progress.promotionTarget = 0;
        saveProgress();
      }

      function shuffle(values) {
        const copy = [...values];
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function uniqueHttpUrls(urls) {
        const seen = new Set();
        return (urls || [])
          .map((url) => String(url || '').trim())
          .filter((url) => {
            if (!/^https?:\/\//i.test(url) || seen.has(url)) return false;
            seen.add(url);
            return true;
          });
      }

      function shuffledBackgroundOrder(previousUrl = state.lastBackgroundUrl) {
        const order = shuffle(state.backgroundUrls);
        if (order.length > 1 && order[0] === previousUrl) {
          const swapIndex = order.findIndex((url, index) => index > 0 && url !== previousUrl);
          if (swapIndex > 0) {
            [order[0], order[swapIndex]] = [order[swapIndex], order[0]];
          }
        }
        return order;
      }

      function activePool() {
        if (!rankFilterIsAll()) {
          const pool = state.sourceItems.filter((item) => matchesRankFilter(item));
          return pool.length > 0 ? pool : [];
        }

        const available = state.sourceItems.filter((item) => item.row === 0 || item.rank > 1);
        if (!state.reviewOnly) {
          return available;
        }
        const pool = available.filter((item) => item.row === 0 || item.rank >= 3 || getProgress(item).review);
        return pool.length > 0 ? pool : available;
      }

      function matchesRankFilter(item) {
        const rank = normalizeRank(item?.rank);
        return state.rankFilters.some((filter) => {
          if (filter === 'all') return rank > 1;
          return rankMood(rank).face === filter;
        });
      }

      function rankFilterIsAll() {
        return state.rankFilters.includes('all') || state.rankFilters.length === 0;
      }

      function surpriseMasteredPool() {
        return []; // 習得済みカードは通常の学習に再出題しない。
      }

      function weightedDeck(pool) {
        const candidates = [...pool];
        const deck = [];
        const limit = candidates.length;

        while (deck.length < limit && candidates.length > 0) {
          const total = candidates.reduce((sum, item) => sum + rankWeight(item.rank), 0);
          let pick = Math.random() * total;
          let selected = 0;

          for (let i = 0; i < candidates.length; i += 1) {
            pick -= rankWeight(candidates[i].rank);
            if (pick <= 0) {
              selected = i;
              break;
            }
          }

          deck.push(candidates.splice(selected, 1)[0]);
        }

        return injectSurpriseMastered(deck);
      }

      function injectSurpriseMastered(deck) {
        const surprises = surpriseMasteredPool();
        if (surprises.length === 0) return deck;

        const mixed = [...deck];
        surprises.forEach((item, index) => {
          const minPosition = Math.min(mixed.length, 5 + index * 7);
          const insertIndex = Math.min(mixed.length, minPosition + Math.floor(Math.random() * 6));
          mixed.splice(insertIndex, 0, repeatCopy(item, 'surprise'));
        });

        return mixed;
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('visible');
        window.clearTimeout(state.toastTimer);
        state.toastTimer = window.setTimeout(() => toast.classList.remove('visible'), 1200);
      }

      function showLoading(message = '読み込み中') {
        if (state.initialLoadingComplete) return;
        const label = loadingScreen.querySelector('.loading-box div:last-child');
        if (label) label.textContent = message;
        loadingScreen.classList.add('visible');
      }

      function hideLoading() {
        if (state.initialLoadingComplete) return;
        window.clearTimeout(state.initialLoadingTimer);
        loadingScreen.classList.remove('visible');
        state.initialLoadingComplete = true;
      }

      loadUiPreferences();

      function showDoubleEffect(text) {
        doubleEffect.textContent = text;
        doubleEffect.classList.remove('master-effect');
        doubleEffect.classList.remove('visible');
        window.clearTimeout(state.effectTimer);
        requestAnimationFrame(() => doubleEffect.classList.add('visible'));
        state.effectTimer = window.setTimeout(() => doubleEffect.classList.remove('visible', 'master-effect'), 560);
      }

      function showMasterEffect() {
        doubleEffect.textContent = '習得！';
        doubleEffect.classList.remove('visible');
        doubleEffect.classList.add('master-effect');
        window.clearTimeout(state.effectTimer);
        requestAnimationFrame(() => doubleEffect.classList.add('visible'));
        state.effectTimer = window.setTimeout(() => doubleEffect.classList.remove('visible', 'master-effect'), 900);
      }

      function hasCardFaceImage(item) {
        return Boolean(item?.questionImageUrl || item?.answerImageUrl);
      }

      function displayParts(item) {
        const source = sourceItemFor(item);
        const shouldReverse = state.reverse && source.answer && !hasCardFaceImage(source);
        const front = shouldReverse ? source.answer : source.word;
        const back = shouldReverse ? source.word : source.answer;
        return { front, back: back || '答えがありません' };
      }

      function baseItemId(item) {
        return item?.baseId || item?.id || '';
      }

      function sourceItemFor(item) {
        return state.sourceItemMap.get(baseItemId(item)) || item;
      }

      function sheetNameForItem(item) {
        const source = sourceItemFor(item);
        return source?.sheetName || state.currentSheet;
      }

      function driveUrlForItem(item, revealed = false) {
        if (!item) return '';
        if (revealed && item.answerDriveUrl) return item.answerDriveUrl;
        if (!revealed && item.questionDriveUrl) return item.questionDriveUrl;
        return revealed ? item.questionDriveUrl || '' : '';
      }

      function preloadImageUrl(url) {
        const value = String(url || '').trim();
        if (!/^https?:\/\//i.test(value) || state.imagePreloadCache.has(value)) return;

        if (state.imagePreloadCache.size > 48) {
          const firstKey = state.imagePreloadCache.keys().next().value;
          if (firstKey) state.imagePreloadCache.delete(firstKey);
        }

        const image = new Image();
        image.referrerPolicy = 'no-referrer';
        image.decoding = 'async';
        image.loading = 'eager';
        state.imagePreloadCache.set(value, image);
        image.src = value;
      }

      function preloadAroundIndex(center = state.index) {
        if (state.items.length === 0) return;

        const urls = [];
        const start = Math.max(0, center);
        const end = Math.min(state.items.length - 1, center + 1);
        for (let position = start; position <= end; position += 1) {
          const item = sourceItemFor(state.items[position]);
          if (!item) continue;
          urls.push(item.questionImageUrl);
          if (position === center) urls.push(item.answerImageUrl);
          const backgroundUrl = state.fixedBackground
            ? item.backgroundUrl
            : state.backgroundAssignments[backgroundKeyForPosition(position)] || '';
          if (backgroundUrl) urls.push(backgroundUrl);
        }

        window.clearTimeout(state.preloadQueueTimer);
        state.preloadQueueTimer = window.setTimeout(() => {
          urls.filter(Boolean).forEach(preloadImageUrl);
        }, 120);
      }

      function repeatCopy(item, offset) {
        const source = sourceItemFor(item);
        return {
          ...source,
          id: `${baseItemId(source)}-repeat-${Date.now()}-${Math.random().toString(36).slice(2)}`,
          baseId: baseItemId(source),
          repeatOffset: offset,
          isRepeatCopy: true,
        };
      }

      function rebuildDeck(options = {}) {
        const keepRound = options.keepRound === true;
        state.repeatedIds.clear();
        state.againPressedItemIds.clear();

        state.revealedIds.clear();
        state.backgroundAssignments = {};
        state.backgroundCursor = 0;
        state.lastBackgroundUrl = '';
        state.backgroundOrder = shuffledBackgroundOrder('');

        feed.replaceChildren();
        state.items = weightedDeck(activePool());
        state.index = 0;
        if (!keepRound) state.round = 1;

        if (state.items.length === 0) {
          empty.classList.add('visible');
          empty.querySelector('p').textContent = emptyMessage();
          updatePlayback();
          return;
        }

        empty.classList.remove('visible');
        snapTo(0, false);
        preloadAroundIndex(0);
        scheduleAuto();
        state.touchedIds.clear();
      }

      function render(rawItems) {
        loadProgress();
        const payload = Array.isArray(rawItems) ? { items: rawItems, backgroundUrls: [] } : rawItems || {};
        if (Array.isArray(payload.sheetNames) && payload.sheetNames.length > 0) {
          state.selectedSheetNames = payload.sheetNames;
          state.currentSheet = payload.sheetNames[0] || state.currentSheet;
        }
        state.driveFolders = Number(payload.driveFolders || 0);
        state.driveImages = Number(payload.driveImages || 0);
        state.driveRemoved = Number(payload.driveRemoved || 0);
        state.driveErrors = Array.isArray(payload.driveErrors) ? payload.driveErrors : [];
        state.averageRank = Number.isFinite(Number(payload.averageRank))
          ? Number(payload.averageRank)
          : averageRankForPayload(payload.items || []);
        state.todayPlayCount = Number(payload.todayPlayCount || 0);
        state.totalPlayCount = Number(payload.totalPlayCount || 0);
        state.deckStats = Array.isArray(payload.deckStats) ? payload.deckStats : [];
        state.backgroundUrls = uniqueHttpUrls(payload.backgroundUrls);
        state.backgroundOrder = shuffledBackgroundOrder('');
        state.backgroundAssignments = {};
        state.failedBackgroundUrls.clear();
        state.backgroundCursor = 0;
        state.lastBackgroundUrl = '';
        state.fixedBackground = true;
        const rawProbability = payload.backgroundProbability;
        state.backgroundProbability = rawProbability === 0 || rawProbability === '0' ? 0 : 1;
        const rawMasteredProbability = payload.masteredProbability;
        state.masteredProbability =
          rawMasteredProbability === null ||
          rawMasteredProbability === undefined ||
          rawMasteredProbability === ''
            ? 0.05
            : Number.isFinite(Number(rawMasteredProbability))
              ? Math.min(1, Math.max(0, Number(rawMasteredProbability)))
              : 0.05;
        syncBackgroundProbabilityControl();
        state.sourceItems = (payload.items || [])
          .map((item, index) => parseItem(item, `row-${index + 1}`))
          .filter((item) => item.word);
        state.sourceItemMap = new Map(state.sourceItems.map((item) => [item.id, item]));
        rebuildDeck();
        recordDailyLoginOnce();
        if (state.backgroundUrls.length > 0) {
          showToast(`Images ${state.backgroundUrls.length}`);
        }
        hideLoading();
      }

      function emptyMessage() {
        if (!rankFilterIsAll()) {
          return 'カードがありませんs match this rank filter.';
        }

        if (state.driveFolders > 0 && state.driveImages === 0) {
          const error = state.driveErrors[0]?.message || '';
          return error
            ? `Drive folder found, but images could not be loaded: ${error}`
            : 'Drive folder found, but no image files were found.';
        }

        return state.sourceItems.length > 0
          ? 'すべて習得済みです。おつかれさまでした！'
          : 'A列に問題、B列に答えを入力してください。';
      }

      function recordDailyLoginOnce() {
        const sheet = state.currentSheet || '';
        if (!sheet || state.loginRecordedSheets.has(sheet)) return;
        if (!window.google || !google.script || !google.script.run) return;
        state.loginRecordedSheets.add(sheet);
        google.script.run
          .withSuccessHandler((result) => {
            if (result && result.stats) {
              if (Number.isFinite(Number(result.stats.todayPlayCount))) state.todayPlayCount = Number(result.stats.todayPlayCount);
              if (Number.isFinite(Number(result.stats.totalPlayCount))) state.totalPlayCount = Number(result.stats.totalPlayCount);
              if (Number.isFinite(Number(result.stats.averageRank))) state.averageRank = Number(result.stats.averageRank);
              updateStatsDisplay();
            }
            if (result && result.streak) showToast(`${result.streak} day streak`);
          })
          .withFailureHandler(() => {})
          .recordDailyLogin(sheet);
      }

      function preloadBackgrounds(urls) {
        urls.slice(0, 2).forEach((url) => {
          const image = new Image();
          image.decoding = 'async';
          image.onload = () => {
            state.backgroundMeta[url] = {
              width: image.naturalWidth || 0,
              height: image.naturalHeight || 0,
            };
            updateBackgroundFits();
          };
          image.src = url;
        });
      }

      function resetBackgroundChoices() {
        state.backgroundAssignments = {};
        state.backgroundCursor = 0;
        state.lastBackgroundUrl = '';
        state.backgroundOrder = shuffledBackgroundOrder('');
      }

      function syncBackgroundProbabilityControl() {
        saveBackgroundProbability.classList.toggle('active', state.backgroundProbability === 1);
        clearBackgroundProbability.classList.toggle('active', state.backgroundProbability === 0);
        saveBackgroundProbability.setAttribute('aria-pressed', String(state.backgroundProbability === 1));
        clearBackgroundProbability.setAttribute('aria-pressed', String(state.backgroundProbability === 0));
      }

      function parseBackgroundProbabilityInput(value) {
        return value === 0 || value === '0' ? 0 : 1;
      }

      function saveBackgroundProbabilityValue(nextProbability) {
        if (!window.google || !google.script || !google.script.run) return;
        google.script.run
          .withSuccessHandler((result) => {
            if (result && Object.prototype.hasOwnProperty.call(result, 'backgroundProbability')) {
              state.backgroundProbability = parseBackgroundProbabilityInput(result.backgroundProbability);
              resetBackgroundChoices();
              syncBackgroundProbabilityControl();
              renderWindowSlides();
            }
          })
          .withFailureHandler(() => showToast('背景の設定を保存できませんでした'))
          .setBackgroundProbability(nextProbability === null ? '' : nextProbability, state.currentSheet);
      }

      function setBackgroundProbabilityFromInput(value, persist = true) {
        const nextProbability = parseBackgroundProbabilityInput(value);
        if (typeof nextProbability === 'undefined') {
          showToast('Use 0 to 1');
          syncBackgroundProbabilityControl();
          return;
        }

        state.backgroundProbability = nextProbability;
        resetBackgroundChoices();
        syncBackgroundProbabilityControl();
        renderWindowSlides();
        if (persist) saveBackgroundProbabilityValue(nextProbability);
        showToast(nextProbability === 1 ? '背景を表示します' : '背景を非表示にしました');
      }

      function backgroundForPosition(position) {
        const key = backgroundKeyForPosition(position);
        if (state.backgroundProbability !== null && state.backgroundProbability <= 0) {
          state.backgroundAssignments[key] = '';
          return '';
        }

        if (Object.prototype.hasOwnProperty.call(state.backgroundAssignments, key)) {
          return state.backgroundAssignments[key];
        }

        const shouldShow = state.backgroundProbability === null
          ? Math.random() < 0.9
          : Math.random() < state.backgroundProbability;
        if (!shouldShow) {
          state.backgroundAssignments[key] = '';
          return '';
        }

        if (state.fixedBackground) {
          const item = state.items[position];
          const source = sourceItemFor(item);
          const url = source?.backgroundUrl || '';
          state.backgroundAssignments[key] = url;
          return url;
        }

        if (state.backgroundUrls.length === 0) return '';

        if (state.backgroundOrder.length === 0) {
          state.backgroundOrder = shuffledBackgroundOrder();
          state.backgroundCursor = 0;
        }
        if (state.backgroundCursor >= state.backgroundOrder.length) {
          state.backgroundOrder = shuffledBackgroundOrder();
          state.backgroundCursor = 0;
        }

        const url = nextUsableBackgroundUrl();
        if (!url) {
          state.backgroundAssignments[key] = '';
          return '';
        }
        state.backgroundCursor += 1;
        state.backgroundAssignments[key] = url;
        state.lastBackgroundUrl = url;
        return url;
      }

      function nextUsableBackgroundUrl() {
        let attempts = 0;
        while (attempts < state.backgroundUrls.length) {
          if (state.backgroundOrder.length === 0) {
            state.backgroundOrder = shuffledBackgroundOrder();
            state.backgroundCursor = 0;
          }
          if (state.backgroundCursor >= state.backgroundOrder.length) {
            state.backgroundOrder = shuffledBackgroundOrder();
            state.backgroundCursor = 0;
          }

          const url = state.backgroundOrder[state.backgroundCursor] || '';
          if (url && !state.failedBackgroundUrls.has(url)) return url;
          state.backgroundCursor += 1;
          attempts += 1;
        }

        return '';
      }

      function markBackgroundFailed(url) {
        const value = String(url || '').trim();
        if (!value) return;
        state.failedBackgroundUrls.add(value);
        Object.keys(state.backgroundAssignments).forEach((key) => {
          if (state.backgroundAssignments[key] === value) {
            delete state.backgroundAssignments[key];
          }
        });
      }

      function backgroundKeyForPosition(position) {
        const item = state.items[position];
        return item ? `item:${item.id}` : `position:${position}`;
      }

      function backgroundFitForUrl(url) {
        const meta = state.backgroundMeta[url];
        if (!meta || !meta.width || !meta.height) return 'contain';
        const imageRatio = meta.width / meta.height;
        const screenRatio = window.innerWidth / window.innerHeight;
        if (imageRatio > screenRatio * 2.15) return 'wide';
        if (imageRatio < screenRatio * 0.46) return 'tall';
        return 'contain';
      }

      function updateBackgroundFits() {
        feed.querySelectorAll('.short').forEach((slide) => {
          const url = slide.dataset.backgroundUrl || '';
          if (!url) return;
          slide.dataset.bgFit = backgroundFitForUrl(url);
        });
      }

      function activeSheetNames() {
        return state.selectedSheetNames.length > 0
          ? [...state.selectedSheetNames]
          : state.currentSheet ? [state.currentSheet] : [];
      }

      function activeSheetLabel() {
        const names = activeSheetNames();
        if (names.length === 0) return 'Book';
        if (names.length === 1) return names[0];
        return `${names.length} Books`;
      }

      function fallbackBookTreeLayout(names = state.sheetNames) {
        return {
          version: 1,
          children: names.map((sheetName) => ({
            id: `sheet-${sheetName}`,
            type: 'sheet',
            name: sheetName,
            sheetName,
            children: [],
          })),
        };
      }

      function normalizeBookTreeLayout(layout, names = state.sheetNames) {
        const validNames = new Set(names);
        const used = new Set();
        const cleanNode = (node) => {
          const type = node?.type === 'folder' ? 'folder' : 'sheet';
          if (type === 'folder') {
            return {
              id: String(node.id || `folder-${Date.now()}-${Math.random().toString(36).slice(2)}`),
              type: 'folder',
              name: String(node.name || '棚を追加').trim() || '棚を追加',
              children: cleanNodes(node.children),
            };
          }

          const sheetName = String(node?.sheetName || '').trim();
          if (!validNames.has(sheetName) || used.has(sheetName)) return null;
          used.add(sheetName);
          return {
            id: String(node.id || `sheet-${sheetName}`),
            type: 'sheet',
            name: String(node.name || sheetName).trim() || sheetName,
            sheetName,
            children: [],
          };
        };
        const cleanNodes = (nodes) => (Array.isArray(nodes) ? nodes : []).map(cleanNode).filter(Boolean);
        const children = cleanNodes(layout?.children);
        names.forEach((sheetName) => {
          if (!used.has(sheetName)) {
            children.push({ id: `sheet-${sheetName}`, type: 'sheet', name: sheetName, sheetName, children: [] });
          }
        });
        return { version: 1, children };
      }

      function sheetsUnderNode(node) {
        if (!node) return [];
        if (node.type === 'sheet') return [node.sheetName];
        return (node.children || []).flatMap(sheetsUnderNode);
      }

      function selectedSheetSet() {
        return new Set(activeSheetNames());
      }

      function setSelectedSheets(names) {
        const valid = names.filter((name, index) => state.sheetNames.includes(name) && names.indexOf(name) === index);
        state.selectedSheetNames = valid;
        if (valid.length === 1) state.currentSheet = valid[0];
        renderBooks();
      }

      function toggleSheetSelection(sheetName) {
        const set = selectedSheetSet();
        if (set.has(sheetName)) {
          set.delete(sheetName);
        } else {
          set.add(sheetName);
        }
        setSelectedSheets([...set]);
      }

      function toggleFolderSelection(node) {
        const descendants = sheetsUnderNode(node);
        const set = selectedSheetSet();
        const allSelected = descendants.length > 0 && descendants.every((sheetName) => set.has(sheetName));
        descendants.forEach((sheetName) => {
          if (allSelected) {
            set.delete(sheetName);
          } else {
            set.add(sheetName);
          }
        });
        setSelectedSheets([...set]);
      }

      function bookCheckNode(checked) {
        const check = document.createElement('span');
        check.className = `book-select${checked ? ' checked' : ''}`;
        check.textContent = checked ? '✓' : '';
        return check;
      }

      function findBookNode(id, nodes = state.bookTreeLayout.children, parent = null) {
        for (let index = 0; index < nodes.length; index += 1) {
          const node = nodes[index];
          if (node.id === id) return { node, parent, siblings: nodes, index };
          const found = findBookNode(id, node.children || [], node);
          if (found) return found;
        }
        return null;
      }

      function moveBookNode(draggedId, targetId, mode = 'before') {
        if (!draggedId || draggedId === targetId) return false;
        const dragged = findBookNode(draggedId);
        const target = findBookNode(targetId);
        if (!dragged || !target) return false;

        let ancestor = target.node;
        while (ancestor) {
          if (ancestor.id === draggedId) return false;
          ancestor = findBookNode(ancestor.id)?.parent || null;
        }

        const [node] = dragged.siblings.splice(dragged.index, 1);
        if (target.node.type === 'folder' && mode === 'inside') {
          target.node.children = target.node.children || [];
          target.node.children.push(node);
          state.expandedBookPaths.add(target.node.id);
        } else {
          const refreshedTarget = findBookNode(targetId);
          if (!refreshedTarget) {
            state.bookTreeLayout.children.push(node);
          } else {
            refreshedTarget.siblings.splice(refreshedTarget.index, 0, node);
          }
        }
        return true;
      }

      function moveBookNodeToRoot(draggedId) {
        if (!draggedId) return false;
        const dragged = findBookNode(draggedId);
        if (!dragged) return false;
        const [node] = dragged.siblings.splice(dragged.index, 1);
        state.bookTreeLayout.children.push(node);
        return true;
      }

      function saveBookTreeLayout() {
        const layout = normalizeBookTreeLayout(state.bookTreeLayout);
        state.bookTreeLayout = layout;
        if (!window.google || !google.script || !google.script.run) return;
        google.script.run
          .withSuccessHandler((saved) => {
            state.bookTreeLayout = normalizeBookTreeLayout(saved);
            renderBooks();
            showToast('本棚を保存しました');
          })
          .withFailureHandler(() => showToast('本棚を保存できませんでした'))
          .saveBookTreeLayout(layout);
      }

      function addFolderToBookTree() {
        const name = window.prompt('棚の名前', '新しい棚');
        if (!name) return;
        state.bookTreeLayout.children.push({
          id: `folder-${Date.now()}-${Math.random().toString(36).slice(2)}`,
          type: 'folder',
          name: name.trim() || '新しい棚',
          children: [],
        });
        renderBooks();
        saveBookTreeLayout();
      }

      function addChildFolderToBookTree(folder) {
        const name = window.prompt('棚の名前', '新しい棚');
        if (!name) return;
        folder.children = folder.children || [];
        folder.children.push({
          id: `folder-${Date.now()}-${Math.random().toString(36).slice(2)}`,
          type: 'folder',
          name: name.trim() || '新しい棚',
          children: [],
        });
        state.expandedBookPaths.add(folder.id);
        renderBooks();
        saveBookTreeLayout();
      }

      function renameBookFolder(folder) {
        const name = window.prompt('棚の名前', folder.name);
        if (!name) return;
        folder.name = name.trim() || folder.name;
        renderBooks();
        saveBookTreeLayout();
      }

      function deleteBookFolder(folder) {
        const found = findBookNode(folder.id);
        if (!found || folder.type !== 'folder') return;
        const count = sheetsUnderNode(folder).length;
        const message = count > 0
          ? `棚「${folder.name}」を削除しますか？\n中の${count}件は上の階層に移動します。`
          : `棚「${folder.name}」を削除しますか？`;
        if (!window.confirm(message)) return;
        found.siblings.splice(found.index, 1, ...(folder.children || []));
        state.expandedBookPaths.delete(folder.id);
        renderBooks();
        saveBookTreeLayout();
      }

      function folderToolsNode(folder) {
        if (!state.bookEditMode) {
          const meta = document.createElement('span');
          meta.className = 'book-meta';
          meta.textContent = `${sheetsUnderNode(folder).length}`;
          return meta;
        }

        const tools = document.createElement('div');
        const add = document.createElement('button');
        const rename = document.createElement('button');
        const remove = document.createElement('button');

        tools.className = 'folder-tools';
        add.className = 'folder-tool';
        add.type = 'button';
        add.textContent = '+';
        rename.className = 'folder-tool';
        rename.type = 'button';
        rename.textContent = '名前を変更';
        remove.className = 'folder-tool danger';
        remove.type = 'button';
        remove.textContent = '削除';

        add.addEventListener('click', (event) => {
          event.stopPropagation();
          addChildFolderToBookTree(folder);
        });
        rename.addEventListener('click', (event) => {
          event.stopPropagation();
          renameBookFolder(folder);
        });
        remove.addEventListener('click', (event) => {
          event.stopPropagation();
          deleteBookFolder(folder);
        });

        tools.append(add, rename, remove);
        return tools;
      }

      function attachBookDrag(row, node) {
        row.draggable = state.bookEditMode;
        row.classList.toggle('editing', state.bookEditMode);
        if (!state.bookEditMode) return;

        row.addEventListener('dragstart', (event) => {
          state.draggedBookId = node.id;
          row.classList.add('dragging');
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', node.id);
        });
        row.addEventListener('dragend', () => {
          state.draggedBookId = '';
          row.classList.remove('dragging');
          bookList.querySelectorAll('.drop-target').forEach((target) => target.classList.remove('drop-target'));
        });
        row.addEventListener('dragover', (event) => {
          if (!state.draggedBookId || state.draggedBookId === node.id) return;
          event.preventDefault();
          row.classList.add('drop-target');
        });
        row.addEventListener('dragleave', () => row.classList.remove('drop-target'));
        row.addEventListener('drop', (event) => {
          event.preventDefault();
          row.classList.remove('drop-target');
          const draggedId = event.dataTransfer.getData('text/plain') || state.draggedBookId;
          const rect = row.getBoundingClientRect();
          const mode = node.type === 'folder' && event.clientX > rect.left + 72 ? 'inside' : 'before';
          if (moveBookNode(draggedId, node.id, mode)) {
            renderBooks();
            saveBookTreeLayout();
          }
        });
      }

      function renderBookNode(nodes, depth = 0) {
        nodes.forEach((node) => {
          if (node.type === 'folder') {
            const descendants = sheetsUnderNode(node);
            const selected = selectedSheetSet();
            const checked = descendants.length > 0 && descendants.every((sheetName) => selected.has(sheetName));
            const expanded = state.expandedBookPaths.has(node.id);
            const row = document.createElement('div');
            const toggle = document.createElement('button');
            const label = document.createElement('button');
            const tools = folderToolsNode(node);

            row.className = 'book-item book-row folder';
            row.style.setProperty('--depth', depth);
            row.dataset.bookId = node.id;
            toggle.className = 'book-toggle';
            toggle.type = 'button';
            toggle.innerHTML = expanded
              ? '<svg class="icon" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'
              : '<svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>';
            label.className = 'book-name book-name-button';
            label.type = 'button';
            label.textContent = node.name;

            toggle.addEventListener('click', () => {
              if (expanded) {
                state.expandedBookPaths.delete(node.id);
              } else {
                state.expandedBookPaths.add(node.id);
              }
              renderBooks();
            });
            label.addEventListener('click', () => {
              if (state.bookEditMode) {
                renameBookFolder(node);
              } else {
                toggleFolderSelection(node);
              }
            });
            row.append(toggle, label, bookCheckNode(checked), tools);
            attachBookDrag(row, node);
            bookList.appendChild(row);

            if (expanded) renderBookNode(node.children || [], depth + 1);
            return;
          }

            const button = document.createElement('button');
            const label = document.createElement('span');
            const check = bookCheckNode(activeSheetNames().includes(node.sheetName));

            button.className = 'book-item book-row';
            button.type = 'button';
            button.style.setProperty('--depth', depth);
            button.dataset.bookId = node.id;
            button.classList.toggle('active', activeSheetNames().includes(node.sheetName));
            label.className = 'book-name';
            label.textContent = node.name;

            button.append(document.createElement('span'), label, check);
            button.addEventListener('click', () => {
              if (state.bookEditMode) {
                showToast('長押しして並べ替え');
              } else {
                selectBook(node.sheetName);
              }
            });
            button.addEventListener('contextmenu', (event) => {
              event.preventDefault();
              toggleSheetSelection(node.sheetName);
            });
            check.addEventListener('click', (event) => {
              event.stopPropagation();
              toggleSheetSelection(node.sheetName);
            });
            attachBookDrag(button, node);
            bookList.appendChild(button);
        });
      }

      function renderBooks() {
        const selectedCount = activeSheetNames().length;
        bookTitle.textContent = selectedCount > 1 ? `本棚 ・ ${selectedCount}冊を選択` : '本棚';
        bookList.replaceChildren();
        bookList.classList.toggle('edit-mode', state.bookEditMode);
        toggleBookEdit.textContent = state.bookEditMode ? '並べ替えを完了' : '並べ替え';
        toggleBookEdit.classList.toggle('active', state.bookEditMode);
        addBookFolder.style.display = state.bookEditMode ? 'grid' : 'none';
        if (!state.bookEditMode && state.sheetNames.length) {
          const fragment = document.createDocumentFragment();
          renderBookshelf(state.bookTreeLayout.children || [], new Set(activeSheetNames()), fragment);
          bookList.appendChild(fragment);
          return;
        }

        if (state.sheetNames.length === 0) {
          const emptyRow = document.createElement('div');
          emptyRow.className = 'book-item';
          emptyRow.textContent = !state.startupReady ? '本棚を読み込み中…'
            : state.startupFailed ? '本棚の読み込みに失敗しました'
            : '本がありません';
          bookList.appendChild(emptyRow);
          return;
        }

        if (state.bookEditMode) {
          const rootDrop = document.createElement('div');
          rootDrop.className = 'book-item book-row folder';
          rootDrop.innerHTML = '<span></span><span class="book-name">本棚の先頭</span><span></span><span class="book-meta">ここに移動</span>';
          rootDrop.addEventListener('dragover', (event) => {
            if (!state.draggedBookId) return;
            event.preventDefault();
            rootDrop.classList.add('drop-target');
          });
          rootDrop.addEventListener('dragleave', () => rootDrop.classList.remove('drop-target'));
          rootDrop.addEventListener('drop', (event) => {
            event.preventDefault();
            rootDrop.classList.remove('drop-target');
            const draggedId = event.dataTransfer.getData('text/plain') || state.draggedBookId;
            if (moveBookNodeToRoot(draggedId)) {
              renderBooks();
              saveBookTreeLayout();
            }
          });
          bookList.appendChild(rootDrop);
        }

        renderBookNode(state.bookTreeLayout.children || []);
        toggleBookEdit.classList.toggle('active', state.bookEditMode);
        addBookFolder.style.display = state.bookEditMode ? 'grid' : 'none';
      }

      function openBooks() {
        closeAllPanels();
        window.clearTimeout(state.autoTimer);
        renderBooks();
        bookPanel.classList.add('visible');
        requestAnimationFrame(() => setBooksReveal(pageWidth()));
      }

      function showTitleScreen() {
        drawer.classList.remove('visible');
        commentsPanel.classList.remove('visible');
        masteryPanel.classList.remove('visible');
        settleBooks(false);
        window.clearTimeout(state.autoTimer);
        hideLoading();
        titleScreen.classList.remove('hidden');
        titleScreen.removeAttribute('aria-hidden');
        titleStart.focus();
      }

      titleStart.addEventListener('click', () => {
        titleScreen.classList.add('hidden');
        titleScreen.setAttribute('aria-hidden', 'true');
        hideLoading();
        openBooks();
      });

      function selectBook(name) {
        state.currentSheet = name;
        state.selectedSheetNames = [name];
        showToast(`本：${name}`);
        closeAllPanels();
        loadItems(name);
      }

      function studySelectedSheets() {
        const names = activeSheetNames();
        if (names.length === 0) {
          showToast('学習する本を選んでください');
          return;
        }
        state.currentSheet = names[0];
        state.selectedSheetNames = names;
        showToast(names.length === 1 ? `本：${names[0]}` : `${names.length}冊で学習`);
        closeAllPanels();
        loadItems(names);
      }

      function updateSlides() {
        updatePlayback();
        const activeCount = state.items.length;

        [...feed.querySelectorAll('.short')].forEach((slide) => {
          const item = state.items[Number(slide.dataset.position)];
          if (!item) return;
          const source = sourceItemFor(item);
          const progress = getProgress(item);
          const parts = displayParts(item);
          const answer = [parts.back, ...item.examples].filter(Boolean).join('\n');
          const questionImageUrl = source.questionImageUrl || '';
          const answerImageUrl = source.answerImageUrl || '';
          const isRevealed = state.alwaysShowAnswer || state.revealedIds.has(item.id);
          const driveUrl = driveUrlForItem(source, isRevealed);
          const hasVisibleDriveImage = isRevealed ? Boolean(answerImageUrl) : Boolean(questionImageUrl);
          const studyText = slide.querySelector('.study-text');
          const answerText = slide.querySelector('.answer-text');
          const studyImage = slide.querySelector('.study-image');
          const answerImage = slide.querySelector('.answer-image');
          const driveOpenAction = slide.querySelector('.drive-open-action');

          slide.dataset.fullText = parts.front;
          slide.dataset.answer = answer;
          slide.classList.toggle('active-slide', Number(slide.dataset.position) === state.index);
          slide.classList.toggle('revealed', isRevealed);
          slide.classList.toggle('has-question-image', Boolean(questionImageUrl));
          slide.classList.toggle('has-answer-image', Boolean(answerImageUrl));
          slide.classList.toggle('has-drive-source', Boolean(driveUrl && hasVisibleDriveImage));
          if (driveOpenAction) {
            driveOpenAction.dataset.driveUrl = driveUrl;
          }
          studyText.textContent = parts.front;
          applyTextScale(studyText, parts.front);
          answerText.textContent = answer;
          applyTextScale(answerText, answer);
          if (questionImageUrl) {
            studyImage.referrerPolicy = 'no-referrer';
            studyImage.loading = Number(slide.dataset.position) === state.index ? 'eager' : 'lazy';
            if (studyImage.getAttribute('src') !== questionImageUrl) studyImage.src = questionImageUrl;
            studyImage.onerror = () => slide.classList.remove('has-question-image');
            slide.classList.remove('has-photo');
            slide.style.removeProperty('--card-bg-image');
            slide.style.removeProperty('--card-bg-opacity');
            const backgroundImage = slide.querySelector('.photo-bg img');
            if (backgroundImage) backgroundImage.removeAttribute('src');
          } else {
            studyImage.removeAttribute('src');
          }
          if (answerImageUrl) {
            answerImage.referrerPolicy = 'no-referrer';
            answerImage.loading = isRevealed ? 'eager' : 'lazy';
            if (answerImage.getAttribute('src') !== answerImageUrl) answerImage.src = answerImageUrl;
            answerImage.onerror = () => slide.classList.remove('has-answer-image');
          } else {
            answerImage.removeAttribute('src');
          }
          slide.querySelector('.handle').textContent = activeSheetLabel();
          slide.querySelector('.study-count-stat').textContent = `学習 ${Math.max(0, Math.floor(Number(item.studyCount || 0)))}回`;
          const mood = rankMood(item.rank);
          const moodNode = slide.querySelector('.review-stat');
          moodNode.textContent = mood.face;
          moodNode.setAttribute('aria-label', mood.label);
          moodNode.title = mood.label;
          slide.querySelector('.today-stat').textContent = `今日 ${state.todayPlayCount}`;
          slide.querySelector('.comment-count').textContent = item.comments.length > 0 ? String(item.comments.length) : '0';
          slide.querySelector('.known-action').classList.remove('active');
          slide.querySelector('.known-action').disabled = false;
          slide.querySelector('.tiny-action').disabled = false;
          slide.querySelector('.review-action').disabled = false;
          const promotion = promotionProgress(item);
          slide.querySelector('.tiny-action .action-label').textContent = 'UP';
          slide.querySelector('.tiny-action').title = promotion.target
            ? `UP：${promotion.count}/${promotion.target}` : 'Sランク';
          const againButton = slide.querySelector('.speak-action');
          againButton.disabled = state.againPressedItemIds.has(item.id);
          againButton.setAttribute('aria-label', againButton.disabled ? '本気：このカードは予約済みです' : '本気：もう一度出題する');
          // A low rank is shown in the rank badge, not by pre-highlighting 👎.
          slide.querySelector('.review-action').classList.remove('active');
        });

        toggleAnswer?.classList.toggle('active', state.alwaysShowAnswer);
        toggleReverse.classList.toggle('active', state.reverse);
        syncLeftHandMode();
        toggleReviewOnly?.classList.toggle('active', state.reviewOnly);
        rankFilterTools.forEach((button) => {
          const filter = button.dataset.rankFilter || 'all';
          button.classList.toggle('active', state.rankFilters.includes(filter) || (filter === 'all' && rankFilterIsAll()));
        });
      }

      function applyTextScale(element, text) {
        const length = String(text || '').replace(/\s+/g, '').length;
        element.classList.toggle('long-text', length > 55);
        element.classList.toggle('very-long-text', length > 120);
      }

      function averageRankForPayload(items) {
        const ranks = (items || [])
          .map((item) => Number(item && typeof item === 'object' ? item.rank : NaN))
          .filter((rank) => Number.isFinite(rank));
        if (ranks.length === 0) return null;
        return ranks.reduce((sum, rank) => sum + rank, 0) / ranks.length;
      }

      function updateStatsDisplay() {
        feed.querySelectorAll('.today-stat').forEach((node) => {
          node.textContent = `今日 ${state.todayPlayCount}`;
        });
      }

      function renderWindowSlides() {
        const positions = [state.index - 2, state.index - 1, state.index, state.index + 1, state.index + 2]
          .filter((position) => position >= 0 && position < state.items.length);
        const fragment = document.createDocumentFragment();

        positions.forEach((position) => {
          const node = template.content.firstElementChild.cloneNode(true);
          node.dataset.itemId = state.items[position].id;
          node.dataset.position = String(position);
          const source = sourceItemFor(state.items[position]);
          const hasCardImage = Boolean(source?.questionImageUrl || source?.answerImageUrl);
          const backgroundUrl = hasCardImage ? '' : backgroundForPosition(position);
          const photo = node.querySelector('.photo-bg img');
          if (backgroundUrl) {
            node.classList.add('has-photo');
            node.dataset.backgroundUrl = backgroundUrl;
            node.dataset.bgFit = backgroundFitForUrl(backgroundUrl);
            node.style.setProperty('--card-bg-image', `url("${backgroundUrl.replace(/"/g, '\\"')}")`);
            node.style.setProperty('--card-bg-opacity', '.9');
            photo.referrerPolicy = 'no-referrer';
            photo.loading = position === state.index ? 'eager' : 'lazy';
            photo.decoding = 'async';
            photo.src = backgroundUrl;
            photo.onerror = () => {
              if (state.fixedBackground) return;
              markBackgroundFailed(backgroundUrl);
              if (Number(node.dataset.position) === position) {
                renderWindowSlides();
              }
            };
          } else {
            node.classList.remove('has-photo');
            delete node.dataset.backgroundUrl;
            delete node.dataset.bgFit;
            node.style.removeProperty('--card-bg-image');
            node.style.removeProperty('--card-bg-opacity');
            photo.removeAttribute('src');
          }
          node.style.transform = `translate3d(0, ${(position - state.index) * window.innerHeight}px, 0)`;
          fragment.appendChild(node);
        });

        feed.replaceChildren(fragment);
        updateSlides();
        updateActiveSlideClass();
        preloadAroundIndex(state.index);
      }

      function snapTo(index, animate = true) {
        if (state.snapFrame) {
          cancelAnimationFrame(state.snapFrame);
          state.snapFrame = 0;
        }
        state.previousIndex = state.index;
        state.targetIndex = index;
        if (!animate) {
          state.index = index;
          setFeedInstantTransform('translate3d(0, 0, 0)');
          renderWindowSlides();
          releaseFeedTransition();
          return;
        }

        stopMotionWork();
        preloadAroundIndex(index);
        feed.classList.remove('dragging');
        const offset = -(state.targetIndex - state.previousIndex) * window.innerHeight;
        state.snapFrame = requestAnimationFrame(() => {
          feed.style.transform = `translate3d(0, ${offset}px, 0)`;
          state.snapFrame = 0;
        });
      }

      function commitSlideWindow() {
        setFeedInstantTransform('translate3d(0, 0, 0)');
        renderWindowSlides();
        releaseFeedTransition();
      }

      function setFeedInstantTransform(transform) {
        feed.classList.add('dragging');
        void feed.offsetHeight;
        feed.style.transform = transform;
        void feed.offsetHeight;
      }

      function releaseFeedTransition() {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => feed.classList.remove('dragging'));
        });
      }

      function updateActiveSlideClass() {
        const slides = feed.querySelectorAll('.short');
        slides.forEach((slide) => {
          slide.classList.toggle('active-slide', Number(slide.dataset.position) === state.index);
        });
      }

      
      function loopForward() {
        if (!state.items.length || state.settleCallback || state.rouletteRunning) return;
        scheduleRepeats();
        recordSkipIfUntouched(activeItem());
        commentsPanel.classList.remove('visible');


        const nextIndex = state.index + 1;
        if (nextIndex < state.items.length) {
          snapTo(nextIndex);
          afterSlideSettle(nextIndex, () => {
            markSeen();
            registerSwipe();
            scheduleAuto();
          });
          return;
        }
        state.round += 1;
        rebuildDeck({ keepRound: true });
        registerSwipe();
      }

      function loopBackward() {
        if (state.rouletteRunning) return;
        commentsPanel.classList.remove('visible');
        const nextIndex = state.index - 1;
        if (nextIndex >= 0) {
          snapTo(nextIndex);
          afterSlideSettle(nextIndex, () => {
            markSeen();
            registerSwipe();
            scheduleAuto();
          });
          return;
        }
        state.round = Math.max(1, state.round - 1);
        state.items = weightedDeck(activePool());
        updateSlides();
        snapTo(Math.max(0, state.items.length - 1), false);
        registerSwipe();
      }

      function afterSlideSettle(targetIndex, callback) {
        window.clearTimeout(state.settleTimer);
        state.settleCallback = { targetIndex, callback };
        state.settleTimer = window.setTimeout(finishSlideSettle, 680);
      }

      function finishSlideSettle() {
        if (!state.settleCallback) return;
        window.clearTimeout(state.settleTimer);
        const { targetIndex, callback } = state.settleCallback;
        state.settleCallback = null;
        if (targetIndex !== state.index) {
          commentsPanel.classList.remove('visible');
        }
        state.index = targetIndex;
        removePendingMastered();
        commitSlideWindow();
        callback();
      }

      function stopMotionWork() {
        window.clearTimeout(state.autoTimer);
        window.clearTimeout(state.settleTimer);
        state.settleCallback = null;
      }

      function activeSlide() {
        return [...feed.querySelectorAll('.short')]
          .find((slide) => Number(slide.dataset.position) === state.index);
      }

      function activeItem() {
        return state.items[state.index];
      }

      function activeBackgroundUrl() {
        const slide = activeSlide();
        return slide?.dataset.backgroundUrl || state.backgroundAssignments[backgroundKeyForPosition(state.index)] || '';
      }

      function openDriveSource(url) {
        const item = activeItem();
        const source = sourceItemFor(item);
        const revealed = item ? state.alwaysShowAnswer || state.revealedIds.has(item.id) : false;
        const driveUrl = url || driveUrlForItem(source, revealed);
        if (!driveUrl) {
          showToast('No Drive link');
          return;
        }

        const link = document.createElement('a');
        link.href = driveUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      function deleteActiveBackground() {
        const url = activeBackgroundUrl();
        const targetSheetName = sheetNameForItem(activeItem());
        if (!url) {
          showToast('背景がありません');
          return;
        }

        state.backgroundUrls = state.backgroundUrls.filter((candidate) => candidate !== url);
        state.backgroundOrder = state.backgroundOrder.filter((candidate) => candidate !== url);
        state.sourceItems.forEach((item) => {
          if (item.backgroundUrl === url) item.backgroundUrl = '';
        });
        state.items.forEach((item) => {
          if (item.backgroundUrl === url) item.backgroundUrl = '';
        });
        if (state.lastBackgroundUrl === url) state.lastBackgroundUrl = '';
        Object.keys(state.backgroundAssignments).forEach((key) => {
          if (state.backgroundAssignments[key] === url) {
            state.backgroundAssignments[key] = '';
          }
        });
        renderWindowSlides();
        showToast('背景を削除しました');

        if (!window.google || !google.script || !google.script.run) return;
        google.script.run
          .withSuccessHandler((result) => {

              const row = Number(replacement.row || 0);
              const backgroundUrl = String(replacement.backgroundUrl || '').trim();

              state.sourceItems.forEach((item) => {
                if (item.row === row && sheetNameForItem(item) === targetSheetName) item.backgroundUrl = backgroundUrl;
              });
              state.items.forEach((item) => {
                if (item.row === row && sheetNameForItem(item) === targetSheetName) item.backgroundUrl = backgroundUrl;
              });
              if (!state.backgroundUrls.includes(backgroundUrl)) {
                state.backgroundUrls.push(backgroundUrl);
              }
              preloadImageUrl(backgroundUrl);
            });
            if (replacements.length > 0) renderWindowSlides();
            const deleted = Number(result && result.deleted) || 0;
            showToast(replacements.length > 0 ? `背景を${deleted}件削除、${replacements.length}件補充` : `背景を${deleted}件削除`);
          })
          .withFailureHandler(() => showToast('背景を削除できませんでした'))
          .deleteBackgroundUrl(url, targetSheetName);

      function removeCardFromLocalState(source) {

        state.items = state.items.filter((item) => baseItemId(item) !== source.id);
        state.deckStats.forEach((deck) => {
          if (deck.sheetName !== sourceSheetName) return;
          const sheetItems = state.sourceItems.filter((item) => sheetNameForItem(item) === sourceSheetName);
          deck.cardCount = sheetItems.length;
          deck.averageRank = averageRankForPayload(sheetItems);
        });
        state.pendingRemovalIds.delete(source.id);
        state.revealedIds.delete(source.id);
        delete state.progress[source.id];
        saveProgress();
        state.averageRank = averageRankForPayload(state.sourceItems);

      function moveDrag(offset) {
        feed.classList.add('dragging');
        state.dragOffset = offset;
        if (state.dragFrame) return;
        state.dragFrame = requestAnimationFrame(animateDrag);
      }

      function animateDrag() {
        if (!state.dragging) {
          state.dragFrame = 0;
          return;
        }

        state.renderedDragOffset += (state.dragOffset - state.renderedDragOffset) * 0.42;
        if (Math.abs(state.dragOffset - state.renderedDragOffset) < 0.35) {
          state.renderedDragOffset = state.dragOffset;
        }

        feed.style.transform = `translate3d(0, ${state.renderedDragOffset}px, 0)`;

        if (Math.abs(state.dragOffset - state.renderedDragOffset) > 0.35) {
          state.dragFrame = requestAnimationFrame(animateDrag);
        } else {
          feed.style.transform = `translate3d(0, ${state.renderedDragOffset}px, 0)`;
          state.dragFrame = 0;
        }
      }
      function blockNextTap() {
        state.justDragged = true;
        window.clearTimeout(state.justDraggedTimer);
        state.justDraggedTimer = window.setTimeout(() => {
          state.justDragged = false;
        }, 220);
      }
      function finishDrag(offsetY) {
        const dx = state.currentX - state.startX;
        const dy = state.currentY - state.startY;
        const distance = Math.hypot(dx, dy);
        const threshold = Math.min(80, window.innerHeight * 0.11);

        feed.classList.remove('dragging');

        if (state.dragFrame) {
          cancelAnimationFrame(state.dragFrame);
          state.dragFrame = 0;
        }

        state.renderedDragOffset = 0;

        const mostlyVertical = Math.abs(dy) > Math.abs(dx);
        if (dx > threshold && Math.abs(dx) > Math.abs(dy) * 1.2) {
          blockNextTap();
          snapTo(state.index, false);
          openBooks();
          return;
        }

        // ここ重要：少しでも動いたら、次のpointerupのタップ処理を止める
        if (distance > 8) {
          blockNextTap();
        }

        if (distance > threshold && mostlyVertical) {
          dy < 0 ? loopForward() : loopBackward();
          return;
        }

        snapTo(state.index);
        afterSlideSettle(state.index, () => {});
      }

      function persistRank(item, gradeChanged = true) {
        const source = sourceItemFor(item);
        if (!source || !source.row || !window.google || !google.script || !google.script.run) return;
        google.script.run
          .withSuccessHandler((result) => {

      function recordSkipIfUntouched(item) {
        const source = sourceItemFor(item);
        if (!source || !source.row) return;

        const alreadyTouched = state.touchedIds.has(source.id);
        if (alreadyTouched) return;

        state.touchedIds.add(source.id);

        google.script.run.updateStudySkip(source.row, sheetNameForItem(source));

      function setRank(item, rank, message) {
        if (!item) return;
        const source = sourceItemFor(item);
        const previousRank = source.rank;
        source.rank = normalizeRank(rank);
        state.items.forEach((candidate) => {
          if (baseItemId(candidate) === source.id) candidate.rank = source.rank;
        });
        state.deckStats.forEach((deck) => {
          if (deck.sheetName !== sheetNameForItem(source)) return;
          const sheetItems = state.sourceItems.filter((candidate) => sheetNameForItem(candidate) === deck.sheetName);
          deck.averageRank = averageRankForPayload(sheetItems);
          deck.cardCount = sheetItems.length;
        });
        state.averageRank = averageRankForPayload(state.sourceItems);
        state.lastRankChange = `${formatRank(previousRank)} -> ${formatRank(source.rank)}`;
        state.lastRankChangeItemId = item.id;
        const progress = getProgress(source);
        if (source.rank !== previousRank) resetPromotionProgress(source);
        progress.known = source.rank <= 1;
        progress.review = source.rank >= 3;
        if (source.rank >= 3) progress.miss += 1;
        saveProgress();
        persistRank(source);
        updateSlides();
        if (masteryPanel.classList.contains('visible')) renderMastery();
        if (message) showToast(message);
        if (source.rank <= 1) {
          state.pendingRemovalIds.add(source.id);
          if (previousRank > 1) {
            showMasterEffect();
            showToast('習得済み');
          }
        } else {
          state.pendingRemovalIds.delete(source.id);
        }


        if (source.rank < previousRank) {
          state.touchedIds.add(source.id);
        }

      }

      function removePendingMastered() {
        if (state.pendingRemovalIds.size === 0) return;
        const currentItem = activeItem();
        state.items = state.items.filter((candidate) => !state.pendingRemovalIds.has(baseItemId(candidate)));
        state.pendingRemovalIds.clear();

        if (state.items.length === 0) {
          rebuildDeck({ keepRound: true });
          return;
        }

        const nextIndex = currentItem
          ? state.items.findIndex((candidate) => candidate.id === currentItem.id)
          : state.index;
        state.index = nextIndex >= 0 ? nextIndex : Math.min(state.index, state.items.length - 1);
      }

      function improveRank(fromGesture = false) {
        const item = activeItem();
        if (!item) return;
        flashAction('known-action', 'feedback-got');
        setRank(item, 1, '習得済み：通常の学習には表示しません');
        removePendingMastered();
        if (!state.items.length) { updatePlayback(); return; }
        commitSlideWindow();
        scheduleAuto();

      function improveRankTiny(fromGesture = false) {
        const item = activeItem();
        if (!item) return;
        const source = sourceItemFor(item);
        flashAction('tiny-action', 'feedback-got');
        if (source.rank <= 1) {
          showToast('すでにSランクです');
          return;
        }
        const progress = promotionProgress(source);
        progress.count += 1;
        source.promotionCount = progress.count;
        const saved = getProgress(source);
        saved.promotionCount = progress.count;
        saved.promotionTarget = progress.target;
        saveProgress();
        if (progress.count < progress.target) {
          persistRank(source, false);
          updateSlides();
          showToast(`👍 ${progress.count}/${progress.target}・あと${progress.target - progress.count}回で昇格`);
          if (fromGesture) showDoubleEffect(`${progress.count}/${progress.target}`);
          return;
        }
        const nextGrade = adjacentGrade(source.rank, -1);
        setRank(item, nextGrade, `ランク ${nextGrade} に昇格！`);
        if (fromGesture && nextGrade !== 'S') showDoubleEffect(`ランク ${nextGrade}`);
      }

      function lowerRank(fromGesture = false) {
        const item = activeItem();
        if (!item) return;
        const source = sourceItemFor(item);
        flashAction('review-action', 'feedback-hard');
        const alreadyHardest = source.rank >= 3;
        const nextGrade = adjacentGrade(source.rank, 1);
        resetPromotionProgress(source);
        setRank(item, nextGrade, alreadyHardest ? 'Eランクで再練習' : `ランク ${nextGrade}`);
        if (alreadyHardest) persistRank(source, false);
        if (fromGesture) showDoubleEffect(alreadyHardest ? '繰り返し練習しよう' : `ランク ${nextGrade}`);

      function scheduleRepeats(manual = false) {
        const item = activeItem();
        if (!item) return;
        if (sourceItemFor(item).rank <= 1) {
          if (manual) showToast('習得済みです。復習する場合は👎でランクを戻してください');
          return;
        }
        if (manual && state.againPressedItemIds.has(item.id)) return;
        const key = baseItemId(item);
        if (!manual && (item.isRepeatCopy || state.repeatedIds.has(key))) return;
        if (manual) {
          // Allow one manual reservation per displayed card instance, including each repeat copy.
          state.againPressedItemIds.add(item.id);
          // 手動予約は、このカードの今後の予約を置き換える。
          state.items = state.items.filter((candidate, index) => index <= state.index || !candidate.isRepeatCopy || baseItemId(candidate) !== key);
        }
        state.repeatedIds.add(key);
        // Place each repeat at its final position relative to the current card.
        // Insert in ascending order so earlier repeats do not shift later target positions.
        [2, 4, 7, 10, 12].forEach((offset) => {
          state.items.splice(Math.min(state.items.length, state.index + offset), 0, repeatCopy(item, offset));
        });
        if (manual) {
          renderWindowSlides();
          showToast('もう一度出題するカードに追加しました');
          flashAction('speak-action', 'feedback-answer');
        }
      }

      function speakActive() {
        const item = activeItem();

        const source = sourceItemFor(item);
        const text = englishText(source || item).trim();
        if (!text) {
          showToast('No speech text');

        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        const utterance = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        const englishVoice = voices.find((voice) => /^en[-_]/i.test(voice.lang)) ||
          voices.find((voice) => /english/i.test(voice.name));
        if (englishVoice) utterance.voice = englishVoice;
        utterance.lang = 'en-US';
        utterance.rate = 0.82;
        utterance.onerror = () => showToast('Speech failed');
        window.speechSynthesis.speak(utterance);
        showToast('Speak');

      function normalizedDeckStats() {
        const statsBySheet = new Map();
        (state.deckStats || []).forEach((deck) => {
          const sheetName = String(deck.sheetName || '').trim();
          if (!sheetName) return;
          statsBySheet.set(sheetName, {
            sheetName,
            cardCount: Number(deck.cardCount || 0),
            averageRank: Number.isFinite(Number(deck.averageRank)) ? Number(deck.averageRank) : null,
            todayPlayCount: Number(deck.todayPlayCount || 0),
            totalPlayCount: Number(deck.totalPlayCount || 0),
          });
        });

        state.sourceItems.forEach((item) => {
          const sheetName = sheetNameForItem(item);
          if (!sheetName || statsBySheet.has(sheetName)) return;
          const sheetItems = state.sourceItems.filter((candidate) => sheetNameForItem(candidate) === sheetName);
          statsBySheet.set(sheetName, {
            sheetName,
            cardCount: sheetItems.length,
            averageRank: averageRankForPayload(sheetItems),
            todayPlayCount: 0,
            totalPlayCount: 0,
          });
        });

        return activeSheetNames()
          .map((sheetName) => statsBySheet.get(sheetName))
          .filter(Boolean);
      }

      function deckStatusSummary() {
        const items = state.sourceItems || [];
        const rankBands = ['S', 'A', 'B', 'C', 'D', 'E'].map((label) => ({
          id: label, label, count: 0,
        }));
        let rankSum = 0;
        let rankCount = 0;
        let studyCountSum = 0;
        let studyCountCards = 0;

        items.forEach((item) => {
          const rank = normalizeRank(item.rank);
          const band = rankBands.find((candidate) => candidate.label === rankMood(rank).face);
          band.count += 1;
          rankSum += rank;
          rankCount += 1;
          const studyCount = Math.max(0, Math.floor(Number(item.studyCount || 0)));
          if (Number.isFinite(studyCount)) {
            studyCountSum += studyCount;
            studyCountCards += 1;
          }
        });

        return {
          sheetCount: activeSheetNames().length,
          sheetStats: normalizedDeckStats(),
          cardCount: items.length,
          learningCount: items.filter((item) => normalizeRank(item.rank) > 1).length,
          masteredCount: rankBands[0].count,
          nearMasterCount: rankBands[1].count + rankBands[2].count,
          rankBands,
          averageRank: rankCount > 0 ? rankSum / rankCount : null,
          averageStudyCount: studyCountCards > 0 ? studyCountSum / studyCountCards : null,
          todayPlayCount: state.todayPlayCount,
          totalPlayCount: state.totalPlayCount,
        };
      }

      function rankLineChart(bands, total, cumulative = false) {
        const namespace = 'http://www.w3.org/2000/svg';
        const create = (tag, attrs = {}, label = '') => {
          const node = document.createElementNS(namespace, tag);
          Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
          if (label) node.textContent = label;
          return node;
        };
        const width = 340, height = 180, left = 38, right = 14, top = 15, bottom = 31;
        const plotWidth = width - left - right, plotHeight = height - top - bottom;
        const max = cumulative ? 100 : Math.max(1, ...bands.map((band) => band.count));
        const series = [];
        let running = 0;
        bands.forEach((band) => {
          running += band.count;
          series.push(cumulative ? (total ? running * 100 / total : 0) : band.count);
        });
        const x = (index) => left + index * plotWidth / (bands.length - 1);
        const y = (value) => top + (1 - value / max) * plotHeight;
        const svg = create('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img',
          'aria-label': cumulative ? 'ランクSからEまでの累積割合の折れ線グラフ' : 'ランクSからEまでのカード枚数の折れ線グラフ' });
        [0, .25, .5, .75, 1].forEach((fraction) => {
          const value = max * fraction;
          const pos = y(value);
          svg.appendChild(create('line', { x1: left, y1: pos, x2: width - right, y2: pos, stroke: '#ffffff24', 'stroke-width': 1 }));
          svg.appendChild(create('text', { x: left - 7, y: pos + 4, fill: '#dddddd', 'font-size': 10, 'text-anchor': 'end' },
            cumulative ? `${Math.round(value)}%` : String(Math.round(value))));
        });
        const points = series.map((value, index) => `${x(index)},${y(value)}`).join(' ');
        svg.appendChild(create('polyline', { points, fill: 'none', stroke: cumulative ? '#facc15' : '#67e8f9',
          'stroke-width': 2.8, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
        series.forEach((value, index) => {
          svg.appendChild(create('circle', { cx: x(index), cy: y(value), r: 3.8,
            fill: cumulative ? '#facc15' : '#67e8f9', stroke: '#13201e', 'stroke-width': 1.5 }));
          svg.appendChild(create('text', { x: x(index), y: height - 10, fill: '#ffffff', 'font-size': 11, 'text-anchor': 'middle' }, bands[index].label));
        });
        const frame = document.createElement('div');
        frame.className = 'rank-chart';
        frame.appendChild(svg);
        return frame;
      }

      function renderMastery() {
        masteryTitle.textContent = `${activeSheetLabel()} の学習状況`;
        masterySummary.replaceChildren();
        masteryList.replaceChildren();

        const summary = deckStatusSummary();

      function handleTap(event) {
        if (state.justDragged || state.rouletteRunning) return;
        const target = event.target instanceof Element ? event.target : null;
        if (target?.closest('button, select')) return;

        const now = Date.now();

        if (now - state.lastTapAt < 280) {
          state.lastTapAt = 0;
          window.clearTimeout(state.singleTapTimer);
          improveRankTiny(true);
          return;
        }

        state.lastTapAt = now;
        window.clearTimeout(state.singleTapTimer);

          state.lastTapAt = 0;
          toggleAnswerVisible();

        if (state.settleCallback || now - state.lastWheelAt < 560) return;
        state.lastWheelAt = now;
        event.deltaY > 0 ? loopForward() : loopBackward();

      function requestStudyPayload(sheetNames, onSuccess, onFailure) {
        const key = JSON.stringify(sheetNames);
        const pending = state.pendingPayloadLoads.get(key);
        if (pending) {
          pending.push({ onSuccess, onFailure });
          return;
        }
        const callbacks = [{ onSuccess, onFailure }];
        state.pendingPayloadLoads.set(key, callbacks);
        const complete = (method, result) => {
          state.pendingPayloadLoads.delete(key);
          callbacks.forEach((callback) => callback[method](result));
        };
        google.script.run
          .withSuccessHandler((payload) => complete('onSuccess', payload))
          .withFailureHandler((error) => complete('onFailure', error))
          [sheetNames.length > 1 ? 'getStudyItemsForSheets' : 'getStudyItems'](
            sheetNames.length > 1 ? sheetNames : sheetNames[0] || '');
      }

        requestStudyPayload([name], (payload) => {

          if (state.prefetchBookName === name) state.prefetchedBook = { key, payload };
        }, () => {});

      function syncImagesAfterRender(sheetNames, requestId) {
        if (!window.google?.script?.run || !sheetNames.length) return;
        // Yield the main thread and the first network round-trip to the visible
        // cards before scanning Drive folders.
        window.setTimeout(() => {
          if (requestId !== state.loadRequestId) return;
          const unsynced = sheetNames.filter((name) => !state.syncedImageSheets.has(name));
          if (!unsynced.length) return;
          unsynced.forEach((name) => state.syncedImageSheets.add(name));
          google.script.run
            .withSuccessHandler((result) => {
              if (requestId !== state.loadRequestId) return;
              if (Number(result?.added || 0) + Number(result?.removed || 0) > 0) {
                loadItems(sheetNames, { skipSync: true });
              }
            })
            .withFailureHandler(() => {
              unsynced.forEach((name) => state.syncedImageSheets.delete(name));
            })
            .syncStudyImagesForSheets(unsynced);
        }, 650);
      }
