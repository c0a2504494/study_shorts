<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://drive.google.com">
    <link rel="preconnect" href="https://lh3.googleusercontent.com">
    <link rel="dns-prefetch" href="https://drive.google.com">
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
    <title>Study Shorts</title>
    <style>
      :root {
        color-scheme: dark;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        touch-action: none;
        overscroll-behavior: none;
      }
      button { border: 0; padding: 0; color: inherit; background: transparent; font: inherit; }

      .app {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 25% 18%, rgb(90 130 150 / 24%), transparent 30%),
          linear-gradient(180deg, #0c0c0d 0%, #000 60%, #050505 100%);
      }

      .top-bar {
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: calc(var(--safe-top) + 58px);
        padding: var(--safe-top) calc(var(--safe-right) + 12px) 0 calc(var(--safe-left) + 10px);
        pointer-events: none;
      }
      .top-actions { display: flex; align-items: center; gap: 16px; }
      .icon-button { display: grid; place-items: center; width: 36px; height: 36px; pointer-events: auto; }
      .icon {
        width: 27px;
        height: 27px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
      .feed {
        width: 100%;
        height: 100%;
        transform: translate3d(0, 0, 0);
        transition: transform 560ms cubic-bezier(.22, .72, .18, 1);
        will-change: transform;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .feed.dragging { transition: none; cursor: grabbing; }

      .short {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100dvh;
        min-height: 100%;
        padding: calc(var(--safe-top) + 80px) calc(var(--safe-right) + 74px) calc(var(--safe-bottom) + 118px) calc(var(--safe-left) + 18px);
        display: flex;
        align-items: center;
        justify-content: center;
        isolation: isolate;
        transform: translateZ(0);
        transition: transform 220ms ease, opacity 220ms ease;
        will-change: transform, opacity;
      }
      .app.left-hand-mode .short {
        padding-right: calc(var(--safe-right) + 18px);
        padding-left: calc(var(--safe-left) + 82px);
      }
      .short::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -3;
        background-image: var(--card-bg-image, none);
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        background-color: #050505;
        opacity: var(--card-bg-opacity, 0);
      }
      .photo-bg {
        position: absolute;
        inset: 0;
        z-index: -2;
        display: none;
        place-items: center;
        background: #050505;
        overflow: hidden;
      }
      .short.has-photo .photo-bg { display: grid; }
      .photo-bg img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        opacity: .9;
        filter: saturate(.92) contrast(1.06);
      }
      .short::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(90deg, rgb(0 0 0 / 38%), transparent 22%, transparent 78%, rgb(0 0 0 / 38%)),
          linear-gradient(180deg, rgb(0 0 0 / 44%), rgb(0 0 0 / 14%) 34%, rgb(0 0 0 / 68%) 100%),
          radial-gradient(circle at 50% 38%, rgb(0 0 0 / 4%), rgb(0 0 0 / 46%) 72%),
          linear-gradient(180deg, rgb(255 255 255 / 5%), transparent 18%),
          repeating-linear-gradient(0deg, rgb(255 255 255 / 2%) 0 1px, transparent 1px 6px);
      }

      .study-stage {
        width: min(100%, 760px);
        min-height: 64vh;
        display: grid;
        place-items: center;
        gap: 16px;
        perspective: 1200px;
      }
      .mode-pill {
        display: none;
        min-height: 28px;
        padding: 6px 11px;
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 999px;
        background: rgb(0 0 0 / 35%);
        color: rgb(255 255 255 / 78%);
        font-size: 12px;
        font-weight: 800;
        line-height: 1.1;
      }

      .flip-card {
        width: 100%;
        min-height: min(72vh, 760px);
        display: grid;
        perspective: 1200px;
      }
      .flip-inner {
        position: relative;
        min-height: min(72vh, 760px);
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
        transition: transform 400ms cubic-bezier(.16, 1, .3, 1);
        will-change: transform;
      }
      .short.revealed .flip-inner { transform: rotateY(180deg); }
      .card-face {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 8px 4px;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        transition: opacity 160ms ease;
      }
      .card-front { opacity: 1; }
      .card-back { opacity: 0; }
      .short.revealed .card-front { opacity: 0; }
      .short.revealed .card-back { opacity: 1; }
      .card-back { transform: rotateY(180deg); }
      .study-text, .answer-text {
        margin: 0;
        width: fit-content;
        max-width: 100%;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        letter-spacing: 0;
        text-shadow: 0 3px 0 rgb(0 0 0 / 72%), 0 0 18px rgb(255 255 255 / 18%);
      }
      .study-text {
        font-size: clamp(34px, 10vw, 62px);
        font-weight: 900;
        line-height: 1.18;
      }
      .study-text.long-text { font-size: clamp(22px, 6.2vw, 38px); line-height: 1.28; }
      .study-text.very-long-text { font-size: clamp(16px, 4.7vw, 28px); line-height: 1.34; }
      .answer-text {
        color: rgb(255 255 255 / 92%);
        font-size: clamp(25px, 7vw, 46px);
        font-weight: 900;
        line-height: 1.24;
      }
      .answer-text.long-text { font-size: clamp(20px, 5.5vw, 34px); line-height: 1.3; }
      .answer-text.very-long-text { font-size: clamp(15px, 4.4vw, 25px); line-height: 1.36; }
      .study-image {
        display: none;
        width: auto;
        height: auto;
        max-width: min(96vw, 680px);
        max-height: min(72vh, 760px);
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 18px 44px rgb(0 0 0 / 52%);
      }
      .short.has-question-image .study-text { display: none; }
      .short.has-question-image .study-image { display: block; }
      .answer-image {
        display: none;
        width: auto;
        height: auto;
        max-width: min(96vw, 680px);
        max-height: min(72vh, 760px);
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 18px 44px rgb(0 0 0 / 52%);
      }
      .short.has-answer-image .answer-text { display: none; }
      .short.has-answer-image .answer-image { display: block; }
      .short.has-question-image,
      .short.has-answer-image {
        padding: 0;
      }
      .app.left-hand-mode .short.has-question-image,
      .app.left-hand-mode .short.has-answer-image {
        padding: 0;
      }
      .short.has-question-image .study-stage,
      .short.has-answer-image .study-stage {
        position: absolute;
        inset: 0;
        width: 100%;
        min-height: 100dvh;
        gap: 0;
        z-index: 0;
      }
      .short.has-question-image .mode-pill,
      .short.has-answer-image .mode-pill {
        display: none;
      }
      .short.has-question-image:not(.has-answer-image).revealed .mode-pill,
      .short.has-answer-image:not(.has-question-image):not(.revealed) .mode-pill {
        display: block;
      }
      .short.has-question-image .flip-card,
      .short.has-answer-image .flip-card,
      .short.has-question-image .flip-inner,
      .short.has-answer-image .flip-inner {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
      }
      .short.has-question-image .card-face,
      .short.has-answer-image .card-face {
        padding: 0;
      }
      .short.has-question-image .study-image,
      .short.has-answer-image .answer-image {
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
      .short.has-question-image:not(.has-answer-image) .card-back,
      .short.has-answer-image:not(.has-question-image) .card-front {
        padding: 8px 4px;
      }
      .drive-open-action {
        position: absolute;
        z-index: 8;
        right: calc(var(--safe-right) + 14px);
        bottom: calc(var(--safe-bottom) + 16px);
        display: none;
        align-items: center;
        gap: 7px;
        min-height: 36px;
        padding: 8px 11px;
        border: 1px solid rgb(255 255 255 / 28%);
        border-radius: 999px;
        background: rgb(0 0 0 / 48%);
        color: rgb(255 255 255 / 94%);
        font-size: 12px;
        font-weight: 850;
        line-height: 1;
        box-shadow: 0 10px 24px rgb(0 0 0 / 42%);
        pointer-events: auto;
      }
      .short.has-drive-source .drive-open-action { display: inline-flex; }
      .drive-open-action .icon {
        width: 17px;
        height: 17px;
      }
      .double-effect {
        position: fixed;
        z-index: 21;
        left: 50%;
        top: 50%;
        display: none;
        min-width: 118px;
        transform: translate(-50%, -50%) scale(.82);
        padding: 12px 18px;
        border: 2px solid currentColor;
        border-radius: 999px;
        background: rgb(0 0 0 / 52%);
        color: #67e8f9;
        text-align: center;
        font-size: 15px;
        font-weight: 950;
        box-shadow: 0 0 34px currentColor;
        pointer-events: none;
      }
      .double-effect.visible {
        display: block;
        animation: pop 560ms ease both;
      }
      .double-effect.master-effect {
        color: #facc15;
        background: rgb(32 24 0 / 72%);
        box-shadow: 0 0 28px #facc15, 0 0 70px rgb(250 204 21 / 55%);
      }

      .side-actions {
        position: absolute;
        right: calc(var(--safe-right) + 10px);
        bottom: calc(var(--safe-bottom) + 104px);
        z-index: 8;
        display: flex;
        width: 54px;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .app.left-hand-mode .side-actions {
        right: auto;
        left: calc(var(--safe-left) + 10px);
      }
      .action {
        display: grid;
        justify-items: center;
        gap: 3px;
        width: 54px;
        min-height: 47px;
        text-shadow: 0 1px 3px rgb(0 0 0 / 80%);
        transition: color 140ms ease, transform 140ms ease, filter 140ms ease;
      }
      .action .icon { width: 30px; height: 30px; filter: drop-shadow(0 1px 2px rgb(0 0 0 / 80%)); transition: stroke 140ms ease, filter 140ms ease; }
      .action.active { color: #67e8f9; }
      .action:disabled { opacity: .38; }
      .action.feedback {
        transform: scale(1.18);
        filter: drop-shadow(0 0 14px currentColor);
      }
      .action.feedback-got { color: #4ade80; }
      .action.feedback-hard { color: #fb7185; }
      .action.feedback-answer { color: #facc15; }
      .action-label {
        max-width: 54px;
        overflow-wrap: anywhere;
        font-size: 11px;
        font-weight: 850;
        line-height: 1.1;
      }

      .bottom-meta {
        position: absolute;
        left: calc(var(--safe-left) + 12px);
        right: calc(var(--safe-right) + 82px);
        bottom: calc(var(--safe-bottom) + 16px);
        z-index: 8;
        display: grid;
        gap: 9px;
      }
      .app.left-hand-mode .bottom-meta {
        left: calc(var(--safe-left) + 82px);
        right: calc(var(--safe-right) + 12px);
      }
      .creator-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        width: 100%;
        text-align: left;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        border: 1px solid rgb(255 255 255 / 55%);
        border-radius: 50%;
        background: linear-gradient(135deg, #f5d997, #8fd5d0 48%, #d7b7ff);
        color: #111;
        font-size: 19px;
        font-weight: 900;
      }
      .handle {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 15px;
        font-weight: 850;
      }
      .subscribe {
        display: none;
      }
      .stats { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; overflow: visible; }
      .stat {
        min-width: 0;
        padding: 5px 7px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 999px;
        background: rgb(0 0 0 / 34%);
        color: rgb(255 255 255 / 82%);
        font-size: 11px;
        font-weight: 850;
        line-height: 1.1;
        white-space: nowrap;
      }
      .today-stat {
        min-width: 74px;
        text-align: center;
      }
      .caption {
        display: none;
      }

      .sheet-panel {
        position: fixed;
        z-index: 19;
        left: calc(var(--safe-left) + 10px);
        right: calc(var(--safe-right) + 10px);
        bottom: calc(var(--safe-bottom) + 10px);
        display: grid;
        grid-template-rows: auto 1fr;
        max-width: 410px;
        max-height: min(64vh, 520px);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translate3d(0, 26px, 0) scale(.985);
        transition: opacity 340ms ease, transform 430ms cubic-bezier(.16, 1, .3, 1), visibility 430ms;
        will-change: transform, opacity;
        margin: 0 auto;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 8px;
        background: #111;
        box-shadow: 0 18px 42px rgb(0 0 0 / 52%);
        overflow: hidden;
      }
      .sheet-panel.visible { opacity: 1; visibility: visible; pointer-events: auto; transform: translate3d(0, 0, 0) scale(1); }
      .page-panel {
        inset: 0;
        left: 0;
        right: 0;
        bottom: 0;
        max-width: none;
        max-height: none;
        border: 0;
        border-radius: 0;
        background: #050505;
        transform: translate3d(0, 42px, 0);
      }
      .page-panel.visible { transform: translate3d(0, 0, 0); }
      .page-panel .panel-header {
        min-height: calc(var(--safe-top) + 58px);
        padding: var(--safe-top) calc(var(--safe-right) + 14px) 0 calc(var(--safe-left) + 14px);
      }
      .page-panel .panel-body {
        padding: 16px calc(var(--safe-right) + 14px) calc(var(--safe-bottom) + 18px) calc(var(--safe-left) + 14px);
      }
      @media (min-width: 640px) {
        .page-panel {
          left: 50%;
          right: auto;
          width: min(100vw, 430px);
          transform: translate3d(-50%, 42px, 0);
        }
        .page-panel.visible { transform: translate3d(-50%, 0, 0); }
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 48px;
        padding: 0 14px;
        border-bottom: 1px solid rgb(255 255 255 / 12%);
        font-size: 14px;
        font-weight: 900;
      }
      .panel-close { display: grid; place-items: center; width: 34px; height: 34px; }
      .panel-body {
        min-height: 0;
        padding: 14px;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
      .comment-list { display: grid; gap: 14px; align-content: start; }
      .book-list { display: grid; gap: 8px; align-content: start; }
      .book-actions {
        position: sticky;
        top: -14px;
        z-index: 2;
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 8px;
        margin: -14px -14px 12px;
        padding: 14px;
        background: rgb(8 8 9 / 94%);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid rgb(255 255 255 / 10%);
      }
      .book-item {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 10px;
        min-height: 46px;
        padding: 0 12px;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 8px;
        background: rgb(255 255 255 / 6%);
        color: #fff;
        text-align: left;
        font-size: 14px;
        font-weight: 850;
      }
      .book-item.active {
        border-color: rgb(103 232 249 / 64%);
        background: rgb(103 232 249 / 14%);
      }
      .book-item.dragging {
        opacity: .48;
      }
      .book-item.drop-target {
        border-color: rgb(250 204 21 / 70%);
        background: rgb(250 204 21 / 12%);
      }
      .book-item.editing {
        cursor: grab;
      }
      .book-row {
        display: grid;
        grid-template-columns: 24px 1fr 28px auto;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 10px 0 calc(10px + var(--depth, 0) * 16px);
      }
      .book-row.folder {
        background: rgb(255 255 255 / 4%);
      }
      .book-indent { width: calc(var(--depth, 0) * 16px); }
      .book-toggle {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        color: rgb(255 255 255 / 70%);
      }
      .book-toggle .icon {
        width: 16px;
        height: 16px;
      }
      .book-select {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 6px;
        color: transparent;
      }
      .book-select.checked {
        border-color: rgb(103 232 249 / 74%);
        background: rgb(103 232 249 / 18%);
        color: #67e8f9;
      }
      .book-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .book-name-button {
        min-width: 0;
        color: inherit;
        text-align: left;
        font: inherit;
      }
      .folder-tools {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 5px;
      }
      .folder-tool {
        min-width: 32px;
        min-height: 28px;
        padding: 0 8px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 7px;
        background: rgb(255 255 255 / 8%);
        color: rgb(255 255 255 / 88%);
        font-size: 11px;
        font-weight: 900;
      }
      .folder-tool.danger {
        border-color: rgb(251 113 133 / 42%);
        color: #fb7185;
      }
      .book-meta { color: rgb(255 255 255 / 48%); font-size: 11px; font-weight: 850; }
      .book-actions .tool {
        min-height: 38px;
        padding: 0 10px;
      }
      .book-check { color: #67e8f9; font-size: 12px; font-weight: 900; }
      .comment-item { display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
      .comment-avatar {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, #b7f7c2, #8fd5ff);
        color: #111;
        font-size: 13px;
        font-weight: 900;
      }
      .comment-name { margin: 0 0 3px; color: rgb(255 255 255 / 60%); font-size: 12px; font-weight: 800; }
      .comment-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: rgb(255 255 255 / 90%); font-size: 14px; font-weight: 650; line-height: 1.42; }

      .mastery-summary {
        display: block;
        margin-bottom: 12px;
      }
      .rank-box {
        padding: 8px 6px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 8px;
        background: rgb(255 255 255 / 7%);
        text-align: center;
        font-size: 11px;
        font-weight: 850;
      }
      .mastery-list { display: grid; gap: 8px; }
      .mastery-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 9px 10px;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 8px;
        background: rgb(255 255 255 / 6%);
      }
      .mastery-word { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 850; }
      .rank-select {
        width: 82px;
        min-height: 32px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 7px;
        background: #1d1d1f;
        color: #fff;
        font-size: 12px;
        font-weight: 800;
      }
      .status-hero {
        display: grid;
        gap: 10px;
        margin-bottom: 14px;
        padding: 16px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgb(103 232 249 / 16%), rgb(250 204 21 / 10%)),
          rgb(255 255 255 / 5%);
      }
      .status-kicker {
        margin: 0;
        color: rgb(255 255 255 / 62%);
        font-size: 11px;
        font-weight: 900;
      }
      .status-title {
        margin: 0;
        color: #fff;
        font-size: 25px;
        font-weight: 950;
        line-height: 1.12;
        overflow-wrap: anywhere;
      }
      .status-subtitle {
        margin: 0;
        color: rgb(255 255 255 / 72%);
        font-size: 13px;
        font-weight: 750;
      }
      .status-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 14px;
      }
      .status-card {
        min-width: 0;

    <script>
      const feed = document.getElementById('feed');

      const titleStart = document.getElementById('titleStart');

      const drawer = document.getElementById('drawer');
      // Let a scroll close Settings during its entrance animation. If the
      // gesture starts on Settings, also complete that same swipe on Shorts:
      // touch events cannot retarget to the uncovered card mid-gesture.
      let settingsScrollGesture = null;
      function dismissSettingsOnScroll() {
        if (!drawer.classList.contains('visible')) return false;
        drawer.classList.remove('visible'); // CSS eases out from its current position.
        window.clearTimeout(state.autoTimer);
        return true;
      }
      document.addEventListener('touchstart', (event) => {
        settingsScrollGesture = event.touches.length === 1 && drawer.classList.contains('visible')
          ? {
              x: event.touches[0].clientX,
              y: event.touches[0].clientY,
              fromDrawer: drawer.contains(event.target),
              dismissed: false,
            }
          : null;
      }, { capture: true, passive: true });
      document.addEventListener('touchmove', (event) => {
        const gesture = settingsScrollGesture;
        if (!gesture || event.touches.length !== 1) return;
        const dx = event.touches[0].clientX - gesture.x;
        const dy = event.touches[0].clientY - gesture.y;
        if (!gesture.dismissed && Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx) * 1.2) {
          gesture.dismissed = dismissSettingsOnScroll();
          if (gesture.dismissed && gesture.fromDrawer) event.preventDefault();
        } else if (gesture.dismissed && gesture.fromDrawer) {
          event.preventDefault();
        }
      }, { capture: true, passive: false });
      document.addEventListener('touchend', (event) => {
        const gesture = settingsScrollGesture;
        settingsScrollGesture = null;
        if (!gesture?.dismissed || !gesture.fromDrawer || event.changedTouches.length !== 1) return;
        const dx = event.changedTouches[0].clientX - gesture.x;
        const dy = event.changedTouches[0].clientY - gesture.y;
        event.preventDefault();
        event.stopPropagation(); // Never activate a Settings button after the swipe.
        blockNextTap();
        if (Math.abs(dy) > Math.min(80, window.innerHeight * .11) && Math.abs(dy) > Math.abs(dx) * 1.2) {
          dy < 0 ? loopForward() : loopBackward();
        } else {
          scheduleAuto();
        }
      }, { capture: true, passive: false });
      document.addEventListener('touchcancel', () => {
        if (settingsScrollGesture?.dismissed) scheduleAuto();
        settingsScrollGesture = null;
      }, { capture: true, passive: true });
      document.addEventListener('wheel', (event) => {
        if (!drawer.classList.contains('visible') || Math.abs(event.deltaY) < 8) return;
        const fromDrawer = drawer.contains(event.target);
        dismissSettingsOnScroll();
        if (!fromDrawer) return; // Underlying viewport handles its own wheel event.
        event.preventDefault();
        event.stopPropagation();
        if (state.rouletteRunning || state.settleCallback || Math.abs(event.deltaY) < 18) {
          scheduleAuto();
          return;
        }
        const now = Date.now();
        if (now - state.lastWheelAt < 560) {
          scheduleAuto();
          return;
        }
        state.lastWheelAt = now;
        event.deltaY > 0 ? loopForward() : loopBackward();
      }, { capture: true, passive: false });
      const commentsPanel = document.getElementById('commentsPanel');
      const commentsTitle = document.getElementById('commentsTitle');
      const commentList = document.getElementById('commentList');
      const commentsClose = document.getElementById('commentsClose');
      const masteryPanel = document.getElementById('masteryPanel');
      const masteryTitle = document.getElementById('masteryTitle');
      const masterySummary = document.getElementById('masterySummary');
      const masteryList = document.getElementById('masteryList');
      const masteryClose = document.getElementById('masteryClose');
      const bookPanel = document.getElementById('bookPanel');
      let bookshelfGesture = null;
      let shortsPageGesture = null;
      let pageSwipeSuppressClick = false;
      const pageWidth = () => app.getBoundingClientRect().width;
      const setBooksReveal = (pixels) => {
        app.style.setProperty('--books-reveal', `${Math.max(0, Math.min(pageWidth(), pixels))}px`);
      };
      const clearPageSwipeClick = () => {
        pageSwipeSuppressClick = true;
        window.setTimeout(() => { pageSwipeSuppressClick = false; }, 420);
      };
      function settleBooks(open) {
        // Turning on the transition after a drag lets both pages settle together.
        app.classList.remove('page-dragging');
        if (open) {
          bookPanel.classList.add('visible');
          window.clearTimeout(state.autoTimer);
          setBooksReveal(pageWidth());
        } else {
          setBooksReveal(0);
          bookPanel.classList.remove('visible');
          scheduleAuto();
        }
      }
      bookPanel.addEventListener('touchstart', (event) => {
        if (!bookPanel.classList.contains('visible') || event.touches.length !== 1) return;
        const touch = event.touches[0];
        bookshelfGesture = { x: touch.clientX, y: touch.clientY, horizontal: false };
      }, { passive: true });
      bookPanel.addEventListener('touchmove', (event) => {
        if (!bookshelfGesture || event.touches.length !== 1) return;
        const touch = event.touches[0];
        const dx = touch.clientX - bookshelfGesture.x;
        const dy = touch.clientY - bookshelfGesture.y;
        if (!bookshelfGesture.horizontal && dx < -12 && Math.abs(dx) > Math.abs(dy) * 1.3) {
          bookshelfGesture.horizontal = true;
          app.classList.add('page-dragging');
        }
        if (bookshelfGesture.horizontal) {
          event.preventDefault();
          setBooksReveal(pageWidth() + Math.min(0, dx));
        }
      }, { passive: false });
      bookPanel.addEventListener('touchend', (event) => {
        if (!bookshelfGesture || event.changedTouches.length !== 1) return;
        const gesture = bookshelfGesture;
        bookshelfGesture = null;
        if (!gesture.horizontal) return;
        const dx = event.changedTouches[0].clientX - gesture.x;
        const dy = event.changedTouches[0].clientY - gesture.y;
        clearPageSwipeClick();
        settleBooks(!(dx < -Math.max(70, pageWidth() * .25) && Math.abs(dx) > Math.abs(dy) * 1.3));
      }, { passive: true });
      bookPanel.addEventListener('touchcancel', () => {
        if (bookshelfGesture?.horizontal) settleBooks(true);
        bookshelfGesture = null;
      }, { passive: true });
      bookPanel.addEventListener('click', (event) => {
        if (!pageSwipeSuppressClick) return;
        event.preventDefault();
        event.stopPropagation();
      }, true);
      viewport.addEventListener('touchstart', (event) => {
        if (event.touches.length !== 1 || bookPanel.classList.contains('visible')) return;
        const touch = event.touches[0];
        shortsPageGesture = { x: touch.clientX, y: touch.clientY, horizontal: false };
      }, { capture: true, passive: true });
      viewport.addEventListener('touchmove', (event) => {
        if (!shortsPageGesture || event.touches.length !== 1) return;
        const touch = event.touches[0];
        const dx = touch.clientX - shortsPageGesture.x;
        const dy = touch.clientY - shortsPageGesture.y;
        if (!shortsPageGesture.horizontal && dx > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) {
          shortsPageGesture.horizontal = true;
          stopMotionWork();
          state.dragging = false;
          app.classList.add('page-dragging');
          renderBooks();
          bookPanel.classList.add('visible');
          window.clearTimeout(state.autoTimer);
        }
        if (shortsPageGesture.horizontal) {
          event.preventDefault();
          event.stopImmediatePropagation();
          setBooksReveal(Math.max(0, dx));
        }
      }, { capture: true, passive: false });
      viewport.addEventListener('touchend', (event) => {
        if (!shortsPageGesture || event.changedTouches.length !== 1) return;
        const gesture = shortsPageGesture;
        shortsPageGesture = null;
        if (!gesture.horizontal) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const dx = event.changedTouches[0].clientX - gesture.x;
        const dy = event.changedTouches[0].clientY - gesture.y;
        clearPageSwipeClick();
        blockNextTap();
        settleBooks(dx > Math.max(70, pageWidth() * .25) && Math.abs(dx) > Math.abs(dy) * 1.3);
      }, { capture: true, passive: false });
      viewport.addEventListener('touchcancel', () => {
        if (shortsPageGesture?.horizontal) settleBooks(false);
        shortsPageGesture = null;
      }, { capture: true, passive: true });
      viewport.addEventListener('click', (event) => {
        if (!pageSwipeSuppressClick) return;
        event.preventDefault();
        event.stopPropagation();
      }, true);
      const bookTitle = document.getElementById('bookTitle');
      const bookList = document.getElementById('bookList');
      const studySelectedBooks = document.getElementById('studySelectedBooks');
      const toggleBookEdit = document.getElementById('toggleBookEdit');
      const addBookFolder = document.getElementById('addBookFolder');
      const clearSelectedBooks = document.getElementById('clearSelectedBooks');
      const bookClose = document.getElementById('bookClose');
      const doubleEffect = document.getElementById('doubleEffect');
      const backButton = document.getElementById('backButton');
      const menuButton = document.getElementById('menuButton');
      const rouletteButton = document.getElementById('rouletteButton');
      const toggleAnswer = document.getElementById('toggleAnswer');
      const toggleReverse = document.getElementById('toggleReverse');
      const toggleLeftHandMode = document.getElementById('toggleLeftHandMode');
      const toggleReviewOnly = document.getElementById('toggleReviewOnly');
      const setAllGradeButtons = [...document.querySelectorAll('.set-all-grade')];
      const deleteCurrentCard = document.getElementById('deleteCurrentCard');
      const deleteCurrentBackground = document.getElementById('deleteCurrentBackground');
      const saveBackgroundProbability = document.getElementById('saveBackgroundProbability');
      const clearBackgroundProbability = document.getElementById('clearBackgroundProbability');
      const rankFilterTools = [...document.querySelectorAll('.rank-filter-tool')];

      const STORAGE_KEY = 'study-shorts-vocab-v3';
      const UI_PREFS_KEY = 'study-shorts-ui-prefs-v1';
      // Loading ends as soon as cards are available, without a fixed delay.
      const GRADE_RANKS = Object.freeze({ S: 1, A: 1.1, B: 1.5, C: 2, D: 2.5, E: 3 });
      const state = {
        sourceItems: [],
        items: [],
        backgroundUrls: [],
        backgroundOrder: [],

        failedBackgroundUrls: new Set(),
        backgroundCursor: 0,
