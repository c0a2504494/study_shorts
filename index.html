      function spinRoulette() {
        if (!state.items.length || state.rouletteRunning) return;
        if (state.settleCallback) finishSlideSettle();

        // Never skip a pending Again card: only advance one position. When the
        // next slot is ordinary, swap another ordinary card into that slot.
        scheduleRepeats();
        const origin = state.index;
        const nextIndex = origin + 1;
        if (nextIndex >= state.items.length) {
          recordSkipIfUntouched(activeItem());
          state.round += 1;
          rebuildDeck({ keepRound: true });
            return;
        }

        const nextItem = state.items[nextIndex];
        if (!nextItem.isRepeatCopy) {
          const candidates = [];
          for (let i = nextIndex; i < state.items.length; i += 1) {
            if (!state.items[i].isRepeatCopy) candidates.push(i);
          }
          const chosen = candidates[Math.floor(Math.random() * candidates.length)];
          [state.items[nextIndex], state.items[chosen]] = [state.items[chosen], state.items[nextIndex]];
        }
        // Both the repeat positions and all already-scheduled repeat copies
        // remain intact, including when roulette is used several times.
        recordSkipIfUntouched(state.items[origin]);
        commentsPanel.classList.remove('visible');
        stopMotionWork();
        const finish = () => {
          snapTo(nextIndex, false);
          viewport.classList.remove('roulette-running');
          rouletteButton.classList.remove('rolling');
          state.rouletteRunning = false;
          updatePlayback();
          markSeen();
          scheduleAuto();
          showToast(nextItem.isRepeatCopy ? 'Againの予約カードを出題しました' : 'ルーレットでカードを選びました');
        };

        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reducedMotion) {
          finish();
          return;
        }

        state.rouletteRunning = true;
        updatePlayback();
        rouletteButton.classList.remove('rolling');
        void rouletteButton.offsetWidth;
        rouletteButton.classList.add('rolling');
        viewport.classList.add('roulette-running');
        const previews = state.items.map((_, index) => index).filter((index) => index !== origin);
        const steps = 18;
        let step = 0;
        const advance = () => {
          if (step === steps) {
            finish();
            return;
          }
          const preview = previews[Math.floor(Math.random() * previews.length)];
          snapTo(preview, false);
          step += 1;
          const progress = step / steps;
          window.setTimeout(advance, 45 + 185 * progress * progress);
        };
        advance();
      }

      function rankMood(rank) {
        const value = normalizeRank(rank);
        const face = value <= 1 ? 'S'
          : value < 1.5 ? 'A'
            : value < 2 ? 'B'
              : value < 2.5 ? 'C'
                : value < 3 ? 'D' : 'E';
        return { face, label: `ランク ${face}` };
      }

      function renderBookshelf(nodes, selected = new Set(activeSheetNames()), target = bookList) {
        nodes.forEach((node) => {
          if (node.type === 'folder') {
            const heading = document.createElement('h3');
            heading.className = 'shelf-label';
            heading.textContent = node.name;
            target.appendChild(heading);
            renderBookshelf(node.children || [], selected, target);
            return;
          }
          const book = document.createElement('button');
          book.type = 'button';
          book.className = 'book-cover';
          const isSelected = selected.has(node.sheetName);
          book.classList.toggle('active', isSelected);
          book.setAttribute('aria-label', `${node.name}で学習`);
          const title = document.createElement('span');
          title.className = 'book-name';
          title.textContent = node.name;
          const select = bookCheckNode(isSelected);
          select.classList.add('book-check');
          select.setAttribute('role', 'checkbox');
          select.setAttribute('tabindex', '0');
          select.setAttribute('aria-label', `${node.name}を選択`);
          select.setAttribute('aria-checked', String(isSelected));
          select.addEventListener('click', (event) => { event.stopPropagation(); toggleSheetSelection(node.sheetName); });
          select.addEventListener('keydown', (event) => {
            if (event.key === ' ' || event.key === 'Enter') { event.preventDefault(); event.stopPropagation(); toggleSheetSelection(node.sheetName); }
          });
          book.append(title, select);
          book.addEventListener('click', () => selectBook(node.sheetName));
          target.appendChild(book);
        });
      }

      const studySeek = document.getElementById('studySeek');
      const celebration = document.getElementById('celebration');
      let swipeCount = 0;
      let celebrationFocus = null;
      function updatePlayback() {
        if (!studySeek) return;
        studySeek.max = String(Math.max(0, state.items.length - 1));
        studySeek.value = String(Math.min(state.index, Math.max(0, state.items.length - 1)));
        studySeek.disabled = !state.items.length || state.rouletteRunning;
        studySeek.setAttribute('aria-valuetext', state.items.length ? `${state.items.length}枚中${state.index + 1}枚目` : 'カードがありません');
        rouletteButton.disabled = !state.items.length || state.rouletteRunning;
      }
      studySeek.addEventListener('input', () => {
        if (!state.items.length || state.rouletteRunning) return;
        if (state.settleCallback) finishSlideSettle();
        stopMotionWork();
        snapTo(Number(studySeek.value), false);
        updatePlayback();
      });
      studySeek.addEventListener('change', () => { markSeen(); scheduleAuto(); });
      function registerSwipe() {
        swipeCount += 1;
        const nextMilestone = Math.ceil((swipeCount + 1) / 50) * 50;
        document.getElementById('scrollCounter').textContent = `スクロール ${swipeCount} / ${nextMilestone}`;
        if (swipeCount % 50 !== 0 || celebration.open) return;
        window.clearTimeout(state.autoTimer);
        celebrationFocus = document.activeElement;
        document.getElementById('celebrationTitle').textContent = `${swipeCount}回スクロール達成！`;
        const messages = [
          '50回も学習を続けました！この積み重ねが大きな力になります。',
          '素晴らしい集中力です！ここまで続けた自分を褒めてあげてください。',
          '着実に前進しています！今日の努力は確実に積み重なっています。',
        ];
        document.getElementById('celebrationMessage').textContent = messages[(swipeCount / 50 - 1) % messages.length];
        celebration.querySelector('.celebration-icon').textContent = swipeCount % 100 === 0 ? '🏆' : '🏅';
        celebration.showModal();
        document.getElementById('celebrationClose').focus();
      }
      celebration.addEventListener('cancel', (event) => event.preventDefault());
      document.getElementById('celebrationClose').addEventListener('click', () => {
        celebration.close();
        if (celebrationFocus?.isConnected) celebrationFocus.focus();
        scheduleAuto();
      });
      function updateClock() {
        const now = new Date();
        const clock = document.getElementById('studyClock');
        clock.dateTime = now.toISOString();
        clock.textContent = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
      }
      updateClock();
      window.setInterval(updateClock, 1000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) flushProgress();
        updateClock();
        scheduleAuto();
      });

      loadBooks();
    </script>
  </body>
</html>
