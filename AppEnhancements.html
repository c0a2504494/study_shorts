<style>
  .app-guide,
  .app-confirm {
    position: fixed;
    inset: 0;
    z-index: 10050;
    display: grid;
    place-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
    background: rgb(0 0 0 / 72%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .app-guide[hidden],
  .app-confirm[hidden] { display: none; }
  .app-guide-card,
  .app-confirm-card {
    width: min(100%, 390px);
    border: 1px solid rgb(255 255 255 / 16%);
    border-radius: 24px;
    background: #15181d;
    box-shadow: 0 26px 80px rgb(0 0 0 / 64%);
    color: #fff;
  }
  .app-guide-card { padding: 24px 20px 18px; }
  .app-guide-icon {
    display: grid;
    place-items: center;
    width: 60px;
    height: 60px;
    margin-bottom: 18px;
    border-radius: 18px;
    background: linear-gradient(145deg, rgb(103 232 249 / 26%), rgb(139 92 246 / 26%));
    font-size: 30px;
  }
  .app-guide-step {
    margin: 0 0 8px;
    color: #67e8f9;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .08em;
  }
  .app-guide-title,
  .app-confirm-title {
    margin: 0;
    font-size: 24px;
    font-weight: 950;
    line-height: 1.2;
  }
  .app-guide-body,
  .app-confirm-body {
    margin: 13px 0 0;
    color: rgb(255 255 255 / 72%);
    font-size: 15px;
    font-weight: 650;
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .app-guide-dots {
    display: flex;
    gap: 7px;
    margin: 22px 0 18px;
  }
  .app-guide-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: rgb(255 255 255 / 20%);
  }
  .app-guide-dot.active { width: 24px; background: #67e8f9; }
  .app-guide-actions,
  .app-confirm-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .app-guide-button,
  .app-confirm-button,
  .drawer-help-button {
    min-height: 48px;
    border: 1px solid rgb(255 255 255 / 16%);
    border-radius: 14px;
    background: rgb(255 255 255 / 8%);
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 900;
  }
  .app-guide-button.primary,
  .app-confirm-button.primary {
    background: #fff;
    color: #08090b;
  }
  .app-confirm-button.danger {
    border-color: rgb(251 113 133 / 48%);
    background: #be123c;
    color: #fff;
  }
  .app-guide-button:focus-visible,
  .app-confirm-button:focus-visible,
  .drawer-help-button:focus-visible {
    outline: 3px solid #67e8f9;
    outline-offset: 3px;
  }
  .app-confirm-card { padding: 22px 20px 18px; }
  .app-confirm-actions { margin-top: 22px; }
  .network-status {
    position: fixed;
    z-index: 10040;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 50%;
    max-width: calc(100vw - 32px);
    transform: translate(-50%, -12px);
    padding: 9px 13px;
    border: 1px solid rgb(255 255 255 / 16%);
    border-radius: 999px;
    background: rgb(20 23 28 / 96%);
    color: #fff;
    box-shadow: 0 12px 34px rgb(0 0 0 / 42%);
    font-size: 12px;
    font-weight: 850;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
  }
  .network-status.visible {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .app-help-section { order: -1; }
  .app-help-section .drawer-grid { grid-template-columns: 1fr 1fr; }
  .app-help-note {
    margin: 8px 0 0;
    color: rgb(255 255 255 / 48%);
    font-size: 11px;
    line-height: 1.5;
  }
  @media (prefers-reduced-motion: reduce) {
    .app-guide *,
    .app-confirm *,
    .network-status {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

<div class="network-status" id="networkStatus" role="status" aria-live="polite"></div>

<section class="app-guide" id="appGuide" role="dialog" aria-modal="true" aria-labelledby="appGuideTitle" hidden>
  <div class="app-guide-card">
    <div class="app-guide-icon" id="appGuideIcon" aria-hidden="true">📚</div>
    <p class="app-guide-step" id="appGuideStep"></p>
    <h2 class="app-guide-title" id="appGuideTitle"></h2>
    <p class="app-guide-body" id="appGuideBody"></p>
    <div class="app-guide-dots" id="appGuideDots" aria-hidden="true"></div>
    <div class="app-guide-actions">
      <button class="app-guide-button" id="appGuideSecondary" type="button">スキップ</button>
      <button class="app-guide-button primary" id="appGuidePrimary" type="button">次へ</button>
    </div>
  </div>
</section>

<section class="app-confirm" id="appConfirm" role="alertdialog" aria-modal="true" aria-labelledby="appConfirmTitle" aria-describedby="appConfirmBody" hidden>
  <div class="app-confirm-card">
    <h2 class="app-confirm-title" id="appConfirmTitle">確認</h2>
    <p class="app-confirm-body" id="appConfirmBody"></p>
    <div class="app-confirm-actions">
      <button class="app-confirm-button" id="appConfirmCancel" type="button">キャンセル</button>
      <button class="app-confirm-button primary" id="appConfirmOk" type="button">実行</button>
    </div>
  </div>
</section>

<script>
(() => {
  'use strict';

  const GUIDE_KEY = 'study-shorts-onboarding-v1';
  const GUIDE_STEPS = Object.freeze([
    {
      icon: '📚',
      title: 'Bookを作る',
      body: '起動画面の「Edit selected book」からカードを編集できます。\nスプレッドシートの複数セルを、そのまま貼り付けられます。'
    },
    {
      icon: '👆',
      title: '短時間で復習する',
      body: 'カードをタップして答えを確認します。\nGot、Hard、+0.1を使うと、次回の出題に学習結果が反映されます。'
    },
    {
      icon: '💾',
      title: '端末内へ自動保存',
      body: 'Bookと学習進捗は、この端末のデータベースに保存されます。\n端末変更やデータ削除に備えて、Backupを書き出してください。'
    },
    {
      icon: '⚙️',
      title: '設定はいつでも確認',
      body: '右上の三点メニューから設定できます。\n設定ボタンを長押しすると説明が表示されます。「使い方」からこの案内も再表示できます。'
    }
  ]);

  const PROTECTED_ACTIONS = Object.freeze({
    setAllRankTwo: {
      title: 'すべてのRankを2にしますか？',
      body: '現在のBookにあるカードのRankをまとめて2へ変更します。',
      confirm: 'Rankを2にする'
    },
    setAllRankThree: {
      title: 'すべてのRankを3にしますか？',
      body: '現在のBookにあるカードのRankをまとめて3へ変更します。',
      confirm: 'Rankを3にする'
    },
    deleteCurrentBackground: {
      title: '背景設定を削除しますか？',
      body: '現在表示しているカードの背景設定を削除します。',
      confirm: '削除する',
      danger: true
    },
    deleteRankTwo: {
      title: '対象カードを削除しますか？',
      body: 'この操作はカードを削除します。必要なら先にBackupを書き出してください。',
      confirm: '削除する',
      danger: true
    },
    decrementStudyCounts: {
      title: '学習回数を1減らしますか？',
      body: '現在のBookにあるすべてのカードの学習回数を1減らします。',
      confirm: '1減らす'
    }
  });

  const safeGet = (key) => {
    try { return localStorage.getItem(key); }
    catch (error) { return null; }
  };
  const safeSet = (key, value) => {
    try { localStorage.setItem(key, value); }
    catch (error) {}
  };

  function installManifest() {
    if (!document.querySelector('link[rel="manifest"]')) {
      const manifest = document.createElement('link');
      manifest.rel = 'manifest';
      manifest.href = './manifest.webmanifest';
      document.head.appendChild(manifest);
    }
    if (!document.querySelector('link[rel="icon"]')) {
      const icon = document.createElement('link');
      icon.rel = 'icon';
      icon.href = './app-icon-192.svg';
      icon.type = 'image/svg+xml';
      document.head.appendChild(icon);
    }
  }

  function registerOfflineSupport() {
    if (window.STUDY_SHORTS_RUNTIME === 'capacitor') return;
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch((error) => {
        console.warn('Service worker registration failed:', error);
      });
    }, { once: true });
  }

  function installNetworkStatus() {
    const banner = document.getElementById('networkStatus');
    if (!banner) return;
    let timer = 0;

    const show = (message, persistent = false) => {
      window.clearTimeout(timer);
      banner.textContent = message;
      banner.classList.add('visible');
      if (!persistent) timer = window.setTimeout(() => banner.classList.remove('visible'), 2600);
    };

    const update = () => {
      if (navigator.onLine) show('オンラインに戻りました');
      else show('オフライン：端末内データで利用できます', true);
    };

    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    if (!navigator.onLine) update();
  }

  function installGuide() {
    const guide = document.getElementById('appGuide');
    const icon = document.getElementById('appGuideIcon');
    const step = document.getElementById('appGuideStep');
    const title = document.getElementById('appGuideTitle');
    const body = document.getElementById('appGuideBody');
    const dots = document.getElementById('appGuideDots');
    const secondary = document.getElementById('appGuideSecondary');
    const primary = document.getElementById('appGuidePrimary');
    if (!guide || !icon || !step || !title || !body || !dots || !secondary || !primary) return null;

    let index = 0;
    let previousFocus = null;

    const render = () => {
      const current = GUIDE_STEPS[index];
      icon.textContent = current.icon;
      step.textContent = `${index + 1} / ${GUIDE_STEPS.length}`;
      title.textContent = current.title;
      body.textContent = current.body;
      dots.replaceChildren(...GUIDE_STEPS.map((_, dotIndex) => {
        const dot = document.createElement('span');
        dot.className = `app-guide-dot${dotIndex === index ? ' active' : ''}`;
        return dot;
      }));
      secondary.textContent = index === 0 ? 'スキップ' : '戻る';
      primary.textContent = index === GUIDE_STEPS.length - 1 ? 'はじめる' : '次へ';
    };

    const open = (startIndex = 0) => {
      index = Math.min(GUIDE_STEPS.length - 1, Math.max(0, Number(startIndex) || 0));
      previousFocus = document.activeElement;
      render();
      guide.hidden = false;
      window.setTimeout(() => primary.focus(), 0);
    };

    const close = (remember = true) => {
      guide.hidden = true;
      if (remember) safeSet(GUIDE_KEY, 'done');
      previousFocus?.focus?.();
    };

    secondary.addEventListener('click', () => {
      if (index === 0) close(true);
      else { index -= 1; render(); }
    });
    primary.addEventListener('click', () => {
      if (index === GUIDE_STEPS.length - 1) close(true);
      else { index += 1; render(); }
    });
    guide.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') close(true);
    });

    return { open, close };
  }

  function installDrawerHelp(guideApi) {
    const drawer = document.getElementById('drawer');
    if (!drawer || !guideApi || document.getElementById('openAppGuide')) return;

    const section = document.createElement('div');
    section.className = 'drawer-section app-help-section';
    section.innerHTML = `
      <p class="drawer-label">Help</p>
      <div class="drawer-grid">
        <button class="tool drawer-help-button" id="openAppGuide" type="button">使い方</button>
        <button class="tool drawer-help-button" id="openDataGuide" type="button">保存先</button>
      </div>
      <p class="app-help-note">設定項目を長押しすると、その場で説明を確認できます。</p>`;
    drawer.insertBefore(section, drawer.firstElementChild);
    section.querySelector('#openAppGuide')?.addEventListener('click', () => guideApi.open(0));
    section.querySelector('#openDataGuide')?.addEventListener('click', () => guideApi.open(2));
  }

  function installConfirmations() {
    const dialog = document.getElementById('appConfirm');
    const title = document.getElementById('appConfirmTitle');
    const body = document.getElementById('appConfirmBody');
    const cancel = document.getElementById('appConfirmCancel');
    const ok = document.getElementById('appConfirmOk');
    if (!dialog || !title || !body || !cancel || !ok) return;

    let pendingTarget = null;
    let allowedId = '';
    let previousFocus = null;

    const close = () => {
      dialog.hidden = true;
      pendingTarget = null;
      previousFocus?.focus?.();
    };

    document.addEventListener('click', (event) => {
      const target = event.target instanceof Element ? event.target.closest('button[id]') : null;
      if (!target) return;
      if (target.id === allowedId) {
        allowedId = '';
        return;
      }
      const config = PROTECTED_ACTIONS[target.id];
      if (!config) return;

      event.preventDefault();
      event.stopImmediatePropagation();
      pendingTarget = target;
      previousFocus = target;
      title.textContent = config.title;
      body.textContent = config.body;
      ok.textContent = config.confirm;
      ok.classList.toggle('danger', Boolean(config.danger));
      dialog.hidden = false;
      window.setTimeout(() => cancel.focus(), 0);
    }, true);

    cancel.addEventListener('click', close);
    ok.addEventListener('click', () => {
      if (!pendingTarget) return close();
      const target = pendingTarget;
      allowedId = target.id;
      dialog.hidden = true;
      pendingTarget = null;
      window.setTimeout(() => target.click(), 0);
    });
    dialog.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') close();
    });
  }

  function installAccessibilityLabels() {
    const labels = {
      backButton: 'Book選択へ戻る',
      speakButton: '表示中のカードを読み上げる',
      menuButton: '設定を開く'
    };
    Object.entries(labels).forEach(([id, label]) => {
      const button = document.getElementById(id);
      if (!button) return;
      button.setAttribute('aria-label', label);
      button.removeAttribute('tabindex');
    });
    document.querySelector('.top-bar')?.removeAttribute('aria-hidden');

    const drawer = document.getElementById('drawer');
    if (drawer) {
      drawer.setAttribute('aria-label', '学習設定');
      drawer.querySelectorAll('button').forEach((button) => {
        if (!button.getAttribute('aria-label')) button.setAttribute('aria-label', button.textContent.trim());
      });
    }
  }

  function initializeEnhancements() {
    installManifest();
    registerOfflineSupport();
    installNetworkStatus();
    const guideApi = installGuide();
    installDrawerHelp(guideApi);
    installConfirmations();
    installAccessibilityLabels();

    if (guideApi && safeGet(GUIDE_KEY) !== 'done') {
      window.setTimeout(() => guideApi.open(0), 900);
    }
  }

  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', initializeEnhancements, { once: true });
  } else {
    initializeEnhancements();
  }
})();
</script>
