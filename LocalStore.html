<script>
(() => {
  'use strict';

  const DB_NAME = 'study-shorts';
  const DB_VERSION = 1;
  const BOOK_STORE = 'books';
  const BOOK_SCHEMA_VERSION = 1;
  const COLUMN_COUNT = 7;
  const MAX_ROWS = 5000;
  const APP_CONFIG = Object.freeze({
    appName: 'Study Shorts',
    version: '0.4.0',
    schemaVersion: 1,
    bookSchemaVersion: BOOK_SCHEMA_VERSION,
    storage: 'indexeddb',
  });
  const originalGoogleRun = window.google?.script?.run || null;

  function normalizeRank(value) {
    const rank = Number(value);
    return Math.min(4, Math.max(1, Number.isFinite(rank) ? Math.round(rank * 10) / 10 : 3));
  }

  function normalizeRows(sourceRows) {
    const rows = (Array.isArray(sourceRows) ? sourceRows : [])
      .slice(0, MAX_ROWS)
      .map((source) => Array.from({ length: COLUMN_COUNT }, (_, index) =>
        String(source?.[index] ?? '').replace(/\r\n?/g, '\n').slice(0, 20000)
      ))
      .filter((row) => row.some((value) => value.trim()));
    return rows;
  }

  function defaultBook(name = 'My Book') {
    return {
      schemaVersion: BOOK_SCHEMA_VERSION,
      name,
      rows: [],
      settings: {
        backgroundProbability: null,
        masteredProbability: 0.05,
        fixedBackground: false,
      },
      stats: {
        streak: 0,
        lastLogin: '',
        todayPlayCount: 0,
        totalPlayCount: 0,
      },
      updatedAt: new Date().toISOString(),
      storage: 'indexeddb',
    };
  }

  function openDatabase() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) {
        reject(new Error('IndexedDB is not available on this device.'));
        return;
      }
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(BOOK_STORE)) {
          db.createObjectStore(BOOK_STORE, { keyPath: 'name' });
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Could not open local database.'));
    });
  }

  async function transaction(mode, operation) {
    const db = await openDatabase();
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(BOOK_STORE, mode);
        const store = tx.objectStore(BOOK_STORE);
        let result;
        try {
          result = operation(store, tx);
        } catch (error) {
          reject(error);
          return;
        }
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error || new Error('Local database operation failed.'));
        tx.onabort = () => reject(tx.error || new Error('Local database operation was cancelled.'));
      });
    } finally {
      db.close();
    }
  }

  function requestResult(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Local database request failed.'));
    });
  }

  async function listBooks() {
    const db = await openDatabase();
    try {
      const tx = db.transaction(BOOK_STORE, 'readonly');
      const books = await requestResult(tx.objectStore(BOOK_STORE).getAll());
      return books.sort((a, b) => String(a.name).localeCompare(String(b.name), 'ja'));
    } finally {
      db.close();
    }
  }

  async function getBook(name) {
    const cleanName = String(name || '').trim();
    if (!cleanName) throw new Error('Book name is required.');
    const db = await openDatabase();
    try {
      const tx = db.transaction(BOOK_STORE, 'readonly');
      const book = await requestResult(tx.objectStore(BOOK_STORE).get(cleanName));
      return book || null;
    } finally {
      db.close();
    }
  }

  async function putBook(rawBook) {
    const name = String(rawBook?.name || '').trim().slice(0, 120);
    if (!name) throw new Error('Book name is required.');
    const existing = await getBook(name);
    const next = {
      ...defaultBook(name),
      ...(existing || {}),
      ...(rawBook || {}),
      name,
      rows: normalizeRows(rawBook?.rows ?? existing?.rows ?? []),
      settings: { ...defaultBook(name).settings, ...(existing?.settings || {}), ...(rawBook?.settings || {}) },
      stats: { ...defaultBook(name).stats, ...(existing?.stats || {}), ...(rawBook?.stats || {}) },
      schemaVersion: BOOK_SCHEMA_VERSION,
      storage: 'indexeddb',
      updatedAt: new Date().toISOString(),
    };
    await transaction('readwrite', (store) => store.put(next));
    return next;
  }

  async function ensureDefaultBook() {
    const books = await listBooks();
    if (books.length > 0) return books;
    await putBook(defaultBook());
    return listBooks();
  }

  function averageRank(book) {
    const ranks = book.rows
      .filter((row) => String(row[0] || '').trim())
      .map((row) => normalizeRank(row[3]));
    return ranks.length ? ranks.reduce((sum, rank) => sum + rank, 0) / ranks.length : null;
  }

  function studyPayload(book) {
    return {
      items: book.rows.map((row, index) => ({
        row: index + 1,
        question: String(row[0] || '').trim(),
        answer: String(row[1] || '').trim(),
        skip: Number(row[2]) || 0,
        studyCount: Number(row[2]) || 0,
        rank: normalizeRank(row[3]),
        comments: row.slice(4, 7).map((value) => String(value || '').trim()).filter(Boolean),
        questionImageUrl: '',
        answerImageUrl: '',
        questionDriveUrl: '',
        answerDriveUrl: '',
        backgroundUrl: '',
      })).filter((item) => item.question),
      backgroundUrls: [],
      backgroundProbability: book.settings.backgroundProbability,
      masteredProbability: Number(book.settings.masteredProbability) || 0.05,
      fixedBackground: Boolean(book.settings.fixedBackground),
      averageRank: averageRank(book),
      todayPlayCount: Number(book.stats.todayPlayCount) || 0,
      totalPlayCount: Number(book.stats.totalPlayCount) || 0,
      driveFolders: 0,
      driveImages: 0,
      driveAdded: 0,
      driveRemoved: 0,
      driveErrors: [],
      storage: 'indexeddb',
    };
  }

  async function updateBook(name, mutator) {
    const book = (await getBook(name)) || defaultBook(name);
    await mutator(book);
    return putBook(book);
  }

  function localDateKey(date = new Date()) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  const api = {
    async getAppBootstrap() {
      const books = await ensureDefaultBook();
      return { config: { ...APP_CONFIG }, books: books.map((book) => book.name) };
    },

    async getSheetNames() {
      return (await ensureDefaultBook()).map((book) => book.name);
    },

    async getBookDocument(name) {
      const book = (await getBook(name)) || await putBook(defaultBook(name));
      return {
        schemaVersion: BOOK_SCHEMA_VERSION,
        name: book.name,
        columns: ['question', 'answer', 'studyCount', 'rank', 'comment1', 'comment2', 'comment3'],
        rows: book.rows,
        updatedAt: book.updatedAt,
        storage: 'indexeddb',
      };
    },

    async saveBookDocument(document) {
      const book = await putBook({ name: document?.name, rows: document?.rows });
      return { ok: true, name: book.name, rowCount: book.rows.length, updatedAt: book.updatedAt, storage: 'indexeddb' };
    },

    async getStudyItems(name) {
      const book = (await getBook(name)) || await putBook(defaultBook(name));
      return studyPayload(book);
    },

    async updateStudyRank(row, rank, name) {
      const book = await updateBook(name, (draft) => {
        const index = Number(row) - 1;
        if (!draft.rows[index]) throw new Error('Card was not found.');
        draft.rows[index][3] = String(normalizeRank(rank));
      });
      return { ok: true, row: Number(row), rank: normalizeRank(rank), stats: { averageRank: averageRank(book) } };
    },

    async updateStudySkip(row, name) {
      let next = 0;
      await updateBook(name, (draft) => {
        const index = Number(row) - 1;
        if (!draft.rows[index]) throw new Error('Card was not found.');
        next = (Number(draft.rows[index][2]) || 0) + 1;
        draft.rows[index][2] = String(next);
      });
      return { ok: true, row: Number(row), skip: next };
    },

    async setAllStudyRanks(rank, name) {
      const targetRank = normalizeRank(rank);
      let count = 0;
      const book = await updateBook(name, (draft) => {
        draft.rows.forEach((row) => {
          if (String(row[0] || row[1] || '').trim()) {
            row[3] = String(targetRank);
            count += 1;
          }
        });
      });
      return { ok: true, count, rank: targetRank, stats: { averageRank: averageRank(book) } };
    },

    async decrementAllStudyCounts(name) {
      let updated = 0;
      await updateBook(name, (draft) => {
        draft.rows.forEach((row) => {
          if (row[2] === '' || row[2] === null || typeof row[2] === 'undefined') return;
          const current = Number(row[2]);
          if (!Number.isFinite(current)) return;
          row[2] = String(Math.max(0, current - 1));
          updated += 1;
        });
      });
      return { ok: true, updated };
    },

    async deleteRankTwoRows(name) {
      let deleted = 0;
      await updateBook(name, (draft) => {
        draft.rows = draft.rows.filter((row) => {
          const shouldDelete = String(row[3] || '').trim() && normalizeRank(row[3]) <= 1;
          if (shouldDelete) deleted += 1;
          return !shouldDelete;
        });
      });
      return { ok: true, deleted, compacted: 0 };
    },

    async recordDailyLogin(name) {
      const today = localDateKey();
      const yesterdayDate = new Date();
      yesterdayDate.setDate(yesterdayDate.getDate() - 1);
      const yesterday = localDateKey(yesterdayDate);
      const book = await updateBook(name, (draft) => {
        if (draft.stats.lastLogin !== today) {
          draft.stats.streak = draft.stats.lastLogin === yesterday ? (Number(draft.stats.streak) || 0) + 1 : 1;
          draft.stats.todayPlayCount = 0;
          draft.stats.lastLogin = today;
        }
      });
      return { ok: true, streak: book.stats.streak, today, stats: { ...book.stats, averageRank: averageRank(book) } };
    },

    async recordCardPlay(name) {
      const today = localDateKey();
      const book = await updateBook(name, (draft) => {
        if (draft.stats.lastLogin !== today) {
          draft.stats.todayPlayCount = 0;
          draft.stats.lastLogin = today;
        }
        draft.stats.todayPlayCount = (Number(draft.stats.todayPlayCount) || 0) + 1;
        draft.stats.totalPlayCount = (Number(draft.stats.totalPlayCount) || 0) + 1;
      });
      return {
        ok: true,
        todayPlayCount: book.stats.todayPlayCount,
        totalPlayCount: book.stats.totalPlayCount,
        averageRank: averageRank(book),
      };
    },

    async setBackgroundProbability(probability, name) {
      const raw = String(probability ?? '').trim();
      const value = raw === '' ? null : Math.min(1, Math.max(0, Number(raw)));
      if (raw !== '' && !Number.isFinite(value)) throw new Error('Background probability must be 0 to 1.');
      await updateBook(name, (draft) => { draft.settings.backgroundProbability = value; });
      return { ok: true, backgroundProbability: value };
    },

    async setFixedBackgroundMode(enabled, name) {
      const fixed = enabled === true || enabled === 1 || String(enabled).trim() === '1' || String(enabled).toLowerCase() === 'true';
      await updateBook(name, (draft) => { draft.settings.fixedBackground = fixed; });
      return { ok: true, fixedBackground: fixed };
    },

    async deleteBackgroundUrl() {
      return { ok: true, deleted: 0, replacements: [] };
    },

    async authorizeDriveAccess() {
      return true;
    },
  };

  function createRunner(successHandler, failureHandler) {
    return new Proxy({}, {
      get(_target, property) {
        if (property === 'withSuccessHandler') {
          return (handler) => createRunner(handler, failureHandler);
        }
        if (property === 'withFailureHandler') {
          return (handler) => createRunner(successHandler, handler);
        }
        if (property === 'then') return undefined;
        return (...args) => {
          const method = api[property];
          if (typeof method !== 'function') {
            const error = new Error(`Local storage method is not implemented: ${String(property)}`);
            if (typeof failureHandler === 'function') failureHandler(error);
            else console.error(error);
            return;
          }
          Promise.resolve()
            .then(() => method(...args))
            .then((result) => { if (typeof successHandler === 'function') successHandler(result); })
            .catch((error) => {
              if (typeof failureHandler === 'function') failureHandler(error);
              else console.error(error);
            });
        };
      },
    });
  }

  function callRemote(method, ...args) {
    return new Promise((resolve, reject) => {
      if (!originalGoogleRun) {
        reject(new Error('Google Sheets import is not available in this build.'));
        return;
      }
      originalGoogleRun
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[method](...args);
    });
  }

  async function importFromGoogleSheets() {
    const bootstrap = await callRemote('getAppBootstrap');
    const names = Array.isArray(bootstrap?.books) ? bootstrap.books : [];
    for (const name of names) {
      const document = await callRemote('getBookDocument', name);
      await putBook({ name, rows: document?.rows || [] });
    }
    return names.length;
  }

  async function exportBackup() {
    const payload = {
      schemaVersion: 1,
      exportedAt: new Date().toISOString(),
      storage: 'indexeddb',
      books: await listBooks(),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `study-shorts-backup-${localDateKey()}.json`;
    link.click();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function importBackup(file) {
    const payload = JSON.parse(await file.text());
    if (!Array.isArray(payload?.books)) throw new Error('This is not a Study Shorts backup.');
    for (const book of payload.books) await putBook(book);
    return payload.books.length;
  }

  function refreshLaunchBooks() {
    api.getAppBootstrap().then((payload) => {
      const select = document.getElementById('launchBookSelect');
      if (!select) return;
      const current = select.value;
      select.replaceChildren();
      payload.books.forEach((name) => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      });
      select.value = payload.books.includes(current) ? current : payload.books[0] || '';
      select.disabled = payload.books.length === 0;
      document.getElementById('launchStart')?.toggleAttribute('disabled', payload.books.length === 0);
    });
  }

  function installStorageTools() {
    const actions = document.querySelector('.launch-actions');
    if (!actions || document.getElementById('localStorageTools')) return;
    const tools = document.createElement('div');
    tools.id = 'localStorageTools';
    tools.style.display = 'grid';
    tools.style.gridTemplateColumns = '1fr 1fr';
    tools.style.gap = '8px';

    const makeButton = (text) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'launch-retry';
      button.textContent = text;
      return button;
    };

    const newBook = makeButton('New Book');
    newBook.addEventListener('click', async () => {
      const name = String(window.prompt('Book name') || '').trim();
      if (!name) return;
      await putBook(defaultBook(name));
      refreshLaunchBooks();
    });

    const exportButton = makeButton('Export Backup');
    exportButton.addEventListener('click', () => exportBackup().catch((error) => window.alert(error.message)));

    const importButton = makeButton('Import Backup');
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'application/json,.json';
    fileInput.hidden = true;
    importButton.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      try {
        const count = await importBackup(file);
        refreshLaunchBooks();
        window.alert(`Imported ${count} books.`);
      } catch (error) {
        window.alert(error.message || 'Could not import backup.');
      } finally {
        fileInput.value = '';
      }
    });

    tools.append(newBook, exportButton, importButton, fileInput);

    if (originalGoogleRun) {
      const migrate = makeButton('Import Google Sheets once');
      migrate.style.gridColumn = '1 / -1';
      migrate.addEventListener('click', async () => {
        if (!window.confirm('Copy all current Google Sheets books into this device? Existing local books with the same names will be replaced.')) return;
        migrate.disabled = true;
        try {
          const count = await importFromGoogleSheets();
          refreshLaunchBooks();
          window.alert(`Imported ${count} books. Study Shorts now runs from this device.`);
        } catch (error) {
          window.alert(error.message || 'Import failed.');
        } finally {
          migrate.disabled = false;
        }
      });
      tools.appendChild(migrate);
    }

    actions.appendChild(tools);
  }

  const localRun = createRunner();
  try {
    window.google = window.google || {};
    window.google.script = window.google.script || {};
    window.google.script.run = localRun;
  } catch (error) {
    Object.defineProperty(window, 'google', { configurable: true, value: { script: { run: localRun } } });
  }

  window.studyLocalStore = Object.freeze({
    api,
    listBooks,
    getBook,
    putBook,
    importFromGoogleSheets,
    exportBackup,
    importBackup,
    storage: 'indexeddb',
  });

  ensureDefaultBook().catch(console.error);
  window.addEventListener('DOMContentLoaded', installStorageTools, { once: true });
})();
</script>
