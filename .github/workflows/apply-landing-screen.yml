name: Apply landing screen update

on:
  push:
    branches:
      - feat/landing-book-selection

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/landing-book-selection

      - name: Add landing screen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Index.html')
          text = path.read_text(encoding='utf-8')

          css_anchor = "      .top-bar {\n"
          css = """      .landing-screen {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            place-items: center;
            padding: calc(var(--safe-top) + 28px) calc(var(--safe-right) + 22px) calc(var(--safe-bottom) + 28px) calc(var(--safe-left) + 22px);
            background:
              radial-gradient(circle at 50% 12%, rgb(103 232 249 / 20%), transparent 34%),
              radial-gradient(circle at 18% 82%, rgb(167 139 250 / 18%), transparent 34%),
              linear-gradient(180deg, #111318 0%, #050506 58%, #000 100%);
          }
          .landing-screen.visible { display: grid; }
          .landing-card {
            width: min(100%, 380px);
            padding: 30px 22px 22px;
            border: 1px solid rgb(255 255 255 / 14%);
            border-radius: 26px;
            background: rgb(12 13 16 / 78%);
            box-shadow: 0 28px 80px rgb(0 0 0 / 54%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
          }
          .landing-brand {
            display: grid;
            justify-items: center;
            gap: 10px;
            margin-bottom: 30px;
            text-align: center;
          }
          .landing-icon {
            display: grid;
            place-items: center;
            width: 72px;
            height: 72px;
            border: 1px solid rgb(255 255 255 / 18%);
            border-radius: 22px;
            background: linear-gradient(145deg, rgb(103 232 249 / 26%), rgb(139 92 246 / 24%));
            box-shadow: 0 16px 42px rgb(0 0 0 / 36%), inset 0 1px 0 rgb(255 255 255 / 18%);
            font-size: 34px;
          }
          .landing-kicker {
            margin: 0;
            color: #67e8f9;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .18em;
          }
          .landing-title {
            margin: 0;
            font-size: clamp(34px, 10vw, 48px);
            font-weight: 950;
            line-height: 1;
            letter-spacing: -.045em;
          }
          .landing-subtitle {
            margin: 0;
            color: rgb(255 255 255 / 58%);
            font-size: 13px;
            font-weight: 700;
          }
          .landing-field { display: grid; gap: 9px; }
          .landing-label {
            color: rgb(255 255 255 / 72%);
            font-size: 12px;
            font-weight: 900;
          }
          .landing-select {
            width: 100%;
            min-height: 54px;
            padding: 0 16px;
            border: 1px solid rgb(255 255 255 / 16%);
            border-radius: 14px;
            background: #1a1c21;
            color: #fff;
            font: inherit;
            font-size: 15px;
            font-weight: 850;
            outline: none;
          }
          .landing-select:focus { border-color: rgb(103 232 249 / 72%); }
          .landing-start {
            width: 100%;
            min-height: 54px;
            margin-top: 14px;
            border-radius: 14px;
            background: #fff;
            color: #08090b;
            font-size: 15px;
            font-weight: 950;
            box-shadow: 0 14px 32px rgb(0 0 0 / 34%);
          }
          .landing-start:disabled { opacity: .38; }
          .landing-status {
            min-height: 18px;
            margin: 11px 0 0;
            color: rgb(255 255 255 / 54%);
            text-align: center;
            font-size: 12px;
            font-weight: 750;
          }

          """
          if css_anchor not in text:
              raise SystemExit('CSS anchor not found')
          text = text.replace(css_anchor, css + css_anchor, 1)

          html_anchor = "    <main class=\"app\" aria-label=\"Study Shorts\">\n      <div class=\"top-bar\" aria-hidden=\"true\">\n"
          html = """    <main class="app" aria-label="Study Shorts">
              <section class="landing-screen visible" id="landingScreen" aria-label="Choose a book">
                <div class="landing-card">
                  <header class="landing-brand">
                    <div class="landing-icon" aria-hidden="true">📚</div>
                    <p class="landing-kicker">STUDY APP</p>
                    <h1 class="landing-title">Study Shorts</h1>
                    <p class="landing-subtitle">Choose a book to begin.</p>
                  </header>
                  <div class="landing-field">
                    <label class="landing-label" for="landingBookSelect">Books</label>
                    <select class="landing-select" id="landingBookSelect" disabled>
                      <option>Loading books...</option>
                    </select>
                  </div>
                  <button class="landing-start" id="landingStart" type="button" disabled>Start</button>
                  <p class="landing-status" id="landingStatus" role="status" aria-live="polite">Loading books...</p>
                </div>
              </section>

              <div class="top-bar" aria-hidden="true">
          """
          if html_anchor not in text:
              raise SystemExit('HTML anchor not found')
          text = text.replace(html_anchor, html, 1)

          js_anchor = "      const feed = document.getElementById('feed');\n"
          js_consts = """      const landingScreen = document.getElementById('landingScreen');
              const landingBookSelect = document.getElementById('landingBookSelect');
              const landingStart = document.getElementById('landingStart');
              const landingStatus = document.getElementById('landingStatus');
              const feed = document.getElementById('feed');
          """
          if js_anchor not in text:
              raise SystemExit('JS const anchor not found')
          text = text.replace(js_anchor, js_consts, 1)

          key_anchor = "      const UI_PREFS_KEY = 'study-shorts-ui-prefs-v1';\n"
          if key_anchor not in text:
              raise SystemExit('Storage key anchor not found')
          text = text.replace(key_anchor, key_anchor + "      const LAST_BOOK_KEY = 'study-shorts-last-book-v1';\n", 1)

          function_anchor = "      function renderBooks() {\n"
          landing_functions = """      function preferredBookName() {
                try {
                  const saved = localStorage.getItem(LAST_BOOK_KEY) || '';
                  return state.sheetNames.includes(saved) ? saved : state.sheetNames[0] || '';
                } catch (error) {
                  return state.sheetNames[0] || '';
                }
              }

              function renderLandingBooks() {
                landingBookSelect.replaceChildren();
                const hasBooks = state.sheetNames.length > 0;

                if (!hasBooks) {
                  const option = document.createElement('option');
                  option.textContent = 'No books available';
                  option.value = '';
                  landingBookSelect.appendChild(option);
                  landingBookSelect.disabled = true;
                  landingStart.disabled = true;
                  landingStatus.textContent = 'No spreadsheet sheets were found.';
                  return;
                }

                state.sheetNames.forEach((name) => {
                  const option = document.createElement('option');
                  option.value = name;
                  option.textContent = name;
                  landingBookSelect.appendChild(option);
                });

                const preferred = preferredBookName();
                landingBookSelect.value = preferred;
                state.currentSheet = preferred;
                landingBookSelect.disabled = false;
                landingStart.disabled = false;
                landingStatus.textContent = `${state.sheetNames.length} book${state.sheetNames.length === 1 ? '' : 's'} available`;
              }

              function showLanding() {
                closeAllPanels();
                window.clearTimeout(state.autoTimer);
                landingScreen.classList.add('visible');
                renderLandingBooks();
              }

              function startSelectedBook() {
                const name = String(landingBookSelect.value || '').trim();
                if (!name) {
                  landingStatus.textContent = 'Choose a book first.';
                  return;
                }

                try {
                  localStorage.setItem(LAST_BOOK_KEY, name);
                } catch (error) {}

                state.currentSheet = name;
                landingScreen.classList.remove('visible');
                loadItems(name);
              }

          """
          if function_anchor not in text:
              raise SystemExit('Book function anchor not found')
          text = text.replace(function_anchor, landing_functions + function_anchor, 1)

          back_anchor = "      backButton.addEventListener('click', openBooks);\n"
          back_replacement = """      backButton.addEventListener('click', showLanding);
              landingStart.addEventListener('click', startSelectedBook);
              landingBookSelect.addEventListener('change', () => {
                state.currentSheet = landingBookSelect.value;
                landingStatus.textContent = landingBookSelect.value ? 'Ready to start' : 'Choose a book first.';
              });
              landingBookSelect.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' && !landingStart.disabled) {
                  event.preventDefault();
                  startSelectedBook();
                }
              });
          """
          if back_anchor not in text:
              raise SystemExit('Back button anchor not found')
          text = text.replace(back_anchor, back_replacement, 1)

          load_books_old = """      function loadBooks() {
                if (!window.google || !google.script || !google.script.run) {
                  loadItems('Demo');
                  return;
                }

                google.script.run
                  .withSuccessHandler((names) => {
                    state.sheetNames = names || [];
                    state.currentSheet = state.currentSheet || state.sheetNames[0] || '';
                    loadItems(state.currentSheet);
                  })
                  .withFailureHandler(() => loadItems())
                  .getSheetNames();
              }
          """
          load_books_new = """      function loadBooks() {
                if (!window.google || !google.script || !google.script.run) {
                  state.sheetNames = ['Demo', 'TOEIC'];
                  renderLandingBooks();
                  hideLoading();
                  return;
                }

                google.script.run
                  .withSuccessHandler((names) => {
                    state.sheetNames = Array.isArray(names) ? names.filter(Boolean) : [];
                    renderLandingBooks();
                    hideLoading();
                  })
                  .withFailureHandler(() => {
                    state.sheetNames = [];
                    renderLandingBooks();
                    hideLoading();
                    landingStatus.textContent = 'Could not load books. Reload the app.';
                  })
                  .getSheetNames();
              }
          """
          if load_books_old not in text:
              raise SystemExit('loadBooks block not found')
          text = text.replace(load_books_old, load_books_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Check client JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('Index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*)</script>', text, re.S)
          if not match:
              raise SystemExit('Script block not found')
          Path('/tmp/study-shorts.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/study-shorts.js

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-landing-screen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add initial book selection screen"
          git push origin HEAD:feat/landing-book-selection
