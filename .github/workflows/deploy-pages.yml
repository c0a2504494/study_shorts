name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: STUDY_SHORTS_RUNTIME=github-pages npm run build
      - name: Validate standalone app
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/service-worker.js
          test -f dist/app-icon-192.svg
          test -f dist/app-icon-512.svg
          ! grep -q '<?' dist/index.html
          grep -q 'STUDY_SHORTS_RUNTIME = "github-pages"' dist/index.html
          grep -q "const DB_NAME = 'study-shorts'" dist/index.html
          grep -q 'id="launchStart"' dist/index.html
          grep -q 'id="appGuide"' dist/index.html
          grep -q 'id="appConfirm"' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
