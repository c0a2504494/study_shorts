name: Mobile build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts

      - name: Build Capacitor app
        run: npm run build
      - name: Validate Capacitor output
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/service-worker.js
          test -f dist/app-icon-192.svg
          test -f dist/app-icon-512.svg
          ! grep -q '<?' dist/index.html
          grep -q 'STUDY_SHORTS_RUNTIME = "capacitor"' dist/index.html
          grep -q "const DB_NAME = 'study-shorts'" dist/index.html
          grep -q 'id="launchStart"' dist/index.html
          grep -q 'id="appGuide"' dist/index.html
          grep -q 'id="appConfirm"' dist/index.html

      - name: Build GitHub Pages app
        run: STUDY_SHORTS_RUNTIME=github-pages npm run build
      - name: Validate GitHub Pages output
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/service-worker.js
          grep -q 'STUDY_SHORTS_RUNTIME = "github-pages"' dist/index.html
          grep -q 'navigator.serviceWorker.register' dist/index.html
          grep -q 'id="appGuide"' dist/index.html
          grep -q 'id="appConfirm"' dist/index.html
