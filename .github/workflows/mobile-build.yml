name: Mobile build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Validate standalone output
        run: |
          test -f dist/index.html
          ! grep -q '<?' dist/index.html
          grep -q 'STUDY_SHORTS_RUNTIME = "capacitor"' dist/index.html
          grep -q "const DB_NAME = 'study-shorts'" dist/index.html
          grep -q 'id="launchStart"' dist/index.html
