name: Apply landing screen in PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply prepared update
        shell: bash
        run: |
          awk '
            /- name: Add landing screen/ { found=1; next }
            found && /run: \|/ { capture=1; next }
            capture && /^      - name:/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-landing-screen.yml > /tmp/apply-landing.sh
          test -s /tmp/apply-landing.sh
          bash /tmp/apply-landing.sh

          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('Index.html').read_text(encoding='utf-8')
          required = ['landingScreen', 'landingBookSelect', 'landingStart', 'renderLandingBooks', 'startSelectedBook']
          missing = [name for name in required if name not in text]
          if missing:
              raise SystemExit(f'Missing landing elements: {missing}')
          match = re.search(r'<script>(.*)</script>', text, re.S)
          if not match:
              raise SystemExit('Script block not found')
          Path('/tmp/study-shorts.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/study-shorts.js

      - name: Commit landing screen
        shell: bash
        run: |
          rm .github/workflows/apply-landing-screen.yml
          rm .github/workflows/apply-landing-pr.yml
          rm -f .github/landing-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add initial book selection screen"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
